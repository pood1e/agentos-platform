- name: Publish environment connections
  ansible.builtin.import_playbook: connections.yaml

- name: Initialize native template bindings
  hosts: environments
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Read existing engineer registrations
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_kubeconfig }}"
        api_version: api.kagent.dev/v1alpha3
        kind: RemoteMCPServer
        namespace: "{{ agentos_namespace }}"
        label_selectors: ["app.kubernetes.io/instance={{ connections_release }}", "agentos.dev/environment={{ environment_name }}"]
      register: existing_registrations
      when: existing_engineer_servers is not defined

    - name: Preserve saved tool selections
      ansible.builtin.set_fact:
        existing_engineer_servers: "{{ existing_registrations.resources | map(attribute='metadata.name') | list }}"
      when: existing_engineer_servers is not defined

    - name: Read the managed connection release
      kubernetes.core.helm_info:
        kubeconfig: "{{ platform_kubeconfig }}"
        binary_path: "{{ helm_binary }}"
        name: "{{ connections_release }}"
        release_namespace: "{{ agentos_namespace }}"
      register: installed_connections
      no_log: true

    - name: Wait for managed MCP discovery
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_kubeconfig }}"
        api_version: api.kagent.dev/v1alpha3
        kind: RemoteMCPServer
        namespace: "{{ agentos_namespace }}"
        name: "{{ item.metadata.name }}"
        wait: true
        wait_condition: {type: Accepted, status: 'True'}
        wait_timeout: 300
      loop: "{{ installed_connections.status.manifest | selectattr('kind', 'equalto', 'RemoteMCPServer') | list }}"
      loop_control: {label: "{{ item.metadata.name }}"}
      when: inventory_hostname == groups['environments'][-1]

    - name: Read preset engineer bindings
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_kubeconfig }}"
        api_version: api.kagent.dev/v1alpha3
        kind: AgentTemplate
        namespace: "{{ agentos_namespace }}"
      register: connected_templates

    - name: Initialize tools for new engineer service connections
      kubernetes.core.k8s_json_patch:
        kubeconfig: "{{ platform_kubeconfig }}"
        api_version: api.kagent.dev/v1alpha3
        kind: AgentTemplate
        namespace: "{{ agentos_namespace }}"
        name: "{{ role_resource.metadata.name }}"
        patch:
          - {op: test, path: /metadata/resourceVersion, value: "{{ role_resource.metadata.resourceVersion }}"}
          - {op: add, path: /spec/tools, value: "{{ initialized_tools }}"}
      vars:
        initialized_tools: "{{ lookup('ansible.builtin.template', 'templates/initialize-service-tools.yaml.j2') | from_yaml }}"
      loop: "{{ connected_templates.resources }}"
      loop_control:
        loop_var: role_resource
        label: "{{ role_resource.metadata.name }}"
      when:
        - role_resource.metadata.name in (engineer_identities | rejectattr('name', 'equalto', 'catalog') | map(attribute='name') | list)
        - initialized_tools != role_resource.spec.tools | default([])
