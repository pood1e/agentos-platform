# Defaults and values derived from the solution's chart values. Site inventories and variables are passed at
# deployment time; see docs/environments.md.
agentos_namespace: agentos
platform_release: agentos
platform_gateway: "{{ platform_release }}-gateway"
platform_kubeconfig: "{{ playbook_dir }}/../.cache/kubeconfig.yaml"
helm_binary: "{{ playbook_dir }}/../.cache/helm/linux-amd64/helm"
chart_cache: "{{ playbook_dir }}/../.cache/environments/charts"
environment_cache: "{{ playbook_dir }}/../.cache/environments/{{ environment_name }}"
kubeconfig: "{{ environment_kubeconfig | default(environment_cache ~ '/kubeconfig.yaml') }}"
gateway_namespace: mcp
gateway_node_port: 31000
gateway_rules: []
approval_service_url: ""
approval_service_authorization_file: ""
registry_config_file: ""
agentos_config: "{{ (lookup('ansible.builtin.file', agentos_values_file) | from_yaml).global.agentos }}"
toolsets: >-
  {{ agentos_config.toolsets | dict2items
     | selectattr('key', 'in', environment_connectors.keys() | list) | items2dict }}
toolset_revision: "{{ (toolsets | to_json | hash('sha256'))[:16] }}"
environment_governance: "{{ (agentos_config.environments | selectattr('name', 'equalto', environment_name) | first).governance }}"
engineer_identities: >-
  {{ (agentos_config.identities | rejectattr('environments', 'defined') | list)
     + (agentos_config.identities | selectattr('environments', 'defined')
        | selectattr('environments', 'contains', environment_name) | list) }}
retired_engineer_identities: >-
  {{ agentos_config.identities | rejectattr('name', 'in', engineer_identities | map(attribute='name') | list) | list }}
agentgateway_version: v1.6.0
gateway_charts:
  - name: agentgateway
    checksum: 4a0064af58aabe04b4a9fedc08349028dc0d0eb4dc5eb15f9a26ebbcdb6360cf
  - name: agentgateway-crds
    checksum: 49e4c65fb8b1119305a64af3b1f2229d31340e8af448d6b34dbf5a5360d25560
