---
- name: Publish managed environment connection releases
  hosts: environments
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Require the complete inventory for the shared connection release
      ansible.builtin.assert:
        that: ansible_play_hosts_all | sort == groups['environments'] | sort
        fail_msg: The shared connection release requires the complete environments inventory.
        quiet: true

    - name: Require the versioned environment charts
      ansible.builtin.assert:
        that:
          - environment_chart_repository | length > 0
          - environment_chart_version | length > 0
        quiet: true

    - name: Read the environment gateway certificate authority
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ gateway_namespace }}"
        name: mcp-gateway-tls
      register: gateway_certificate
      when: environment_state == 'present'
      no_log: true

    - name: Record environment connection inputs
      ansible.builtin.set_fact:
        environment_connection: "{{ lookup('ansible.builtin.template', 'templates/connection-values.json.j2') | from_json }}"
      when: environment_state == 'present'
      no_log: true

    - name: Clear retired environment connection inputs
      ansible.builtin.set_fact:
        environment_connection:
      when: environment_state == 'absent'

    - name: Create the connection chart cache
      ansible.builtin.file:
        path: "{{ chart_cache }}"
        state: directory
        mode: "0700"
      when: inventory_hostname == groups['environments'][-1]

    - name: Discover native runtime trust
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/discover-runtime.py"
          - --kubeconfig
          - "{{ platform_kubeconfig }}"
      register: runtime_discovery
      changed_when: false
      check_mode: false
      when: inventory_hostname == groups['environments'][-1]

    - name: Write the platform connection release values
      ansible.builtin.copy:
        content: >-
          {{ {'platform': {'release': platform_release, 'controllerServiceAccount': native_controller_service_account,
                           'actorIssuer': native.platform_actor_issuer},
              'environments': groups['environments'] | map('extract', hostvars) | selectattr('environment_connection', 'defined')
                              | selectattr('environment_connection')
                              | map(attribute='environment_connection') | list} | to_nice_json }}
        dest: "{{ chart_cache }}/connections-values.json"
        mode: "0600"
      vars:
        native: "{{ runtime_discovery.stdout | from_json }}"
      when: inventory_hostname == groups['environments'][-1]
      no_log: true

    - name: Install the platform connection release
      kubernetes.core.helm:
        kubeconfig: "{{ platform_kubeconfig }}"
        binary_path: "{{ helm_binary }}"
        name: "{{ connections_release }}"
        chart_ref: "{{ environment_chart_repository }}/agentos-connections"
        chart_version: "{{ environment_chart_version }}"
        release_namespace: "{{ agentos_namespace }}"
        reset_values: true
        history_max: 3
        values_files: ["{{ chart_cache }}/connections-values.json"]
        wait: true
        timeout: 10m
      when: inventory_hostname == groups['environments'][-1]
      no_log: true
