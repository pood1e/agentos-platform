- name: Require change-control inputs
  ansible.builtin.assert:
    that:
      - change_control_image is match('^.+@sha256:[a-f0-9]{64}$')
      - change_control_database_url_file | length > 0
      - approval_url | default('') is match('^https://')
    fail_msg: Approval environments require change_control_image, change_control_database_url_file and approval_url.
    quiet: true

- name: Configure the reference approval provider
  ansible.builtin.import_tasks: zammad-approvals.yaml

- name: Deploy environment change control
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition: "{{ lookup('ansible.builtin.template', 'templates/change-control.yaml.j2') | from_yaml_all | list }}"
  no_log: true

- name: Wait for environment change control
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: apps/v1
    kind: Deployment
    name: change-control
    namespace: "{{ gateway_namespace }}"
    wait: true
    wait_condition: {type: Available, status: 'True'}
    wait_timeout: 300
