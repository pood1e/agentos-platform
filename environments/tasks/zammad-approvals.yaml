- name: Find Zammad application
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ zammad_namespace }}"
    label_selectors: [app.kubernetes.io/component=zammad-railsserver]
    field_selectors: [status.phase=Running]
  register: zammad_pods

- name: Configure native Zammad approval objects
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig }}"
    namespace: "{{ zammad_namespace }}"
    pod: "{{ zammad_pods.resources[0].metadata.name }}"
    command: "bundle exec rails runner {{ lookup('ansible.builtin.file', 'zammad/approvals.rb') | quote }}"
  register: zammad_approvals
  failed_when: zammad_approvals.rc | default(1) != 0
  changed_when: "'\"changed\":true' in (zammad_approvals.stdout | default(''))"
  notify: [Refresh Zammad schema caches, Wait for refreshed Zammad applications]
  no_log: true

- name: Load approval references
  ansible.builtin.set_fact:
    zammad_approver_role: "{{ zammad_references.approver_role_id }}"
    zammad_coordinator_token: "{{ zammad_references.coordinator_token }}"
  vars:
    zammad_references: "{{ zammad_approvals.stdout_lines | select('match', '^\\{.*approver_role_id') | last | from_json }}"
  no_log: true
