---
- name: Write environment Helm values
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', 'templates/environment-values.json.j2') }}"
    dest: "{{ environment_cache }}/gateway-values.json"
    mode: "0600"
  when: environment_state == 'present'
  no_log: true

- name: Install verified environment gateway release
  ansible.builtin.include_tasks: ../../deploy/tasks/install-chart.yaml
  vars:
    delivery_chart: "{{ environment_chart_repository }}/agentos-environment"
    delivery_release: "{{ environment_release }}"
    delivery_namespace: "{{ gateway_namespace }}"
    delivery_values_file: "{{ environment_cache }}/gateway-values.json"
    delivery_kubeconfig: "{{ kubeconfig }}"
  when: environment_state == 'present'

- name: Wait for the gateway certificate
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: "{{ gateway_namespace }}"
    name: mcp-gateway
    wait: true
    wait_condition: { type: Ready, status: "True" }
    wait_timeout: 180
  when: environment_state == 'present'

- name: Wait for the environment gateway
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: mcp-gateway
    namespace: "{{ gateway_namespace }}"
    wait: true
    wait_condition: { type: Programmed, status: "True" }
    wait_timeout: 300
  when: environment_state == 'present'
