---
- name: Read current engineer bindings
  kubernetes.core.k8s_info:
    kubeconfig: "{{ platform_kubeconfig }}"
    api_version: api.kagent.dev/v1alpha3
    kind: AgentTemplate
    namespace: "{{ agentos_namespace }}"
  register: retiring_templates

- name: Unbind retired service access through the native template API
  kubernetes.core.k8s_json_patch:
    kubeconfig: "{{ platform_kubeconfig }}"
    api_version: api.kagent.dev/v1alpha3
    kind: AgentTemplate
    namespace: "{{ agentos_namespace }}"
    name: "{{ role_resource.metadata.name }}"
    patch:
      - { op: test, path: /metadata/resourceVersion, value: "{{ role_resource.metadata.resourceVersion }}" }
      - { op: replace, path: /spec/tools, value: "{{ pruned_tools }}" }
  vars:
    pruned_tools: "{{ lookup('ansible.builtin.template', 'templates/prune-engineer-tools.yaml.j2') | from_yaml }}"
  loop: "{{ retiring_templates.resources }}"
  loop_control:
    loop_var: role_resource
    label: "{{ role_resource.metadata.name }}"
  when: pruned_tools != role_resource.spec.tools | default([])
