.go-verify:
  extends: [.agentos-go, .agentos-postgres]
  stage: verify
  retry:
    max: 2
    when: [runner_system_failure]

controller-verify:
  extends: .go-verify
  rules: &controller-rules
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: &controller-paths
        - runtime/kagent/**/*
        - runtime/harness-toolbox/**/*
        - runtime/substrate/**/*
        - third_party/kagent/**/*
        - third_party/substrate/ateapi.proto
        - ci/verify-controller.sh
        - ci/prepare-substrate.sh
        - ci/toolchain.gitlab-ci.yml
        - mise.*
        - ci/runtime.gitlab-ci.yml
        - ci/build.gitlab-ci.yml
        - ci/build-image.sh
    - if: '$CI_COMMIT_BRANCH'
      changes:
        compare_to: refs/heads/main
        paths: *controller-paths
  script:
    - psql "$CHANGE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
    - ci/verify-controller.sh
  artifacts:
    paths: [.cache/controller-image/, .cache/claude-image/, .cache/standard-image/, .cache/codex-image/]
    expire_in: 1 day

substrate-verify:
  extends: .go-verify
  rules: &substrate-rules
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: &substrate-paths
        - runtime/substrate/**/*
        - third_party/substrate/ateapi.proto
        - ci/verify-substrate.sh
        - ci/prepare-substrate.sh
        - ci/toolchain.gitlab-ci.yml
        - mise.*
        - ci/runtime.gitlab-ci.yml
        - ci/build.gitlab-ci.yml
        - ci/build-image.sh
    - if: '$CI_COMMIT_BRANCH'
      changes:
        compare_to: refs/heads/main
        paths: *substrate-paths
  script:
    - psql "$CHANGE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
    - ci/verify-substrate.sh
  artifacts:
    paths: [.cache/substrate-image/]
    expire_in: 1 day

build-controller:
  extends: .build-image
  rules: *controller-rules
  needs: [controller-verify]
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/controller-image
    AGENTOS_DOCKERFILE_DIR: runtime/kagent
    AGENTOS_IMAGE_SUFFIX: /kagent-controller
    AGENTOS_BUILD_METADATA: .cache/controller-build-metadata.json
  artifacts:
    paths: [.cache/controller-build-metadata.json]
    expire_in: 1 day

build-substrate-api:
  extends: .build-image
  rules: *substrate-rules
  needs: [substrate-verify]
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/substrate-image
    AGENTOS_DOCKERFILE_DIR: runtime/substrate/ateapi
    AGENTOS_IMAGE_SUFFIX: /substrate/ateapi
    AGENTOS_BUILD_METADATA: .cache/substrate-api-build-metadata.json
  artifacts:
    paths: [.cache/substrate-api-build-metadata.json]
    expire_in: 1 day

build-substrate-microvm:
  extends: build-substrate-api
  variables:
    AGENTOS_DOCKERFILE_DIR: runtime/substrate/microvm
    AGENTOS_IMAGE_SUFFIX: /substrate/ateworker-microvm
    AGENTOS_BUILD_METADATA: .cache/substrate-microvm-build-metadata.json
  artifacts:
    paths: [.cache/substrate-microvm-build-metadata.json]
    expire_in: 1 day

build-claude-harness:
  extends: .build-image
  rules: *controller-rules
  needs: [controller-verify]
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/claude-image
    AGENTOS_DOCKERFILE_DIR: runtime/kagent/claude
    AGENTOS_IMAGE_SUFFIX: /claude-harness
    AGENTOS_BUILD_METADATA: .cache/claude-harness-build-metadata.json
  artifacts:
    paths: [.cache/claude-harness-build-metadata.json]
    expire_in: 1 day

build-standard-harness:
  extends: .build-image
  needs: [controller-verify]
  rules: *controller-rules
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/standard-image
    AGENTOS_DOCKERFILE_DIR: runtime/harness-toolbox
    AGENTOS_HARNESS_IMAGE: ghcr.io/kagent-dev/kagent/golang-adk:1.0.0-alpha17@sha256:d20d411759d7bb549f00b7d6e8d669b91694aeb57dce847dcd2cbb68aa0d45f3
    AGENTOS_IMAGE_SUFFIX: /standard-harness
    AGENTOS_BUILD_METADATA: .cache/standard-harness-build-metadata.json
  artifacts:
    paths: [.cache/standard-harness-build-metadata.json]
    expire_in: 1 day

build-codex-harness:
  extends: build-standard-harness
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/codex-image
    AGENTOS_HARNESS_IMAGE: ghcr.io/kagent-dev/kagent/codex-harness:1.0.0-alpha17@sha256:1c8565efce78c420b6726c68eaf010363fafd4eeec0c1afcd317d9e517434c22
    AGENTOS_IMAGE_SUFFIX: /codex-harness
    AGENTOS_BUILD_METADATA: .cache/codex-harness-build-metadata.json
  artifacts:
    paths: [.cache/codex-harness-build-metadata.json]
    expire_in: 1 day
