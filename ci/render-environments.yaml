- name: Render the environment kit for validation
  hosts: environments
  connection: local
  gather_facts: false
  vars_files: [../environments/vars.yaml]
  vars:
    out: "{{ playbook_dir }}/../.cache/environment-check"
    templates: "{{ playbook_dir }}/../environments/templates"
    existing_services: []
    existing_engineer_servers: []
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Publish environment resource coordinates
      ansible.builtin.set_fact:
        environment_issuer: "{{ environment_issuer }}"
        gateway_resource: "{{ gateway_resource }}"

    - name: Create output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: ["{{ out }}", "{{ environment_cache }}/secrets"]

    - name: Render environment manifests
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', templates + '/' + item + '.yaml.j2') }}"
        dest: "{{ out }}/{{ environment_name }}-{{ item }}.yaml"
        mode: "0600"
      loop: "{{ ['gateway', 'backends', 'platform-credentials', 'platform-services'] }}"

    - name: Load rendered platform services
      ansible.builtin.set_fact:
        service_resources:
          resources: >-
            {{ lookup('ansible.builtin.template', templates + '/platform-services.yaml.j2') | from_yaml_all
              | select('mapping') | map('combine', {'metadata': {'uid': 'uid-' + environment_name}}, recursive=true) | list }}

    - name: Render platform bindings
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', templates + '/' + item + '.yaml.j2') }}"
        dest: "{{ out }}/{{ environment_name }}-{{ item }}.yaml"
        mode: "0600"
      loop: [platform-gateway, platform-service-consumers]

    - name: Render platform connections
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', templates + '/platform-governance.yaml.j2') }}"
        dest: "{{ out }}/platform-governance.yaml"
        mode: "0600"
      when: inventory_hostname == groups['environments'][-1]

    - name: Render tool initialization
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', templates + '/initialize-service-tools.yaml.j2') }}"
        dest: "{{ out }}/{{ environment_name }}-initialize-tools.yaml"
        mode: "0600"
      vars:
        role_resource: {metadata: {name: remediation}, spec: {tools: []}}

    - name: Render tool pruning
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', templates + '/prune-engineer-tools.yaml.j2') }}"
        dest: "{{ out }}/{{ environment_name }}-prune-tools.yaml"
        mode: "0600"
      vars:
        retired_engineer_servers: ["{{ environment_name }}-kubernetes-assistant", "{{ environment_name }}-kubernetes-assistant-changes"]
        role_resource:
          metadata: {name: assistant}
          spec:
            tools:
              - mcp: {server: {kind: RemoteMCPServer, name: "{{ environment_name }}-kubernetes-assistant"}, tools: [retired]}
              - mcp: {server: {kind: RemoteMCPServer, name: team-sessions}, tools: [search_knowledge]}
