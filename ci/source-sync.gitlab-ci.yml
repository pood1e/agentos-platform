stages: [sync]
source-sync:
  stage: sync
  extends: .agentos-ci
  resource_group: agentos-source-sync
  environment: {name: source-sync, action: prepare}
  retry: {max: 2, when: [runner_system_failure]}
  before_script:
    - chmod 600 "$AGENTOS_SOURCE_MIRROR_KEY"
    - export GIT_SSH_COMMAND="ssh -F /dev/null -i $AGENTOS_SOURCE_MIRROR_KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$AGENTOS_SOURCE_MIRROR_HOST_KEYS -o StrictHostKeyChecking=yes"
  script: [python3 ci/source-sync.py]
