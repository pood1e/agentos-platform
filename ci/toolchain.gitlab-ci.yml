variables:
  AGENTOS_CI_RUNNER: agentos-container
  AGENTOS_GO_RUNNER: agentos-compiler
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

.agentos-ci:
  image: registry.dev-supranett.space/aiops/agentos-platform/ci/tools@sha256:8c2bcb286ba1577fb577bdb4b305859e179b039cb7e647a1127c1c5c3363d988
  tags: [$AGENTOS_CI_RUNNER]
  before_script: [mkdir -p .cache]

.agentos-node:
  extends: .agentos-ci
  variables:
    NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    paths: [.npm/]
  before_script:
    - mkdir -p .cache
    - npm ci --prefer-offline

.agentos-go:
  extends: .agentos-ci
  tags: [$AGENTOS_GO_RUNNER]
  variables:
    GOENV: "off"
    GOTOOLCHAIN: local
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMEMLIMIT: 4GiB
  cache:
    key:
      files: [mise.lock]
      prefix: $CI_JOB_NAME
    paths: [.cache/go-mod/, .cache/go-build/]

.agentos-postgres:
  services:
    - name: pgvector/pgvector:0.8.1-pg18-bookworm@sha256:508c5290cda481d4f5f846446a26e9c1b804766828a394a5861de1b348a18b4c
      alias: postgres
  variables:
    POSTGRES_DB: agentos
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: agentos-ci
    PGHOST: postgres
    PGUSER: postgres
    PGPASSWORD: agentos-ci
    CHANGE_TEST_DATABASE_URL: postgresql://postgres:agentos-ci@postgres:5432/agentos?sslmode=disable
    KAGENT_TEST_POSTGRES_URL: postgresql://postgres:agentos-ci@postgres:5432/agentos?sslmode=disable
    SUBSTRATE_TEST_POSTGRES_URL: postgresql://postgres:agentos-ci@postgres:5432/agentos?sslmode=disable
