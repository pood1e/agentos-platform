variables:
  AGENTOS_CI_RUNNER: agentos-container
  AGENTOS_GO_RUNNER: agentos-compiler
  AGENTOS_VOICE_RUNNER: agentos-avx2
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

.agentos-ci:
  image: $AGENTOS_PLATFORM_REGISTRY/ci/tools@sha256:e75a302fdd369d357e1723b98af7a822ef07f772cf0aa91ce796c669b4811771
  tags: [$AGENTOS_CI_RUNNER]
  before_script: [mkdir -p .cache]

.agentos-go-cache:
  variables:
    GOENV: "off"
    GOTOOLCHAIN: local
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  cache:
    key: go-$CI_JOB_NAME
    paths: [.cache/go-mod/, .cache/go-build/, .cache/golangci-lint/]

.agentos-node:
  extends: .agentos-ci
  variables:
    NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    paths: [.npm/]
  before_script:
    - mkdir -p .cache
    - npm ci --prefer-offline

.agentos-node-go:
  extends: [.agentos-node, .agentos-go-cache]
  cache:
    - !reference [.agentos-go-cache, cache]
    - !reference [.agentos-node, cache]

.agentos-go:
  extends: [.agentos-ci, .agentos-go-cache]
  tags: [$AGENTOS_GO_RUNNER]
  variables:
    GOMEMLIMIT: 4GiB
