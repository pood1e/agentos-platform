variables:
  AGENTOS_CI_RUNNER: agentos-shell
  AGENTOS_PACKAGE_RUNNER: agentos-docker
  FF_USE_FASTZIP: "true"
  GOENV: "off"
  GOTOOLCHAIN: local
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  NPM_CONFIG_AUDIT: "false"

.agentos-ci:
  tags: [$AGENTOS_CI_RUNNER]
  before_script: [source ci/toolchain.sh]

.agentos-node:
  extends: .agentos-ci
  before_script:
    - source ci/toolchain.sh
    - npm ci --prefer-offline

.agentos-go:
  extends: .agentos-ci
  variables:
    GOMEMLIMIT: 4GiB
