python-verify:
  extends: .agentos-node
  stage: verify
  script:
    - node_modules/.bin/buf generate --template contracts/buf.python.gen.yaml
    - ruff check
    - ruff format --check

.build-python-image:
  extends: .build-image
  needs: [python-verify, build-contracts]
  before_script:
    - mkdir -p "$AGENTOS_BUILD_CONTEXT"
    - cp -R "$AGENTOS_DOCKERFILE_DIR/." dist/contracts/*.whl "$AGENTOS_BUILD_CONTEXT/"

build-voice:
  extends: .build-python-image
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/voice-image
    AGENTOS_DOCKERFILE_DIR: voice
    AGENTOS_IMAGE_SUFFIX: /voice
    AGENTOS_BUILD_METADATA: .cache/voice-build-metadata.json
  artifacts:
    paths: [.cache/voice-build-metadata.json, .cache/voice-build-metadata.ref]
    expire_in: 7 days

voice-verify:
  tags: [$AGENTOS_PACKAGE_RUNNER]
  stage: package
  needs: [build-voice]
  rules:
    - if: '$CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: refs/heads/main
        paths: &voice-paths
          - voice/**/*
          - proto/**/*
          - contracts/**/*
          - third_party/**/*.proto
          - package*.json
          - pyproject.toml
          - mise.*
          - ci/contracts.py
          - ci/node-contracts.py
          - ci/requirements.txt
          - ci/voice-test-requirements.txt
          - ci/python.gitlab-ci.yml
          - ci/registry-auth.sh
          - ci/toolchain.gitlab-ci.yml
          - ci/voice-verify.sh
          - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *voice-paths
  script: [ci/voice-verify.sh]
