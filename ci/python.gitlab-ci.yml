python-verify:
  extends: .shell
  stage: verify
  before_script:
    - . ci/shell-env.sh
    - . ci/python-env.sh ci/python-requirements.txt
    - npm ci --prefer-offline
  script:
    - ci/tools.sh protoc
    - node_modules/.bin/buf generate --template buf.python.gen.yaml
    - .cache/venv/bin/ruff check
    - .cache/venv/bin/ruff format --check
    - .cache/venv/bin/pytest

.build-python-image:
  extends: .build-image
  needs: [python-verify, build-contracts]
  before_script:
    - mkdir -p "$AGENTOS_BUILD_CONTEXT"
    - cp -R "$AGENTOS_DOCKERFILE_DIR/." dist/contracts/*.whl "$AGENTOS_BUILD_CONTEXT/"


build-automation:
  extends: .build-python-image
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/automation-image
    AGENTOS_DOCKERFILE_DIR: automation
    AGENTOS_IMAGE_SUFFIX: /automation
    AGENTOS_BUILD_METADATA: .cache/automation-build-metadata.json
  artifacts:
    paths: [.cache/automation-build-metadata.json]
    expire_in: 7 days

voice-verify:
  extends: .shell
  stage: package
  tags: [$AGENTOS_NATIVE_RUNNER]
  needs: [python-verify, build-contracts]
  before_script:
    - unset AGENTOS_CI_ENVIRONMENT
    - . ci/shell-env.sh
    - . ci/python-env.sh ci/voice-tools-requirements.txt
    - . ci/voice-env.sh
  script:
    - .cache/venv/bin/uv pip install --python .cache/voice-venv/bin/python --no-deps dist/contracts/agentos_contracts-*.whl
    - .cache/voice-venv/bin/ruff check voice
    - .cache/voice-venv/bin/ruff format --check voice
    - .cache/voice-venv/bin/pytest -o 'pythonpath=voice' voice/tests

build-voice:
  extends: .build-python-image
  needs: [voice-verify, build-contracts]
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/voice-image
    AGENTOS_DOCKERFILE_DIR: voice
    AGENTOS_IMAGE_SUFFIX: /voice
    AGENTOS_BUILD_METADATA: .cache/voice-build-metadata.json
  artifacts:
    paths: [.cache/voice-build-metadata.json]
    expire_in: 7 days
