stages: [verify, package, release]

default:
  interruptible: true

variables:
  GIT_DEPTH: "0"

include:
  - local: ci/build.gitlab-ci.yml
  - local: ci/images.gitlab-ci.yml
  - local: ci/runtime.gitlab-ci.yml
  - local: ci/python.gitlab-ci.yml

verify:
  extends: [.agentos-node, .agentos-postgres]
  stage: verify
  script: [npm run verify]
  artifacts:
    paths: [build/, dist/, gen/]
    expire_in: 1 day

e2e:
  extends: [.agentos-node, .agentos-postgres]
  stage: verify
  needs: [verify]
  parallel: 3
  script:
    - npm run test:e2e -- --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  artifacts:
    when: always
    paths: [test-results/, playwright-report/]
    expire_in: 1 day

deployment-check:
  extends: .agentos-ci
  stage: verify
  variables:
    ANSIBLE_CONFIG: deploy/ansible.cfg
    ANSIBLE_DEPRECATION_WARNINGS: "false"
  script:
    - ansible-lint deploy environments
    - ansible-playbook deploy/deploy.yaml --syntax-check
    - ansible-playbook deploy/validate.yaml --syntax-check
    - ansible-playbook environments/deploy.yaml --syntax-check
    - ansible-playbook environments/connect.yaml --syntax-check
    - ci/check-charts.sh

build-image:
  extends: .build-image
  needs: [verify]

build-contracts:
  extends: .agentos-node
  stage: package
  needs: []
  script:
    - python ci/contracts.py
    - python ci/test-package-chart.py
    - python ci/test-release.py
  artifacts:
    paths: [dist/contracts/, gen/python/, gen/authorization.json]
    expire_in: 7 days

release:
  extends: .agentos-ci
  stage: release
  interruptible: false
  needs:
    - build-contracts
    - build-image
    - build-automation
    - build-voice
    - job: verify
      artifacts: false
    - job: e2e
      artifacts: false
    - job: deployment-check
      artifacts: false
    - job: voice-verify
      artifacts: false
    - job: build-controller
      optional: true
    - job: build-claude-harness
      optional: true
    - job: build-standard-harness
      optional: true
    - job: build-codex-harness
      optional: true
    - job: build-substrate-api
      optional: true
    - job: build-substrate-microvm
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: agentos-release
  script:
    - python ci/publish-contracts.py
    - python ci/publish-chart.py
  artifacts:
    paths: [dist/release.json]
    expire_in: 30 days
