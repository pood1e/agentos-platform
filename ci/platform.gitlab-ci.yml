stages: [verify, package, release]

default:
  interruptible: true

variables:
  GIT_DEPTH: "0"

include:
  - local: ci/build.gitlab-ci.yml
  - local: ci/python.gitlab-ci.yml

verify:
  extends: .agentos-node
  stage: verify
  script: [npm run verify]
  artifacts:
    paths: [build/, dist/, gen/]
    expire_in: 1 day

deployment-check:
  extends: .agentos-collection
  stage: verify
  script:
    - ci/check-charts.sh
    - python ci/test-artifacts.py

platform-controller-verify:
  extends: .agentos-go
  stage: verify
  needs: []
  script:
    - KUBEBUILDER_ASSETS="$(flock "$HOME/.cache/envtest.lock" setup-envtest use 1.37 --bin-dir "$HOME/.cache/envtest" -p path)"
    - export KUBEBUILDER_ASSETS
    - ci/generate-controller.sh
    - python ci/chart-schemas.py
    - go -C controller test -race -count=1 ./...
    - go -C controller vet ./...
    - for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go -C controller build -trimpath -ldflags='-s -w' -o ../.cache/platform-controller-image/linux/$arch/agentos-controller ./cmd/controller; done
  artifacts:
    paths: [.cache/platform-controller-image/]
    expire_in: 1 day

build-platform-controller:
  extends: .build-image
  needs: [platform-controller-verify]
  variables:
    AGENTOS_BUILD_CONTEXT: .cache/platform-controller-image
    AGENTOS_DOCKERFILE_DIR: controller
    AGENTOS_IMAGE_SUFFIX: /platform-controller
    AGENTOS_BUILD_METADATA: .cache/platform-controller-build-metadata.json

build-image:
  extends: .build-image
  needs: [verify]
  variables:
    AGENTOS_DOCKERFILE_DIR: server

build-web:
  extends: .build-image
  needs: [verify]
  variables:
    AGENTOS_DOCKERFILE_DIR: web
    AGENTOS_IMAGE_SUFFIX: /web
    AGENTOS_BUILD_METADATA: .cache/web-build-metadata.json

build-index:
  stage: package
  tags: ["${AGENTOS_PACKAGE_RUNNER}-amd64"]
  needs: [build-image, build-web, build-voice, build-platform-controller]
  resource_group: agentos-image-index
  script: [ci/merge-images.sh]
  artifacts:
    paths: [.cache/*build-metadata.json, .cache/*build-metadata.ref]
    expire_in: 7 days

build-contracts:
  extends: .agentos-node
  stage: package
  needs: []
  script:
    - python ci/contracts.py
    - python ci/test-contracts.py
    - python ci/test-release.py
  artifacts:
    paths: [dist/contracts/, gen/python/, gen/authorization.json]
    expire_in: 7 days

package-check:
  extends: .agentos-collection
  stage: package
  needs:
    - build-contracts
    - build-index
    - job: verify
      artifacts: false
    - job: deployment-check
      artifacts: false
    - job: voice-verify
      artifacts: false
      optional: true
  script:
    - python ci/package-chart.py
    - python ci/package-collection.py
  artifacts:
    paths: [.cache/*-metadata.json, .cache/*-metadata.ref, dist/, gen/]
    expire_in: 1 day

release:
  extends: .agentos-ci
  stage: release
  interruptible: false
  needs: [package-check]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: agentos-release
  script:
    - python ci/publish-packages.py
    - python ci/publish-oci.py
