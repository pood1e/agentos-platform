.build-image:
  stage: package
  retry:
    max: 2
    when: [runner_system_failure]
  parallel:
    matrix:
      - AGENTOS_ARCH: [amd64, arm64]
  tags: ["${AGENTOS_PACKAGE_RUNNER}-${AGENTOS_ARCH}"]
  resource_group: agentos-image${AGENTOS_IMAGE_SUFFIX}-${AGENTOS_ARCH}
  script: [ci/build-image.sh]
  artifacts:
    paths: [.cache/images/]
    expire_in: 1 day
