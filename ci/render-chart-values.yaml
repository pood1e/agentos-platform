---
- name: Render deployment inputs for native validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [../deploy/vars.yaml]
  vars:
    agentos_namespace: agentos
    app_release_name: agentos
    agentos_image_registry: registry.example.com/agentos
    harness_defaults: "{{ (lookup('ansible.builtin.file', '../charts/agentos/values.yaml') | from_yaml).harnesses }}"
    microvm_image_credentials:
      auth: { registry.example.com: {}, harness.example.com: {}}
    solution_values: "{{ lookup('ansible.builtin.file', '../tests/fixtures/solution-chart/values.yaml') | from_yaml }}"
    output: "{{ playbook_dir }}/../.cache/chart-check"
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Create the validation directory
      ansible.builtin.file:
        path: "{{ output }}"
        state: directory
        mode: "0700"

    - name: Render native deployment values
      ansible.builtin.template:
        src: "../deploy/values/{{ item }}.yaml.j2"
        dest: "{{ output }}/{{ item }}-values.yaml"
        mode: "0600"
      loop: [kagent, substrate]

    - name: Render the direct environment scenario
      ansible.builtin.copy:
        content: >-
          {{ solution_values | combine({'global': {'agentos': {'environments':
               [{'name': 'env-direct', 'governance': 'direct'}]}}}, recursive=true) | to_nice_json }}
        dest: "{{ output }}/direct-values.json"
        mode: "0600"

    - name: Record source preset names and immutable image pins
      ansible.builtin.copy:
        content: >-
          {{ {'test': {'systemTemplates': lookup('ansible.builtin.fileglob', '../charts/agentos/presets/system/*.yaml', wantlist=true)
                                          | map('basename') | map('regex_replace', '\.yaml$', '') | list,
                       'solutionTemplates': lookup('ansible.builtin.fileglob', '../tests/fixtures/solution-chart/presets/engineers/*.yaml', wantlist=true)
                                            | map('basename') | map('regex_replace', '\.yaml$', '') | list,
                       'controllerImage': kagent_controller_image, 'microvmImage': substrate_microvm_image}} | to_nice_json }}
        dest: "{{ output }}/test-data.json"
        mode: "0600"
