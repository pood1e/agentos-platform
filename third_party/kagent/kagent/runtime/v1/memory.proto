syntax = "proto3";

package kagent.runtime.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kagent-dev/kagent/go/api/gen/kagent/runtime/v1;runtimev1";

// Memory supports personal Agent scopes and namespace-scoped team collections.
// The control plane authorizes the scope before embedding or accessing content.
service MemoryService {
  // Accepts an Actor JWT or user authentication.
  rpc AddSession(MemoryServiceAddSessionRequest) returns (MemoryServiceAddSessionResponse);
  // Accepts an Actor JWT or user authentication.
  rpc AddSessionBatch(MemoryServiceAddSessionBatchRequest) returns (MemoryServiceAddSessionBatchResponse);
  // Accepts an Actor JWT or user authentication.
  rpc Search(MemoryServiceSearchRequest) returns (MemoryServiceSearchResponse);
  // Accepts an Actor JWT or user authentication on the same RPC endpoint.
  rpc List(MemoryServiceListRequest) returns (MemoryServiceListResponse);
  // Accepts an Actor JWT or user authentication on the same RPC endpoint.
  rpc Delete(MemoryServiceDeleteRequest) returns (MemoryServiceDeleteResponse);
  rpc DeleteEntry(MemoryServiceDeleteEntryRequest) returns (MemoryServiceDeleteEntryResponse);
}

message MemoryScope {
  oneof target {
    option (buf.validate.oneof).required = true;
    string agent_name = 1 [(buf.validate.field).string.min_len = 1];
    string team_namespace = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    }];
  }
}

message SessionMemoryInput {
  reserved 1, 2;
  reserved "agent_name", "user_id";
  string content = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32768
  }];
  repeated float vector = 4 [(buf.validate.field).repeated.items.float.finite = true];
  option (buf.validate.message).cel = {
    id: "memory.vector_dimensions"
    message: "vector must be empty or contain 768 dimensions"
    expression: "size(this.vector) == 0 || size(this.vector) == 768"
  };
  google.protobuf.Struct metadata = 5;
  optional int32 ttl_days = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 36500
  }];
}

message MemorySearchResult {
  string id = 1;
  string content = 2;
  double score = 3;
  google.protobuf.Struct metadata = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MemorySummary {
  string id = 1;
  string content = 2;
  int64 access_count = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message MemoryServiceAddSessionRequest {
  SessionMemoryInput memory = 1 [(buf.validate.field).required = true];
  // Personal scopes bind to the caller; omitted Actor scopes use the Session Agent.
  reserved 2;
  reserved "management_agent";
  MemoryScope scope = 3;
}

message MemoryServiceAddSessionResponse {
  string id = 1;
}

message MemoryServiceAddSessionBatchRequest {
  repeated SessionMemoryInput items = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
  reserved 2;
  reserved "management_agent";
  MemoryScope scope = 3;
}

message MemoryServiceAddSessionBatchResponse {
  int32 count = 1;
}

message MemoryServiceSearchRequest {
  reserved 1, 2;
  reserved "agent_name", "user_id";
  repeated float vector = 3 [(buf.validate.field).repeated.items.float.finite = true];
  optional int32 limit = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  optional double min_score = 5 [(buf.validate.field).double = {
    gte: -1
    lte: 1
    finite: true
  }];
  option (buf.validate.message).cel = {
    id: "memory.search_input"
    message: "supply a text query or a 768-dimensional vector"
    expression: "(size(this.vector) == 768 && this.query == '') || (size(this.vector) == 0 && this.query.trim() != '')"
  };
  reserved 6;
  reserved "management_agent";
  MemoryScope scope = 7;
  // Text queries are embedded by the control plane. Supply either query or vector.
  string query = 8 [(buf.validate.field).string.max_len = 32768];
}

message MemoryServiceSearchResponse {
  repeated MemorySearchResult memories = 1;
}

message MemoryServiceListRequest {
  reserved 2;
  reserved "user_id";

  reserved 1;
  reserved "agent_name";
  MemoryScope scope = 3;
}

message MemoryServiceListResponse {
  repeated MemorySummary memories = 1;
}

message MemoryServiceDeleteRequest {
  reserved 2;
  reserved "user_id";

  reserved 1;
  reserved "agent_name";
  MemoryScope scope = 3;
}

message MemoryServiceDeleteResponse {
  string status = 1;
}

message MemoryServiceDeleteEntryRequest {
  reserved 1;
  reserved "agent_name";
  MemoryScope scope = 3;
  string id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

message MemoryServiceDeleteEntryResponse {}
