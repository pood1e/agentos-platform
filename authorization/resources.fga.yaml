name: Principal, Agent and execution resource boundaries
model_file: ./model.fga
tuples:
  - {user: principal:alice, relation: operator, object: resource:connection-a/item-a}
  - {user: principal:bob, relation: reader, object: resource:connection-b/item-b}
  - {user: agent:team-a/reader, relation: readable_by, object: resource:connection-a/item-a}
  - {user: agent:team-a/operator, relation: operable_by, object: resource:connection-a/item-a}
  - {user: grant:read-only, relation: read_grant, object: resource:connection-a/item-a}
  - {user: grant:operate, relation: operate_grant, object: resource:connection-a/item-a}
tests:
  - name: User rights do not grant the Agent additional capabilities
    check:
      - user: principal:alice
        object: resource:connection-a/item-a
        assertions: {can_read: true, can_operate: true}
      - user: agent:team-a/reader
        object: resource:connection-a/item-a
        assertions: {agent_can_read: true, agent_can_operate: false}
      - user: agent:team-a/operator
        object: resource:connection-a/item-a
        assertions: {agent_can_read: true, agent_can_operate: true}
  - name: Agent rights do not expand the execution grant
    check:
      - user: grant:read-only
        object: resource:connection-a/item-a
        assertions: {grant_can_read: true, grant_can_operate: false}
      - user: grant:operate
        object: resource:connection-a/item-a
        assertions: {grant_can_read: true, grant_can_operate: true}
  - name: Resource access stays within its explicit connection
    check:
      - user: principal:alice
        object: resource:connection-b/item-b
        assertions: {can_read: false, can_operate: false}
      - user: agent:team-a/operator
        object: resource:connection-b/item-b
        assertions: {agent_can_read: false, agent_can_operate: false}
      - user: grant:operate
        object: resource:connection-b/item-b
        assertions: {grant_can_read: false, grant_can_operate: false}
