version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: gen
    include_imports: true
    opt: [target=ts, import_extension=js]
  - remote: buf.build/bufbuild/protoschema-jsonschema:v0.6.0
    out: gen/schema
    types:
      - agentos.console.v1.RoleDefinition
      - agentos.management.v1.SearchKnowledgeRequest
      - kagent.api.v1alpha1.ListAgentsRequest
      - kagent.api.v1alpha1.CreateSessionRequest
      - kagent.api.v1alpha1.ListToolServersRequest
      - lf.a2a.v1.Message
      - agentos.automation.v1.CaseRequest
      - agentos.automation.v1.CaseReference
    opt: [target=json-bundle]
