version: v2
clean: true
plugins:
  - protoc_builtin: python
    protoc_path: protoc
    strategy: all
    out: gen/python
    include_imports: true
    types:
      - agentos.execution.v1.RunExecutionRequest
      - agentos.execution.v1.GetExecutionRequest
      - agentos.execution.v1.GetExecutionResponse
      - kagent.api.v1.InvokeSessionOutput
      - agentos.voice.v1.VoiceService
      - agentos.voice.v1.VoiceEvent
      - ateapi.Control
