version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: gen
    include_imports: true
    opt: [target=ts, import_extension=js]
  - local: protoc-gen-jsonschema
    strategy: all
    out: gen/schema
    types:
      - agentos.governance.v1.EnvironmentApi
      - agentos.console.v1.Pack
      - agentos.console.v1.RoleDefinition
      - agentos.console.v1.SpeechTranscription
      - agentos.console.v1.SpeechSynthesis
      - kagent.api.v1.ListToolServersRequest
    opt: [target=json-bundle]
