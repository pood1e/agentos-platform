agentos_values_file: '{{ playbook_dir }}/../tests/fixtures/solution-chart/values.yaml'
platform_cidr: 192.0.2.10/32
environment_connectors:
  kubernetes:
    title: Kubernetes
    targets:
    - host: kubernetes-mcp.mcp.svc.cluster.local
      port: 8000
      auth:
        oauthTokenExchange:
          url: https://identity.example.test/realms/<environment>/protocol/openid-connect/token
          grantType: TokenExchange
          audiences:
          - <environment>-kubernetes
          subjectToken:
            source:
              header:
                name: Authorization
                prefix: 'Bearer '
            tokenType: AccessToken
          clientAuth:
            clientId: agentos-<identity>
            method: ClientSecretBasic
            secretRef:
              name: agentos-<identity>
              key: client-secret
  tickets:
    title: Tickets
    targets:
    - host: tickets-mcp.mcp.svc.cluster.local
      port: 8214
      path: /mcp
      auth:
        secretRef:
          name: backend-<identity>
          key: tickets
        location:
          header:
            name: X-Ticket-Token
    - name: tickets-write
      access:
      - operate
      - manage
      host: tickets-write-mcp.mcp.svc.cluster.local
      port: 8000
      auth:
        secretRef:
          name: tickets-api-<identity>
          key: token
environment_domain: example.test
environment_issuer: https://identity.example.test/realms/{{ environment_name }}
gateway_server_name: '{{ environment_name }}-mcp.example.test'
environment_discovery:
  json:
    jwks_uri: https://identity.example.test/realms/example/protocol/openid-connect/certs
gateway_certificate:
  resources:
  - data:
      ca.crt: cHVibGljIHRlc3QgQ0E=
platform_actor_issuer: https://idp.ate-system.svc
platform_actor_audiences:
- http://agentos-mcp-gateway.agentos.svc.cluster.local:8080
platform_actor_jwks:
  keys: []
platform_discovery_issuer: https://kubernetes.default.svc.cluster.local
platform_discovery_jwks:
  keys: []
