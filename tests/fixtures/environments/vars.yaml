agentos_values_file: "{{ playbook_dir }}/../tests/fixtures/solution-chart/values.yaml"
platform_cidr: 192.0.2.10/32
gateway_rules: ["apiKey.engineer == 'catalog' && request.path == '/openapi.json'"]
environment_connectors:
  kubernetes:
    title: Kubernetes
    targets:
      - host: kubernetes-mcp.mcp.svc.cluster.local
        port: 8000
        auth: {secretRef: {name: backend-<identity>, key: kubernetes}}
  tickets:
    title: Tickets
    targets:
      - host: tickets-mcp.mcp.svc.cluster.local
        port: 8214
        path: /mcp
        protocol: SSE
        auth: {secretRef: {name: backend-<identity>, key: tickets}, location: {header: {name: X-Ticket-Token}}}
      - name: tickets-write
        access: [operate, manage]
        host: tickets-write-mcp.mcp.svc.cluster.local
        port: 8000
        auth: {secretRef: {name: tickets-api-<identity>, key: token}}
