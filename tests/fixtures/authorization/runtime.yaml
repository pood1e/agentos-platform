apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentos-authorization-proof
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-authorization-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-authorization-proof
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-authorization-proof
    spec:
      serviceAccountName: agentos-authorization-proof
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: agentos-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proof
          image: ${PROOF_IMAGE}
          command:
            - node
            - /app/authorization-proof.mjs
          env:
            - name: PROOF_WORKSPACE
              value: ${PROOF_WORKSPACE}
            - name: PROOF_ISSUER
              value: https://idp.ate-system.svc
            - name: PROOF_SUBSTRATE_URL
              value: https://api.ate-system.svc
            - name: PROOF_KAGENT_URL
              value: ${PROOF_KAGENT_INTERNAL_URL}
            - name: PROOF_TOKEN_FILE
              value: /run/authorization/token
            - name: NODE_EXTRA_CA_CERTS
              value: /run/authorization/ca.pem
            - name: PROOF_AUDIENCE
              value: http://authorization-proof.${PROOF_WORKSPACE}.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: script
              mountPath: /app/authorization-proof.mjs
              subPath: runtime-server.mjs
              readOnly: true
            - name: credentials
              mountPath: /run/authorization
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: agentos-authorization-proof
        - name: credentials
          projected:
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 600
                  path: token
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: agentos-authorization-proof
spec:
  selector:
    app.kubernetes.io/name: agentos-authorization-proof
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
