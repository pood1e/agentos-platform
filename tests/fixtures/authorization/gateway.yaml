apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: authorization-proof
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ${PROOF_GATEWAY_PARAMETERS}
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: authorization-proof
spec:
  mcp:
    prefixMode: Never
    targets:
      - name: authorization-proof
        static:
          host: agentos-authorization-proof
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authorization-proof
spec:
  parentRefs:
    - name: authorization-proof
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp/authorization-proof
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: authorization-proof
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: authorization-proof
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: authorization-proof
  backend:
    mcp:
      guardrails:
        processors:
          - methods:
              "*": Full
            remote:
              backendRef:
                name: agentos-authorization-proof
                port: 9090
              failureMode: FailClosed
              allowedRequestHeaders:
                - x-substrate-actor-token
