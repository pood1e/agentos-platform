suite: managed connection ownership and authentication
values:
- values.json
release:
  name: agentos-connections
  namespace: agentos
tests:
- it: publishes the environment RPC allowlist in the governance catalog
  template: governance.yaml
  asserts:
  - matchRegex:
      path: stringData["connections.json"]
      pattern: '"apis":.*"ListResources".*"UpdateResource"'
- it: rejects removed inline workload keys
  set:
    platform.actorJWKS:
      keys: []
  asserts:
  - failedTemplate:
      errorPattern: actorJWKS|Additional property
- it: rejects the removed business approval endpoint
  set:
    environments:
    - name: lab
      governance: direct
      approvalUrl: https://reviews.example.test
  asserts:
  - failedTemplate:
      errorPattern: approvalUrl|Additional property
- it: rejects the removed business approval credential
  set:
    environments:
    - name: lab
      governance: direct
      authorization: Bearer obsolete-credential
  asserts:
  - failedTemplate:
      errorPattern: authorization|Additional property
- it: routes each service origin through the platform gateway
  template: services.yaml
  documentSelector:
    path: metadata.name
    value: env-approval-kubernetes-mcp-gateway
  asserts:
  - equal:
      path: spec.selector["gateway.networking.k8s.io/gateway-name"]
      value: agentos-gateway
- it: declares scoped authorization inputs
  template: access-plan.yaml
  asserts:
  - isKind:
      of: AccessPlan
  - equal:
      path: spec.platform.actorJWKSBackend
      value: agentos-actor-jwks
  - equal:
      path: spec.environments[0].governance
      value: approval
- it: declares an empty plan when disconnecting all environments
  template: access-plan.yaml
  set:
    environments: []
  asserts:
  - equal:
      path: spec.environments
      value: []
