{{- range $environment := .Values.environments }}
{{- range $project, $_ := $environment.toolsets }}
{{- $name := printf "%s-%s" $environment.name $project }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}-runtime-auth
  labels: {{ include "agentos-connections.labels" $ | nindent 4 }}
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels: {agentos.dev/mcp-source: {{ $name }}}
  traffic:
    jwtAuthentication:
      mode: Permissive
      preserveToken: true
      location:
        expression: >-
          'x-substrate-actor-token' in request.headers ? request.headers['x-substrate-actor-token'].replace('Bearer ', '') : ''
      providers:
        - issuer: {{ $.Values.platform.actorIssuer | quote }}
          audiences: [{{ printf "http://%s-mcp-gateway.%s.svc.cluster.local:8080" $name $.Release.Namespace | quote }}]
          jwks:
            remote:
              backendRef: {name: {{ $.Values.platform.release }}-console, port: 9092}
              jwksPath: /keys/actor
          validation: {requiredClaims: [sub, exp, aud]}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - >-
            (request.path != '/mcp/{{ $name }}' && has(jwt.iss) && jwt.iss == '{{ $.Values.platform.actorIssuer }}') ||
            (!('x-substrate-actor-token' in request.headers) && 'authorization' in request.headers)
{{- end }}
{{- end }}
