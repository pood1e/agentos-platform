{{- range $environment := .Values.environments }}
{{- range $project, $tools := $environment.toolsets }}
{{- $name := printf "%s-%s" $environment.name $project }}
{{- range $identity := $environment.identities }}
{{- if and (ne $identity.name "catalog") (hasKey $identity.services $project) }}
{{- $access := index $identity.services $project }}
{{- $read := $tools.readOnly | default list }}
{{- $write := $tools.write | default list }}
{{- if eq $access "manage" }}
{{- $read = concat $read ($tools.managementReadOnly | default list) }}
{{- $write = concat $write ($tools.management | default list) }}
{{- end }}
{{- range $view := list "readOnly" "write" }}
{{- if or (eq $view "readOnly") (and (has $access (list "operate" "manage")) $write) }}
{{- $suffix := ternary "-changes" "" (eq $view "write") }}
{{- $profile := printf "%s-%s%s" $name $identity.name $suffix }}
{{- $path := printf "/mcp/%s/%s/%s" $name $identity.name (ternary "changes" "readonly" (eq $view "write")) }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $profile }}
  labels:
    {{- include "agentos-connections.labels" $ | nindent 4 }}
    agentos.dev/environment: {{ $environment.name }}
    agentos.dev/engineer: {{ $identity.name }}
    agentos.dev/access: engineer
    agentos.dev/tool-access: {{ $view }}
spec:
  mcp:
    prefixMode: Always
    targets:
      - name: {{ $name }}
        static:
          host: {{ $environment.gateway.address | quote }}
          port: {{ $environment.gateway.nodePort }}
          path: /mcp/{{ $identity.name }}/{{ $project }}
          protocol: StreamableHTTP
  policies:
    extAuth:
      {{- include "agentos-connections.transport" (dict "root" $ "service" $name "environment" $environment.name "identity" $identity.name) | nindent 6 }}
    http: {requestTimeout: 10m}
    tls:
      sni: {{ $environment.gateway.host | quote }}
      caCertificateRefs: [{name: {{ $environment.name }}-gateway-ca, kind: ConfigMap}]
      verifySubjectAltNames: [{{ $environment.gateway.host | quote }}]
    mcp:
      guardrails:
        {{- include "agentos-connections.processor" (dict "root" $ "environment" $environment.name "identity" $identity.name) | nindent 8 }}
      authorization:
        action: Require
        policy:
          matchExpressions: [{{ printf "mcp.tool.name in %s" (toJson (ternary $read $write (eq $view "readOnly"))) | quote }}]
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ $profile }}
  annotations: {agentos.dev/discovery-auth: kubernetes}
  labels:
    {{- include "agentos-connections.labels" $ | nindent 4 }}
    agentos.dev/environment: {{ $environment.name }}
    agentos.dev/engineer: {{ $identity.name }}
spec:
  description: {{ printf "%s; %s" (index $environment.titles $project | default $project) $identity.name | quote }}
  protocol: STREAMABLE_HTTP
  url: http://{{ $name }}-mcp-gateway.{{ $.Release.Namespace }}.svc.cluster.local:8080{{ $path }}
  timeout: 10m
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-{{ $profile }}
  labels:
    {{- include "agentos-connections.labels" $ | nindent 4 }}
    agentos.dev/mcp-source: {{ $name }}
spec:
  parentRefs: [{name: {{ $.Values.platform.release }}-gateway, sectionName: http}]
  rules:
    - matches: [{path: {type: PathPrefix, value: {{ $path }}}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $profile }}}]
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
