suite: environment gateway identity boundary
values:
- values.json
release:
  name: agentos-environment
  namespace: mcp
tests:
- it: retires idle upstream connections before MCP servers close their keep-alive sockets
  template: gateway.yaml
  documentSelector:
    path: kind
    value: AgentgatewayParameters
  asserts:
  - equal:
      path: spec.rawConfig.config.backend.poolIdleTimeout
      value: 4s
- it: exposes the HTTPS listener with its managed certificate
  template: gateway.yaml
  documentSelector:
    path: kind
    value: Gateway
  asserts:
  - equal:
      path: spec.listeners[0].protocol
      value: HTTPS
  - equal:
      path: spec.listeners[0].tls.certificateRefs[0].name
      value: mcp-gateway-tls
- it: validates the environment issuer and resource audience
  template: authentication.yaml
  documentSelector:
    path: metadata.name
    value: gateway-auth
  asserts:
  - equal:
      path: spec.traffic.jwtAuthentication.mode
      value: Strict
  - equal:
      path: spec.traffic.jwtAuthentication.providers[0].audiences
      value:
      - https://env-approval-mcp.example.test:31000/mcp
  - equal:
      path: spec.frontend.http.maxBufferSize
      value: 16Mi
- it: uses the configured gateway SAN
  template: certificates.yaml
  documentSelector:
    path: spec.secretName
    value: mcp-gateway-tls
  asserts:
  - equal:
      path: spec.dnsNames
      value:
      - env-approval-mcp.example.test
  - equal:
      path: spec.issuerRef.name
      value: mcp-ca
- it: rejects a plaintext issuer
  set:
    environment.issuer: http://identity.example.test
  asserts:
  - failedTemplate:
      errorPattern: issuer.*pattern|issuer.*match|issuer
- it: rejects malformed issuer placeholders
  set:
    connectors.kubernetes.targets:
    - host: kubernetes-mcp
      port: 8000
      auth:
        oauthTokenExchange:
          url: <issuer>?token=invalid
          grantType: TokenExchange
          clientAuth:
            clientId: agentos-catalog
            method: None
  asserts:
  - failedTemplate:
      errorPattern: url|anyOf|pattern
- it: passes connectors to the shared compiler
  template: access-plan.yaml
  asserts:
  - isKind:
      of: AccessPlan
  - equal:
      path: spec.mode
      value: environment
  - equal:
      path: spec.connectors.kubernetes.targets[0].auth.oauthTokenExchange.url
      value: https://identity.example.test/realms/env-approval/protocol/openid-connect/token
