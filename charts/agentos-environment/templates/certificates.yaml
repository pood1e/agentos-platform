apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-root
  labels: {{ include "agentos-environment.labels" . | nindent 4 }}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-ca
  labels: {{ include "agentos-environment.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.environment.name }}-mcp-ca
  secretName: mcp-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: mcp-root, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mcp-ca
  labels: {{ include "agentos-environment.labels" . | nindent 4 }}
spec: {ca: {secretName: mcp-ca}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-gateway
  labels: {{ include "agentos-environment.labels" . | nindent 4 }}
spec:
  secretName: mcp-gateway-tls
  dnsNames: [{{ .Values.gateway.host | quote }}]
  ipAddresses: [{{ .Values.gateway.address | quote }}]
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: mcp-ca, kind: Issuer}
