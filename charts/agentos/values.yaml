entryAgent: assistant
global:
  agentos:
    environments: []
    toolsets: {}
    identities: []
    skills: []
image:
  repository: registry.example.com/agentos
  digest: ""
imagePullSecrets: []
pack:
  image: ""
kagent:
  endpoint: http://kagent-controller:8083
api:
  replicas: 2
  workspaces: []
  delegates: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
dataplane:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
telemetry:
  metrics:
    endpoint: ""
    protocol: grpc
speech:
  transcription: {}
  synthesis: {}
  secretRef: ""
voice:
  enabled: false
  image: ""
  livekitURL: ws://agentos-livekit:80
  publicURL: ""
  secretRef: agentos-voice
  sessionSecretRef: agentos-voice-sessions
  capacity: 4
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
identity:
  issuer: ""
  jwksURL: ""
  clientId: ""
  audience: ""
  writerRole: ""
  secretRef: agentos-identity
  returnOrigins: []
mcpApps:
  sandboxOrigin: ""
  imageOrigins: []
route:
  console: {origin: "", parentRefs: []}
  api: {origin: "", parentRefs: []}
  sandbox: {origin: "", parentRefs: []}
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
web:
  image: ""
  proxyImage: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
modelConfig:
  spec:
    provider: OpenAI
    model: gpt-6.1-sol
    apiKeySecret: model-credentials
    apiKeySecretKey: api-key
    openAI:
      baseUrl: https://api.openai.com/v1
      apiFormat: responses
      maxCompletionTokens: 8192
      reasoningEffort: medium
defaultHarness: standard
harnesses:
  standard:
    kagent: {}
    workload:
      image: ghcr.io/pood1e/kagent/standard-harness@sha256:f9ad2d358ecd5f38316bc2f9a3e2ca73bb07e3dcbd1c5a84d3bbe586865af29d
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  memory:
    kagent:
      memory:
        modelConfigRef:
          name: knowledge-embedding
        ttlDays: 3650
    workload:
      image: ghcr.io/pood1e/kagent/standard-harness@sha256:f9ad2d358ecd5f38316bc2f9a3e2ca73bb07e3dcbd1c5a84d3bbe586865af29d
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  codex:
    codex: {}
    workload:
      image: ghcr.io/pood1e/kagent/codex-harness@sha256:0090ee7a57b36e47da224c7b910859e95cf59d5427b02c15457fa93b3bdb830c
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  claude:
    claude: {}
    workload:
      image: ghcr.io/pood1e/kagent/claude-harness@sha256:e9d2b22738215bdb799a0bc8e70d2ecd037478c1ff40ba0dffad0ce366924940
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
systemAgents:
  assistant:
    systemPrompt: ""
  roleBuilder:
    systemPrompt: ""
gateway:
  parameters:
    image:
      registry: cr.agentgateway.dev
      repository: agentgateway
      tag: v1.7.0
      digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    service:
      spec:
        type: ClusterIP
    deployment:
      spec:
        replicas: 1
        template:
          metadata:
            labels:
              agentos.dev/gateway: business
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: agentgateway
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
    logging:
      format: json
      level: info
  models:
    - name: default-model-config
      spec:
        provider: OpenAI
        match:
          model: gpt-6.1-sol
        baseURL: https://api.openai.com/v1
        policies:
          auth:
            secretRef:
              name: model-credentials
              key: api-key
  mcps:
    - name: team-sessions
      spec:
        mcp:
          prefixMode: Never
          targets:
            - name: team-sessions
              static:
                host: '{{ include "agentos.dataplaneService" . }}'
                port: 8080
                path: /mcp
                policies:
                  http:
                    requestTimeout: 10m
                protocol: StreamableHTTP
controller:
  image: registry.example.com/agentos/platform-controller:0.39.0
  imagePullSecrets: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
runtime:
  actorIssuer: https://idp.ate-system.svc
  actorJWKS:
    static:
      host: idp.ate-system.svc
      port: 443
    policies:
      tls:
        sni: idp.ate-system.svc
        caCertificateRefs:
          - name: substrate-service-dns-ca
            kind: ConfigMap
  kubernetesIssuer: https://kubernetes.default.svc.cluster.local
  kubernetesJWKS:
    static: {host: kubernetes.default.svc, port: 443}
    policies:
      tls:
        sni: kubernetes.default.svc
        caCertificateRefs: [{name: kube-root-ca.crt, kind: ConfigMap}]
