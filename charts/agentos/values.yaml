entryAgent: assistant
global:
  agentos:
    environments: []
    toolsets: {}
    identities: []
    skills: []
    skillRepository:
      host: ''
      path: ''
      secretRef: agentos-skill-repository
image:
  repository: registry.example.com/agentos
  digest: ''
imagePullSecrets: []
pack:
  image: ''
automation:
  enabled: false
  sources: []
kagent:
  endpoint: http://kagent-controller:8083
  userId: agentos
execution:
  keySecret: agentos-execution
  databaseSecret: kagent-postgres
  databaseCASecret: kagent-postgres-ca
  substrateURL: https://api.ate-system.svc
  actorIssuer: https://idp.ate-system.svc
console:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 768Mi
speech:
  transcription: {}
  synthesis: {}
  secretRef: ''
voice:
  enabled: false
  image: ''
  livekitURL: ws://agentos-livekit:80
  publicURL: ''
  secretRef: agentos-voice
  capacity: 4
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: '2', memory: 2Gi}
identity:
  mode: password
  issuer: ''
  clientId: ''
  audience: ''
  writerRole: ''
  secretRef: agentos-identity
  returnOrigins: []
route:
  parentRefs: []
  hosts: {console: '', api: '', sandbox: ''}
  from:
  - namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    podSelector:
      matchLabels: {app.kubernetes.io/name: traefik}
web:
  image: ''
  proxyImage: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
modelConfig:
  spec:
    provider: OpenAI
    model: gpt-6.1-sol
    apiKeySecret: model-credentials
    apiKeySecretKey: api-key
    openAI:
      baseUrl: https://api.openai.com/v1
      apiFormat: responses
      maxCompletionTokens: 8192
      reasoningEffort: medium
defaultHarness: standard
harnesses:
  standard:
    kagent: {}
    workload:
      image: registry.example.com/agentos/standard-harness@sha256:88dbb5fe713fdd32983dba865ab6f21426374dc1c9a8efad90f154bfd9b6f399
    env:
    - {name: GOMEMLIMIT, value: 768MiB}
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: 's3://ate-snapshots/kagent/'}
  memory:
    kagent:
      memory:
        modelConfigRef: {name: knowledge-embedding}
        ttlDays: 3650
    workload:
      image: registry.example.com/agentos/standard-harness@sha256:88dbb5fe713fdd32983dba865ab6f21426374dc1c9a8efad90f154bfd9b6f399
    env:
    - {name: GOMEMLIMIT, value: 768MiB}
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: 's3://ate-snapshots/kagent/'}
  codex:
    codex: {}
    workload:
      image: registry.example.com/agentos/codex-harness@sha256:e8a5e7dc17b124d33cf173b7608e015e5fc1289b20502d0b415971029b517514
    env: [{name: GOMEMLIMIT, value: 768MiB}]
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: 's3://ate-snapshots/kagent/'}
  claude:
    claude: {}
    workload:
      image: registry.example.com/agentos/claude-harness@sha256:ebf84bc3151d2b4913ed1b4f274a0560f1240be5552bde1f871cdd39b7cfc478
    env: [{name: GOMEMLIMIT, value: 768MiB}]
    substrate:
      workerPoolRef: {name: kagent-default}
      snapshotPolicy: {location: 's3://ate-snapshots/kagent/'}
knowledgeMemory:
  ttlDays: 3650
embedding:
  image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
  model: embeddinggemma:300m
  digest: 85462619ee721b466c5927d109d4cb765861907d5417b9109caebc4e614679f1
  storage: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
systemAgents:
  assistant:
    systemPrompt: ''
  roleBuilder:
    systemPrompt: ''
gateway:
  parameters:
    image:
      registry: cr.agentgateway.dev
      repository: agentgateway
      tag: v1.6.0
      digest: sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    service:
      spec:
        type: ClusterIP
    deployment:
      spec:
        replicas: 1
        template:
          metadata:
            labels:
              agentos.dev/gateway: business
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: agentgateway
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                  - ALL
    logging:
      format: json
      level: info
  models:
  - name: default-model-config
    spec:
      provider: OpenAI
      match:
        model: gpt-6.1-sol
      baseURL: https://api.openai.com/v1
      policies:
        auth:
          secretRef:
            name: model-credentials
            key: api-key
  - name: knowledge-embedding
    spec:
      provider: Ollama
      match:
        model: embeddinggemma:300m
      baseURL: http://knowledge-embedding:11434/v1
  mcps:
  - name: team-sessions
    spec:
      mcp:
        prefixMode: Never
        targets:
        - name: team-sessions
          static:
            host: '{{ include "agentos.name" . }}-console'
            port: 8080
            path: /mcp
            policies:
              http: {requestTimeout: 10m}
            protocol: StreamableHTTP
      policies:
        auth: {passthrough: {}}
  - name: kagent-collaboration
    spec:
      mcp:
        prefixMode: Never
        targets:
        - name: kagent-collaboration
          static:
            host: kagent-controller
            port: 8083
            path: /mcp
            policies:
              http: {requestTimeout: 10m}
            protocol: StreamableHTTP

controller:
  image: registry.example.com/agentos/platform-controller:0.39.0
  imagePullSecrets: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 256Mi}
