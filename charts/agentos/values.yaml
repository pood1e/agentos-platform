entryAgent: assistant
global:
  agentos:
    environments: []
    toolsets: {}
    identities: []
    skills: []
image:
  repository: registry.example.com/agentos
  digest: ""
imagePullSecrets: []
pack:
  image: ""
kagent:
  endpoint: http://kagent-controller:8083
api:
  replicas: 2
  workspaces: []
  delegates: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
telemetry:
  metrics:
    endpoint: ""
    protocol: grpc
speech:
  transcription: {}
  synthesis: {}
  secretRef: ""
voice:
  enabled: false
  image: ""
  livekitURL: ws://agentos-livekit:80
  publicURL: ""
  secretRef: agentos-voice
  sessionSecretRef: agentos-voice-sessions
  capacity: 4
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
identity:
  issuer: ""
  jwksURL: ""
  clientId: ""
  audience: ""
  writerRole: ""
  secretRef: agentos-identity
mcpApps:
  sandboxOrigin: ""
  imageOrigins: []
route:
  console: {origin: "", parentRefs: []}
  api: {origin: "", parentRefs: []}
  sandbox: {origin: "", parentRefs: []}
  from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
web:
  image: ""
  proxyImage: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
modelConfig:
  spec:
    provider: OpenAI
    model: gpt-6.1-sol
    apiKeySecret: model-credentials
    apiKeySecretKey: api-key
    openAI:
      baseUrl: https://api.openai.com/v1
      apiFormat: responses
      maxCompletionTokens: 8192
      reasoningEffort: medium
defaultHarness: standard
harnesses:
  standard:
    kagent: {}
    workload:
      image: ghcr.io/pood1e/kagent/standard-harness@sha256:f817fe0ba13e7c64003754d755b275b5621eea44b491578086eb856f2e069607
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  memory:
    kagent:
      memory:
        modelConfigRef:
          name: knowledge-embedding
        ttlDays: 3650
    workload:
      image: ghcr.io/pood1e/kagent/standard-harness@sha256:f817fe0ba13e7c64003754d755b275b5621eea44b491578086eb856f2e069607
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  codex:
    codex: {}
    workload:
      image: ghcr.io/pood1e/kagent/codex-harness@sha256:578adad4c834886f496c1048a63e848570b4ce87cce95b1c61acd19b860af21f
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
  claude:
    claude: {}
    workload:
      image: ghcr.io/pood1e/kagent/claude-harness@sha256:b316b2adb74f1bb96c96d89ce0fa12d9064c63e07c1ef5d40400d14124782e25
    env:
      - name: GOMEMLIMIT
        value: 768MiB
    substrate:
      workerPoolRef:
        name: kagent-default
      snapshotPolicy:
        location: s3://ate-snapshots/kagent/
systemAgents:
  assistant:
    systemPrompt: ""
gateway:
  parameters:
    image:
      registry: cr.agentgateway.dev
      repository: agentgateway
      tag: v1.7.0
      digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    service:
      spec:
        type: ClusterIP
    deployment:
      spec:
        replicas: 1
        template:
          metadata:
            labels:
              agentos.dev/gateway: business
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: agentgateway
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
    logging:
      format: json
      level: info
  models:
    - name: default-model-config
      spec:
        provider: OpenAI
        match:
          model: gpt-6.1-sol
        baseURL: https://api.openai.com/v1
        policies:
          auth:
            secretRef:
              name: model-credentials
              key: api-key
  mcps: []
controller:
  image: registry.example.com/agentos/platform-controller:0.39.0
  imagePullSecrets: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
runtime:
  actorIssuer: https://idp.ate-system.svc
  actorJWKS:
    static:
      host: idp.ate-system.svc
      port: 443
    policies:
      tls:
        sni: idp.ate-system.svc
        caCertificateRefs:
          - name: substrate-service-dns-ca
            kind: ConfigMap
  kubernetesIssuer: https://kubernetes.default.svc.cluster.local
  kubernetesJWKS:
    static: {host: kubernetes.default.svc, port: 443}
    policies:
      tls:
        sni: kubernetes.default.svc
        caCertificateRefs: [{name: kube-root-ca.crt, kind: ConfigMap}]
