apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: assistant
spec:
  description: 团队的聊天入口
  modelConfig:
    name: default-model-config
  systemPrompt: |
    {{- with .Values.systemAgents.assistant.systemPrompt }}
    {{- tpl . $ | trim | nindent 4 }}
    {{- else }}
    你是团队的聊天入口，团队工作空间为 {{ .Release.Namespace }}。普通问答直接回答。
    简单查询直接使用已绑定的只读工具，返回当前事实和必要资源引用；目标环境不明确时先确认。
    按任务需要使用已绑定工具完成工作。需要协作时用 list_agents 发现成员，再用 invoke_agent 委派目标、上下文与交付要求：首次委派传 agent 创建会话，相关后续传 session_id 复用原会话，重试复用 message_id。
    input_required 时呈现当前任务的确认或问题，等待用户决定。
    {{- end }}
    {{ include "agentos.conciseResponse" . }}
  skills: []
  tools:
  - mcp:
      server:
        kind: RemoteMCPServer
        name: kagent-collaboration
      tools: [list_agents, list_sessions, invoke_agent]
      requireApproval: false
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: assistant
  labels:
    agentos.dev/role: assistant
  annotations:
    agentos.dev/description: 团队的聊天入口
spec:
  template:
    ref:
      name: assistant
  harnessRef:
    name: {{ .Values.defaultHarness }}
