suite: environment permission sets
values:
- ../../../tests/fixtures/chart-values.yaml
release:
  name: agentos
  namespace: agentos
set:
  global.agentos.environments:
  - name: example
    governance: approval
  global.agentos.toolsets:
    inventory:
      readOnly:
      - list_assets
      write:
      - execute_job
      managementReadOnly:
      - list_accounts
      management:
      - create_asset
  global.agentos.identities:
  - name: assistant
    services:
      inventory: manage
tests:
- it: passes native tier and identity inputs to the controller
  template: access-plan.yaml
  asserts:
  - isKind:
      of: AccessPlan
  - equal:
      path: spec.identities[0].services.inventory
      value: manage
  - equal:
      path: spec.toolsets.inventory.management
      value:
      - create_asset
- it: preserves an explicit empty approval set
  template: access-plan.yaml
  set:
    global.agentos.toolsets.inventory.approval: []
  asserts:
  - equal:
      path: spec.toolsets.inventory.approval
      value: []
- it: forwards browser environment RPC through the native gateway
  template: web-config.yaml
  set:
    global.agentos.environments: []
  asserts:
  - matchRegex:
      path: data["oauth2-proxy.yaml"]
      pattern: 'id: environments\s+path: /environments/\s+uri: http://agentos-gateway:8080'
- it: publishes native environment routes on the API host
  template: routes.yaml
  set:
    global.agentos.environments: []
  documentSelector:
    path: metadata.name
    value: agentos-api
  asserts:
  - contains:
      path: spec.rules
      content:
        matches: [{path: {type: PathPrefix, value: /environments}}]
        backendRefs: [{name: agentos-gateway, port: 8080}]
- it: allows native browser policies to refine the inherited gateway requirement
  template: gateway-auth.yaml
  set:
    global.agentos.environments: []
  asserts:
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "request.path.startsWith\\('/environments/'\\)"
- it: allows catalog discovery only on base MCP routes
  template: gateway-auth.yaml
  set:
    global.agentos.environments: []
  asserts:
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "request.method == 'POST' && request.path.matches\\('\\^/mcp/\\[a-z\\]\\[a-z0-9-\\]\\*\\$'\\)"
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "jwt.azp == 'agentos-catalog'"
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "json\\(request.body\\).method in \\['initialize','notifications/initialized','ping','tools/list'\\]"
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "json\\(request.body\\).method == 'resources/read' && json\\(request.body\\).params.uri.startsWith\\('ui://'\\)"
  - matchRegex:
      path: spec.backend.mcp.authorization.policy.matchExpressions[0]
      pattern: "(?s)request.path.matches\\('\\^/mcp/\\[a-z\\]\\[a-z0-9-\\]\\*\\$'\\).*jwt.iss == \"https://identity.example.test/realms/operations\".*jwt.azp == 'agentos-catalog'.*!has\\(mcp.resource\\).*mcp.resource.name.startsWith\\('ui://'\\)"
