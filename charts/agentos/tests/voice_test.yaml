suite: optional real-time voice worker
values: [../../../tests/fixtures/chart-values.yaml]
release: {name: agentos, namespace: agentos}
templates: ['*.yaml']
tests:
  - it: omits the voice worker when disabled
    asserts:
      - template: voice.yaml
        hasDocuments: {count: 0}
      - template: console-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_URL, value: 'http://agentos-voice:8080'}
      - template: console-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_TOKEN, valueFrom: {secretKeyRef: {name: agentos-voice, key: api-token}}}
  - it: enables voice with a bounded and unprivileged worker
    set:
      voice.enabled: true
      voice.image: registry.example.com/voice@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - template: voice.yaml
        documentSelector: {path: "kind", value: Deployment}
        equal: {path: "spec.template.spec.automountServiceAccountToken", value: false}
      - template: voice.yaml
        documentSelector: {path: "kind", value: Deployment}
        equal: {path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true}
      - template: voice.yaml
        documentSelector: {path: "kind", value: Deployment}
        isNotNullOrEmpty: {path: "spec.template.spec.containers[0].readinessProbe.exec.command"}
      - template: voice.yaml
        containsDocument: {apiVersion: networking.k8s.io/v1, kind: NetworkPolicy, name: agentos-voice, any: true}
      - template: console-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_URL, value: 'http://agentos-voice:8080'}
      - template: console-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_TOKEN, valueFrom: {secretKeyRef: {name: agentos-voice, key: api-token}}}
