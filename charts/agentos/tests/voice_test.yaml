suite: optional voice worker
values: [../../../tests/fixtures/chart-values.yaml]
release: {name: agentos, namespace: agentos}
templates: ['*.yaml']
tests:
  - it: renders no voice resources when disabled
    asserts:
      - template: voice.yaml
        hasDocuments: {count: 0}
      - template: speech-settings.yaml
        hasDocuments: {count: 0}
      - template: api-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_AGENT, value: agentos-voice}
  - it: runs the worker with its own service account token for the API
    set:
      voice.enabled: true
      voice.image: registry.example.com/voice@sha256:1111111111111111111111111111111111111111111111111111111111111111
    asserts:
      - template: voice.yaml
        documentSelector: {path: kind, value: Deployment}
        equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
      - template: voice.yaml
        documentSelector: {path: kind, value: Deployment}
        equal:
          path: spec.template.spec.volumes[1].projected.sources[0].serviceAccountToken.audience
          value: agentos-voice
      - template: voice.yaml
        documentSelector: {path: kind, value: Deployment}
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: LIVEKIT_AGENT_NAME, value: agentos-voice}
      - template: voice.yaml
        documentSelector: {path: kind, value: NetworkPolicy}
        notExists: {path: spec.ingress}
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_SUBJECT, value: 'system:serviceaccount:agentos:agentos-voice'}
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content: {name: AGENTOS_VOICE_GATEWAY_URL, value: 'http://agentos-mcp-gateway.agentos.svc.cluster.local:8080'}
      - template: api-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENTOS_VOICE_SESSION_KEY
            valueFrom: {secretKeyRef: {name: agentos-voice-sessions, key: key}}
      - template: voice.yaml
        documentSelector: {path: kind, value: Deployment}
        notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "AGENTOS_VOICE_SESSION_KEY")]
      - template: controller.yaml
        documentSelector: {path: kind, value: Deployment}
        contains:
          path: spec.template.spec.containers[0].args
          content: --speech-secret=agentos-speech
      - template: controller.yaml
        documentSelector: {path: kind, value: Deployment}
        contains:
          path: spec.template.spec.containers[0].args
          content: --voice-subject=system:serviceaccount:agentos:agentos-voice
      - template: gateway-networkpolicy.yaml
        contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels: {app.kubernetes.io/instance: agentos, app.kubernetes.io/component: voice}
      - template: api-networkpolicy.yaml
        equal:
          path: spec.ingress[2]
          value:
            from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/instance: agentos, app.kubernetes.io/component: voice}
            ports: [{port: 9093, protocol: TCP}]
      - template: api-service.yaml
        contains:
          path: spec.ports
          content: {name: voice, port: 9093, targetPort: voice}
      - template: workload-auth-rolebinding.yaml
        contains:
          path: subjects
          content: {kind: ServiceAccount, name: agentos-api, namespace: agentos}
      - template: gateway-auth.yaml
        matchRegex:
          path: spec.traffic.authorization.policy.matchExpressions[0]
          pattern: "request.path.startsWith\\('/speech/'\\)"
