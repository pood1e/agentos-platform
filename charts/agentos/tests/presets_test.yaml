suite: platform resource lifecycle
values:
- ../../../tests/fixtures/chart-values.yaml
templates:
- preset-system.yaml
release:
  name: agentos
  namespace: agentos
tests:
- it: declares the same native presets for installation and upgrade
  asserts:
  - isKind:
      of: Preset
  - lengthEqual:
      path: spec.resources
      count: 4
  - equal:
      path: spec.resources[0].kind
      value: AgentTemplate
- it: keeps desired presets deterministic during upgrade
  release:
    upgrade: true
  asserts:
  - isKind:
      of: Preset
  - lengthEqual:
      path: spec.resources
      count: 4
