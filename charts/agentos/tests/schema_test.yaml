suite: reject invalid platform values
values:
- ../../../tests/fixtures/chart-values.yaml
templates:
- '*.yaml'
tests:
- it: rejects image.digest
  set:
    image.digest: latest
  asserts:
  - failedTemplate: {}
- it: rejects pack.image
  set:
    pack.image: latest
  asserts:
  - failedTemplate: {}
- it: rejects unknown values
  set:
    unrecognized: true
  asserts:
  - failedTemplate: {}
- it: rejects routes without a site gateway
  set:
    route.parentRefs: []
  asserts:
  - failedTemplate: {}
- it: rejects return origins outside HTTPS
  set:
    identity.returnOrigins: [http://controller.example.test]
  asserts:
  - failedTemplate: {}
