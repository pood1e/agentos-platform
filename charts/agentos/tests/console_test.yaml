suite: console identity and rollout contract
values:
- ../../../tests/fixtures/chart-values.yaml
release:
  name: agentos
  namespace: agentos
templates:
- '*.yaml'
tests:
- it: drains requests before replacing a ready instance
  asserts:
  - equal:
      path: spec.strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
    template: console-deployment.yaml
  - equal:
      path: spec.minReadySeconds
      value: 5
    template: console-deployment.yaml
  - equal:
      path: spec.template.spec.terminationGracePeriodSeconds
      value: 60
    template: console-deployment.yaml
  - equal:
      path: spec.template.spec.containers[0].lifecycle.preStop
      value:
        sleep:
          seconds: 5
    template: console-deployment.yaml
  - equal:
      path: spec.template.spec.containers[0].command
      value:
      - node
      - build/server/platform/main.js
    template: console-deployment.yaml
  - lengthEqual:
      path: spec.template.spec.containers
      count: 1
    template: console-deployment.yaml
