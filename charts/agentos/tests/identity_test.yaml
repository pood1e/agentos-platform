suite: browser sessions and the site identity provider
values:
- ../../../tests/fixtures/chart-values.yaml
release: {name: agentos, namespace: agentos}
templates: ['*.yaml']
tests:
- it: keeps the identity client credential out of the API
  template: api-deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content: {name: AGENTOS_OIDC_WRITER_ROLE, value: operator}
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: AGENTOS_OIDC_CLIENT_SECRET
        valueFrom: {secretKeyRef: {name: agentos-identity, key: client-secret}}
- it: holds browser sessions in front of the API and strips client authorization headers
  template: web-config.yaml
  asserts:
  - matchRegex:
      path: data["oauth2-proxy.yaml"]
      pattern: 'uri: http://agentos-api:8080'
  - matchRegex:
      path: data["oauth2-proxy.yaml"]
      pattern: 'path: /kagent\.api\.v1\.AuthorizationService/'
  - matchRegex:
      path: data["oauth2-proxy.yaml"]
      pattern: 'claim: access_token\s+prefix: "Bearer "'
  - matchRegex:
      path: data["oauth2-proxy.yaml"]
      pattern: 'issuerURL: "https://identity.example.test/realms/operations"'
- it: attaches every public route to the site gateway
  template: routes.yaml
  asserts:
  - equal: {path: spec.parentRefs, value: [{name: site, sectionName: https}]}
  - documentIndex: 1
    equal: {path: spec.hostnames, value: [api.agentos.example.test]}
- it: trusts a private IdP CA for browser login
  set:
    identity.caCertificateRef: {name: identity-ca, key: issuer.pem}
  asserts:
  - template: web-deployment.yaml
    documentIndex: 0
    contains:
      path: spec.template.spec.containers[0].env
      content: {name: SSL_CERT_DIR, value: /etc/ssl/certs:/etc/agentos/identity}
  - template: web-deployment.yaml
    documentIndex: 0
    contains:
      path: spec.template.spec.containers[0].volumeMounts
      content: {name: identity-ca, mountPath: /etc/agentos/identity, readOnly: true}
