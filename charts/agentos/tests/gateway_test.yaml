suite: platform gateway workload authentication
values:
- ../../../tests/fixtures/chart-values.yaml
release:
  name: agentos
  namespace: agentos
tests:
- it: leaves the external execution entry point undeployed without registered sources
  template: external-executions.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: rejects the removed automation configuration
  set:
    automation.enabled: true
  template: external-executions.yaml
  asserts:
  - failedTemplate:
      errorPattern: 'automation'
- it: uses a public SDK placeholder while authorization comes from Actor JWTs
  template: model-client.yaml
  asserts:
  - equal:
      path: stringData.placeholder
      value: actor-jwt-required
- it: keeps model and MCP transport audiences separate
  template: gateway-auth.yaml
  asserts:
  - equal:
      path: spec.frontend.http.maxBufferSize
      value: 16Mi
  - notExists:
      path: spec.traffic.apiKeyAuthentication
  - lengthEqual:
      path: spec.traffic.jwtAuthentication.providers
      count: 1
  - equal:
      path: spec.traffic.jwtAuthentication.providers[0].jwks.remote
      value:
        backendRef:
          group: agentgateway.dev
          kind: AgentgatewayBackend
          name: agentos-actor-jwks
        jwksPath: /openid/v1/jwks
  - notExists:
      path: spec.traffic.jwtAuthentication.providers[0].jwks.inline
  - contains:
      path: spec.traffic.jwtAuthentication.providers[0].audiences
      content: http://agentos-gateway.agentos.svc.cluster.local:8080
  - contains:
      path: spec.traffic.jwtAuthentication.providers[0].audiences
      content: http://agentos-mcp-gateway.agentos.svc.cluster.local:8080
- it: fetches native Actor keys over verified TLS with site trust
  template: actor-jwks.yaml
  asserts:
  - equal:
      path: metadata.name
      value: agentos-actor-jwks
  - equal:
      path: spec
      value:
        static: {host: idp.ate-system.svc, port: 443}
        policies:
          tls:
            sni: idp.ate-system.svc
            caCertificateRefs: [{name: substrate-service-dns-ca, kind: ConfigMap}]
- it: preserves native endpoint and certificate references
  template: actor-jwks.yaml
  set:
    execution.actorJWKS:
      static: {host: idp.identity.svc, port: 8443}
      policies:
        tls:
          sni: actors.example.com
          verifySubjectAltNames: [actors.example.com]
          caCertificateRefs: [{name: actor-service-ca, kind: ConfigMap, key: bundle.pem}]
  asserts:
  - equal:
      path: spec
      value:
        static: {host: idp.identity.svc, port: 8443}
        policies:
          tls:
            sni: actors.example.com
            verifySubjectAltNames: [actors.example.com]
            caCertificateRefs: [{name: actor-service-ca, kind: ConfigMap, key: bundle.pem}]
- it: requires an explicit JWKS trust root
  template: actor-jwks.yaml
  set:
    execution.actorJWKS.policies.tls.caCertificateRefs: []
  asserts:
  - failedTemplate:
      errorPattern: 'caCertificateRefs'
- it: requires JWKS certificate and hostname verification
  template: actor-jwks.yaml
  set:
    execution.actorJWKS.policies.tls.insecureSkipVerify: Hostname
  asserts:
  - failedTemplate:
      errorPattern: 'tls'
- it: authenticates external executions before MCP initialization and on upstream transport
  set:
    execution.sources:
    - issuer: https://idp.example.com/realms/production
      audience: agentos-executions
      clientId: analysis-controller
      subject: service-account-analysis
      agents: [{namespace: agentos, name: diagnosis}]
  template: external-executions.yaml
  documentSelector:
    path: kind
    value: AgentgatewayBackend
  asserts:
  - equal:
      path: metadata.annotations["agentos.dev/connection-role"]
      value: ingress
  - equal:
      path: metadata.annotations["agentos.dev/system-connection"]
      value: 'true'
  - equal:
      path: spec.policies.extAuth.failureMode
      value: FailClosed
  - equal:
      path: spec.policies.extAuth.http.path
      value: '''/authorize/executions'''
  - equal:
      path: spec.policies.mcp.authorization.policy.matchExpressions[0]
      value: mcp.tool.name in ['run_execution', 'get_execution', 'cancel_execution']
- it: consumes model transport credentials before injecting provider credentials
  template: gateway-auth.yaml
  asserts:
  - equal:
      path: spec.traffic.extAuth.conditional[0].policy.http.allowedResponseHeaders
      value:
      - authorization
