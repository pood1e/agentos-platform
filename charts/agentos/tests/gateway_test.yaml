suite: native runtime gateway authorization
values:
- ../../../tests/fixtures/chart-values.yaml
release: {name: agentos, namespace: agentos}
tests:
- it: delegates MCP Actor audience validation to each owned route
  template: gateway-auth.yaml
  asserts:
  - lengthEqual: {path: spec.traffic.jwtAuthentication.providers, count: 3}
  - notExists: {path: 'spec.traffic.jwtAuthentication.providers[0].audiences'}
  - equal:
      path: spec.traffic.jwtAuthentication.providers[1].audiences
      value: ['http://agentos-gateway.agentos.svc.cluster.local:8080', agentos-mcp-discovery]
  - matchRegex:
      path: spec.traffic.authorization.policy.matchExpressions[0]
      pattern: "request.path.startsWith\\('/mcp/'\\) && request.path != '/mcp/team-sessions'"
  - lengthEqual: {path: spec.traffic.extAuth.conditional, count: 2}
- it: admits public traffic to the standalone environment gateway
  template: gateway-networkpolicy.yaml
  set:
    global.agentos.environments: []
  asserts:
  - contains:
      path: spec.ingress
      content:
        from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        ports: [{port: 8080, protocol: TCP}]
- it: resolves live model authority directly at native kagent
  template: gateway-auth.yaml
  asserts:
  - equal:
      path: spec.traffic.extAuth.conditional[0].policy.backendRef
      value: {group: agentgateway.dev, kind: AgentgatewayBackend, name: agentos-native-authority}
  - equal:
      path: spec.traffic.extAuth.conditional[0].policy.http.responseMetadata.models
      value: json(response.body)
- it: uses native collaboration with a separately scoped discovery identity
  template: collaboration.yaml
  asserts:
  - equal: {path: spec.url, value: 'http://kagent-controller:8083/mcp'}
  - equal:
      path: spec.discoveryAuth.serviceAccount
      value: {serviceAccountRef: {name: agentos-discovery}, audience: kagent-invocation}
- it: fetches native Actor keys with verified site trust
  template: actor-jwks.yaml
  asserts:
  - equal:
      path: spec.policies.tls
      value: {sni: idp.ate-system.svc, caCertificateRefs: [{name: substrate-service-dns-ca, kind: ConfigMap}]}
- it: requires an explicit JWKS trust root
  template: actor-jwks.yaml
  set:
    runtime.actorJWKS.policies.tls.caCertificateRefs: []
  asserts:
  - failedTemplate: {errorPattern: caCertificateRefs}
- it: requires verified TLS for Actor key discovery
  template: actor-jwks.yaml
  set:
    runtime.actorJWKS.policies.tls.insecureSkipVerify: Hostname
  asserts:
  - failedTemplate: {errorPattern: insecureSkipVerify}
- it: runs business MCP on its single HTTP port
  template: dataplane-service.yaml
  asserts:
  - equal:
      path: spec.ports
      value: [{name: http, port: 8080, targetPort: http}]
- it: resolves an IPv6 native authority endpoint
  template: native-authority.yaml
  set:
    kagent.endpoint: http://[fd00::1]:8083
  asserts:
  - equal: {path: spec.static, value: {host: 'fd00::1', port: 8083}}
- it: uses the default HTTPS native authority port
  template: native-authority.yaml
  set:
    kagent.endpoint: https://native.example.test
  asserts:
  - equal: {path: spec.static, value: {host: native.example.test, port: 443}}
  - equal: {path: spec.policies.tls.sni, value: native.example.test}
