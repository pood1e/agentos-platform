suite: platform gateway workload authentication
values:
- ../../../tests/fixtures/chart-values.yaml
release:
  name: agentos
  namespace: agentos
tests:
- it: uses a public SDK placeholder while authorization comes from Actor JWTs
  template: model-client.yaml
  asserts:
  - equal:
      path: stringData.placeholder
      value: actor-jwt-required
- it: keeps model and MCP transport audiences separate
  template: gateway-auth.yaml
  asserts:
  - equal:
      path: spec.frontend.http.maxBufferSize
      value: 16Mi
  - notExists:
      path: spec.traffic.apiKeyAuthentication
  - lengthEqual:
      path: spec.traffic.jwtAuthentication.providers
      count: 1
  - equal:
      path: spec.traffic.jwtAuthentication.providers[0].jwks.remote
      value:
        backendRef:
          name: agentos-dataplane
          port: 9092
        jwksPath: /keys/actor
  - notExists:
      path: spec.traffic.jwtAuthentication.providers[0].jwks.inline
  - contains:
      path: spec.traffic.jwtAuthentication.providers[0].audiences
      content: http://agentos-gateway.agentos.svc.cluster.local:8080
  - contains:
      path: spec.traffic.jwtAuthentication.providers[0].audiences
      content: http://agentos-mcp-gateway.agentos.svc.cluster.local:8080
- it: authenticates automation before MCP initialization and on upstream transport
  set:
    automation.enabled: true
  template: automation.yaml
  documentSelector:
    path: kind
    value: AgentgatewayBackend
  asserts:
  - equal:
      path: metadata.annotations["agentos.dev/connection-role"]
      value: ingress
  - equal:
      path: metadata.annotations["agentos.dev/system-connection"]
      value: 'true'
  - equal:
      path: spec.policies.extAuth.failureMode
      value: FailClosed
  - equal:
      path: spec.policies.extAuth.http.path
      value: '''/authorize/automation'''
  - equal:
      path: spec.policies.mcp.authorization.policy.matchExpressions[0]
      value: mcp.tool.name in ['run_case', 'observe_case', 'cancel_case', 'list_scheduled_run_executions', 'get_scheduled_run_execution_result',
        'dispatch_scheduled_run_execution']
- it: consumes model transport credentials before injecting provider credentials
  template: gateway-auth.yaml
  asserts:
  - equal:
      path: spec.traffic.extAuth.conditional[0].policy.http.allowedResponseHeaders
      value:
      - authorization
