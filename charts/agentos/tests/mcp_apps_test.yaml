suite: isolated MCP Apps sandbox
values:
- ../../../tests/fixtures/chart-values.yaml
release: {name: agentos, namespace: agentos}
templates: ['*.yaml']
tests:
- it: omits the optional sandbox route
  set:
    route.sandbox.origin: ''
  template: routes.yaml
  asserts:
  - hasDocuments: {count: 2}
- it: exposes only the proxy path on the separate host
  set:
    mcpApps.imageOrigins: ['https://icons.example.test']
  asserts:
  - template: routes.yaml
    documentIndex: 2
    equal: {path: spec.hostnames, value: [sandbox.agentos.example.test]}
  - template: routes.yaml
    documentIndex: 2
    equal:
      path: spec.rules
      value:
      - matches: [{path: {type: Exact, value: /mcp-app-sandbox}}]
        backendRefs: [{name: agentos-web, port: 8081}]
  - template: api-deployment.yaml
    contains:
      path: 'spec.template.spec.containers[0].env'
      content: {name: AGENTOS_SANDBOX_ORIGIN, value: 'https://sandbox.agentos.example.test'}
  - template: web-deployment.yaml
    documentIndex: 0
    contains:
      path: 'spec.template.spec.containers[1].env'
      content: {name: AGENTOS_FRAME_SRC, value: 'https://sandbox.agentos.example.test'}
  - template: web-deployment.yaml
    documentIndex: 0
    contains:
      path: 'spec.template.spec.containers[1].env'
      content: {name: AGENTOS_MCP_IMAGE_ORIGINS, value: 'https://icons.example.test'}
- it: rejects image origins with paths or wildcards
  set:
    mcpApps.imageOrigins: ['https://*.example.test/path']
  template: web-deployment.yaml
  asserts:
  - failedTemplate: {errorPattern: imageOrigins}
- it: rejects a sandbox on the console host
  set:
    route.sandbox.origin: https://agentos.example.test
  template: routes.yaml
  asserts:
  - failedTemplate: {errorMessage: route.sandbox.origin must be a separate origin}
- it: supports an externally hosted isolated sandbox
  set:
    route.sandbox.origin: ''
    mcpApps.sandboxOrigin: https://apps.example.test
  asserts:
  - template: routes.yaml
    hasDocuments: {count: 2}
  - template: api-deployment.yaml
    contains:
      path: spec.template.spec.containers[0].env
      content: {name: AGENTOS_SANDBOX_ORIGIN, value: 'https://apps.example.test'}
  - template: access-plan.yaml
    equal: {path: spec.platform.appAuthorityBackend, value: agentos-app-authority}
  - template: access-plan.yaml
    equal: {path: spec.platform.appJWTProvider.audiences, value: [agentos-platform]}
- it: requires rotating viewer JWKS when Apps are enabled
  set:
    identity.jwksURL: ''
  template: app-jwks.yaml
  asserts:
  - failedTemplate: {errorPattern: jwksURL}
- it: rejects an App sandbox sharing the API origin
  set:
    route.sandbox.origin: ''
    mcpApps.sandboxOrigin: https://api.agentos.example.test
  template: web-deployment.yaml
  asserts:
  - failedTemplate: {errorMessage: mcpApps.sandboxOrigin must be an isolated origin}
- it: rejects a hosted sandbox and configured origin mismatch
  set:
    mcpApps.sandboxOrigin: https://other.example.test
  template: routes.yaml
  asserts:
  - failedTemplate: {errorMessage: route.sandbox.origin must match mcpApps.sandboxOrigin}
- it: keeps ordinary MCP identity configuration unchanged when Apps are disabled
  set:
    route.sandbox.origin: ''
    mcpApps.sandboxOrigin: ''
    identity.jwksURL: ''
  asserts:
  - template: app-authority.yaml
    hasDocuments: {count: 0}
  - template: app-jwks.yaml
    hasDocuments: {count: 0}
  - template: access-plan.yaml
    notExists: {path: spec.platform.appAuthorityBackend}
  - template: gateway-auth.yaml
    lengthEqual: {path: spec.traffic.jwtAuthentication.providers, count: 2}
- it: authenticates viewers before forwarding only native App selection
  asserts:
  - template: gateway-auth.yaml
    matchRegex:
      path: spec.traffic.jwtAuthentication.location.expression
      pattern: "^request.path.startsWith\\('/apps/mcp/'\\)"
  - template: gateway-auth.yaml
    equal: {path: 'spec.traffic.jwtAuthentication.providers[2].issuer', value: 'https://identity.example.test/realms/operations'}
  - template: app-jwks.yaml
    equal: {path: spec.policies.tls.sni, value: identity.example.test}
  - template: app-authority.yaml
    equal: {path: spec.static.port, value: 8080}
  - template: app-authority.yaml
    equal: {path: spec.policies.http, value: {version: HTTP1, requestTimeout: 15s}}
- it: preserves an issuer JWKS path query and explicit HTTPS port
  set:
    identity.jwksURL: https://identity.example.test:8443/keys?version=2
  asserts:
  - template: app-jwks.yaml
    equal: {path: spec.static.host, value: identity.example.test}
  - template: app-jwks.yaml
    equal: {path: spec.static.port, value: 8443}
  - template: app-jwks.yaml
    equal: {path: spec.policies.tls.sni, value: identity.example.test}
  - template: access-plan.yaml
    equal: {path: spec.platform.appJWTProvider.jwks.remote.jwksPath, value: '/keys?version=2'}
- it: rejects the API origin with an explicit default TLS port
  set:
    route.sandbox.origin: ''
    mcpApps.sandboxOrigin: https://api.agentos.example.test:443
  template: web-deployment.yaml
  asserts:
  - failedTemplate: {errorMessage: mcpApps.sandboxOrigin must be an isolated origin}
- it: binds IP origins to their listeners without hostnames
  set:
    route.console: {origin: 'https://192.0.2.10:8443', parentRefs: [{name: edge, sectionName: console}]}
    route.api: {origin: 'https://192.0.2.10:8444', parentRefs: [{name: edge, sectionName: api}]}
    route.sandbox: {origin: 'https://192.0.2.10:8445', parentRefs: [{name: edge, sectionName: sandbox}]}
    mcpApps.sandboxOrigin: https://192.0.2.10:8445
  template: routes.yaml
  asserts:
  - notExists: {path: spec.hostnames}
  - equal: {path: 'spec.parentRefs[0].sectionName', value: console}
    documentIndex: 0
  - equal: {path: 'spec.parentRefs[0].sectionName', value: api}
    documentIndex: 1
  - equal: {path: 'spec.parentRefs[0].sectionName', value: sandbox}
    documentIndex: 2
