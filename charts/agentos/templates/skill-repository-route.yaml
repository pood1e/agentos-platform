{{- if .Values.gateway.skillRepository.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "agentos.name" . }}-skill-repository
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs:
    - {name: {{ include "agentos.name" . }}-skill-gateway, sectionName: http}
  rules:
    - matches:
        - method: GET
          path: {type: Exact, value: {{ printf "%s/info/refs" .Values.gateway.skillRepository.path }}}
          queryParams:
            - {type: Exact, name: service, value: git-upload-pack}
        - method: POST
          path: {type: Exact, value: {{ printf "%s/git-upload-pack" .Values.gateway.skillRepository.path }}}
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: {{ .Values.gateway.skillRepository.host }}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ include "agentos.name" . }}-skill-repository}
{{- end }}
