{{- if .Values.voice.enabled }}
{{- $name := printf "%s-voice" (include "agentos.name" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: voice
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: voice
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: voice
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      # Draining workers finish their calls, which last at most 30 minutes.
      terminationGracePeriodSeconds: 1800
      securityContext:
        {{- include "agentos.securityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: voice
          image: {{ required "voice.image is required" .Values.voice.image | quote }}
          ports: [{name: health, containerPort: 8081}]
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: LIVEKIT_URL, value: {{ .Values.voice.livekitURL | quote }}}
            - {name: LIVEKIT_AGENT_NAME, value: {{ $name }}}
            - name: LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.voice.secretRef }}, key: api-key}}
            - name: LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.voice.secretRef }}, key: api-secret}}
            - {name: AGENTOS_API_URL, value: "http://{{ include "agentos.apiService" . }}:9093"}
            - {name: AGENTOS_TOKEN_FILE, value: /var/run/agentos-voice/token}
            - {name: VOICE_CAPACITY, value: {{ .Values.voice.capacity | quote }}}
          startupProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          resources: {{ toYaml .Values.voice.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: identity, mountPath: /var/run/agentos-voice, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: identity
          projected:
            sources:
              - serviceAccountToken: {audience: agentos-voice, expirationSeconds: 600, path: token}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: voice
  policyTypes: [Ingress]
{{- end }}
