{{- if .Values.evaluation.enabled }}
{{- $name := include "agentos.name" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}-judge
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef: {group: agentgateway.dev, kind: AgentgatewayParameters, name: {{ $name }}-gateway}
  listeners:
    - name: judge
      port: 8081
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
        kinds: [{group: agentgateway.dev, kind: AgentgatewayModel}]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: {{ $name }}-judge
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  {{- omit .Values.evaluation.judge.spec "parentRefs" | toYaml | nindent 2 }}
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ $name }}-judge, sectionName: judge}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}-judge
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: {{ $name }}-judge}]
  traffic:
    apiKeyAuthentication:
      mode: Strict
      configMapSelector:
        matchLabels: {agentos.dev/gateway-keys: {{ $name }}}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - "has(apiKey.service) && apiKey.service in ['evaluator', 'online-judge'] && request.path.matches('^/v1/(responses|chat/completions)(/.*)?$')"
    headerModifiers:
      request: {remove: [authorization, x-api-key]}
{{- end }}
