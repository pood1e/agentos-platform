{{- $token := include "agentos.gatewayToken" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentos.name" . }}-gateway-keys
  labels:
    agentos.dev/gateway-keys: {{ include "agentos.name" . }}
    {{- include "agentos.labels" . | nindent 4 }}
data:
  {{- if .Values.evaluation.enabled }}
  online-judge: {{ dict "keyHash" (printf "sha256:%s" ((include "agentos.nativeToken" (dict "root" . "name" (printf "%s-online-judge" (include "agentos.name" .)))) | sha256sum)) "metadata" (dict "service" "online-judge") | toJson | quote }}
  {{- end }}
  agentos: {{ dict "keyHash" (printf "sha256:%s" ($token | sha256sum)) "metadata" (dict "service" "agentos") | toJson | quote }}
  catalog: {{ dict "keyHash" (printf "sha256:%s" ((include "agentos.catalogToken" .) | sha256sum)) "metadata" (dict "service" "catalog" "workspace" .Release.Namespace) | toJson | quote }}
  platform: {{ dict "keyHash" (printf "sha256:%s" ((include "agentos.collaborationToken" .) | sha256sum)) "metadata" (dict "service" "platform" "workspace" .Release.Namespace "tools" (dict "team-sessions" (list "search_knowledge" "list_agents" "create_session" "dispatch_session" "list_role_tools" "prepare_role") "kagent-collaboration" (list "invoke_session" "list_sessions"))) | toJson | quote }}
