{{- $token := include "agentos.gatewayToken" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentos.name" . }}-gateway-keys
  labels:
    agentos.dev/gateway-keys: {{ include "agentos.name" . }}
    {{- include "agentos.labels" . | nindent 4 }}
data:
  agentos: {{ dict "keyHash" (printf "sha256:%s" ($token | sha256sum)) "metadata" (dict "service" "agentos") | toJson | quote }}
  platform: {{ dict "keyHash" (printf "sha256:%s" ((include "agentos.collaborationToken" .) | sha256sum)) "metadata" (dict "service" "platform" "workspace" .Release.Namespace "tools" (dict "team-sessions" (list "prepare_change" "delegate_coordinator" "search_knowledge" "list_agents" "create_session" "dispatch_session" "list_role_tools" "prepare_role") "kagent-collaboration" (list "invoke_session" "list_sessions"))) | toJson | quote }}
