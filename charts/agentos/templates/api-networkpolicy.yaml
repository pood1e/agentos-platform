{{- $component := dict "root" . "component" "api" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentos.name" . }}-api
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentos.platformSelector" $component | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{ toYaml .Values.route.from | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
      ports: [{port: 8080, protocol: TCP}]
