{{- $name := include "agentos.name" . -}}
{{- $models := printf "http://%s-gateway.%s.svc.cluster.local:8080" $name .Release.Namespace -}}
{{- $mcps := printf "http://%s-mcp-gateway.%s.svc.cluster.local:8080" $name .Release.Namespace -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}-gateway-auth
  labels: {{ include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ $name }}-gateway}
  frontend:
    http: {maxBufferSize: 16Mi}
  backend:
    mcp:
      authorization:
        action: Require
        policy:
          matchExpressions:
            - >-
              (jwt.sub == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}-discovery' &&
               (!has(mcp.resource) || mcp.resource.name.startsWith('ui://')))
              {{- if .Values.mcpApps.sandboxOrigin }}
              || (request.path.startsWith('/apps/mcp/') && has(extauthz.selection) &&
                  has(extauthz.selection.tools) && has(mcp.tool) &&
                  (mcp.tool.name in extauthz.selection.tools || mcp.tool.target + '_' + mcp.tool.name in extauthz.selection.tools))
              {{- end }}
  traffic:
    jwtAuthentication:
      mode: Permissive
      preserveToken: true
      location:
        expression: >-
          {{- if .Values.mcpApps.sandboxOrigin }}
          request.path.startsWith('/apps/mcp/') ?
          ('authorization' in request.headers ? request.headers['authorization'].replace('Bearer ', '') : '') :
          {{- end }}
          'x-substrate-actor-token' in request.headers ? request.headers['x-substrate-actor-token'].replace('Bearer ', '') :
          ('authorization' in request.headers ? request.headers['authorization'].replace('Bearer ', '') : '')
      providers:
        - issuer: {{ .Values.runtime.actorIssuer | quote }}
          audiences: {{ include "agentos.actorAudiences" . }}
          jwks:
            remote:
              backendRef: {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ include "agentos.actorJWKSBackend" . }}}
              jwksPath: /openid/v1/jwks
          validation: {requiredClaims: [sub, exp, aud]}
        - issuer: {{ .Values.runtime.kubernetesIssuer | quote }}
          audiences: [{{ $models | quote }}, agentos-mcp-discovery]
          jwks:
            remote:
              backendRef: {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $name }}-kubernetes-jwks}
              jwksPath: /openid/v1/jwks
          validation: {requiredClaims: [sub, exp, aud]}
        {{- if .Values.mcpApps.sandboxOrigin }}
        - {{ include "agentos.appJWTProvider" . | nindent 10 | trim }}
        {{- end }}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - >-
            {{- if .Values.mcpApps.sandboxOrigin }}
            (request.path.startsWith('/apps/mcp/') && has(jwt.iss) && jwt.iss == {{ .Values.identity.issuer | toJson }}) ||
            {{- end }}
            {{- if .Values.global.agentos.environments }}
            request.path.startsWith('/environments/') ||
            {{- end }}
            {{- if .Values.voice.enabled }}
            request.path.startsWith('/speech/') ||
            {{- end }}
            (has(jwt.iss) && jwt.iss == '{{ .Values.runtime.actorIssuer }}' && 'x-substrate-actor-token' in request.headers && (
              (request.path.startsWith('/v1/') && (jwt.aud == '{{ $models }}' || '{{ $models }}' in jwt.aud)) ||
              (request.path.startsWith('/mcp/') && (jwt.aud == '{{ $mcps }}' || '{{ $mcps }}' in jwt.aud))
            )) ||
            (has(jwt.iss) && jwt.iss == '{{ .Values.runtime.kubernetesIssuer }}' && !('x-substrate-actor-token' in request.headers) && (
              (request.path.startsWith('/mcp/') && jwt.sub == 'system:serviceaccount:{{ .Release.Namespace }}:{{ $name }}-discovery' &&
               (jwt.aud == 'agentos-mcp-discovery' || 'agentos-mcp-discovery' in jwt.aud) && request.method == 'POST' &&
               (json(request.body).method in ['initialize','notifications/initialized','ping','tools/list'] ||
                (json(request.body).method == 'resources/read' && json(request.body).params.uri.startsWith('ui://'))))
              {{- range .Values.gateway.models }}
              {{- if eq .name "knowledge-embedding" }}
              || (request.path == '/v1/embeddings' && request.method == 'POST' && jwt.sub == '{{ include "agentos.controllerSubject" $ }}' &&
                  (jwt.aud == '{{ $models }}' || '{{ $models }}' in jwt.aud) && json(request.body).model == {{ .spec.match.model | toJson }})
              {{- end }}
              {{- end }}
            ))
    extAuth:
      conditional:
        - condition: "request.path.startsWith('/v1/') && 'x-substrate-actor-token' in request.headers"
          policy:
            backendRef: {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $name }}-native-authority}
            failureMode: FailClosed
            http:
              path: "'/authorize/runtime'"
              allowedRequestHeaders: [x-substrate-actor-token]
              addRequestHeaders:
                authorization: "request.headers['x-substrate-actor-token']"
              responseMetadata:
                models: json(response.body)
        - condition: "request.path == '/mcp/team-sessions' && 'x-substrate-actor-token' in request.headers"
          policy:
            backendRef: {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $name }}-native-authority}
            failureMode: FailClosed
            http:
              path: {{ printf "/authorize/runtime?server=%s%%2Fteam-sessions&scope=agentos-agents-manage&credential=subject_token" .Release.Namespace | toJson | quote }}
              allowedRequestHeaders: [x-substrate-actor-token]
              addRequestHeaders: {authorization: "request.headers['x-substrate-actor-token']"}
              allowedResponseHeaders: [authorization]
              responseMetadata: {selection: json(response.body), scopes: "json(response.headers['x-kagent-scopes'])"}
        - condition: "request.path.startsWith('/mcp/') && request.path != '/mcp/team-sessions' && 'x-substrate-actor-token' in request.headers"
          policy:
            backendRef: {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $name }}-native-authority}
            failureMode: FailClosed
            http:
              path: {{ printf "'/authorize/runtime?server=%s%%2F' + request.path.split('/')[2]" .Release.Namespace | quote }}
              allowedRequestHeaders: [x-substrate-actor-token]
              addRequestHeaders: {authorization: "request.headers['x-substrate-actor-token']"}
              responseMetadata: {selection: json(response.body), scopes: "json(response.headers['x-kagent-scopes'])"}
