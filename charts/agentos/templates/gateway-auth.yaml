apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "agentos.name" . }}-gateway-auth
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ include "agentos.name" . }}-gateway}
  traffic:
    apiKeyAuthentication:
      mode: Permissive
      location:
        expression: >-
          ('authorization' in request.headers && request.headers['authorization'].startsWith('Bearer ')) ?
          request.headers['authorization'].replace('Bearer ', '') :
          (request.path.startsWith('/v1/messages') && 'x-api-key' in request.headers ? request.headers['x-api-key'] : '')
      configMapSelector:
        matchLabels: {agentos.dev/gateway-keys: {{ include "agentos.name" . }}}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - >-
            {{- range .Values.global.agentos.environments }}
            (has(jwt.sub) && request.path.startsWith('/mcp/{{ .name }}-')) ||
            {{- end }}
            (has(apiKey.service) && apiKey.service == 'agentos' &&
              request.path.matches('^/v1/(responses|chat/completions|messages|embeddings|models)(/.*)?$')) ||
            (has(apiKey.service) && apiKey.service == 'platform' &&
              apiKey.workspace == '{{ .Release.Namespace }}' && request.path in ['/mcp/team-sessions', '/mcp/kagent-collaboration']) ||
            (has(apiKey.service) && apiKey.service == 'engineer' &&
              apiKey.workspace == '{{ .Release.Namespace }}' &&
              has(apiKey.tools) && apiKey.tools.exists(server, request.path == '/mcp/' + server)) ||
            (has(apiKey.service) && apiKey.service == 'catalog' && apiKey.workspace == '{{ .Release.Namespace }}' &&
              request.path.startsWith('/mcp/')
              {{- range .Values.global.agentos.environments }} && !request.path.startsWith('/mcp/{{ .name }}-'){{- end }})
            {{- if .Values.automation.enabled }} ||
            (has(apiKey.service) && apiKey.service == 'automation' &&
              apiKey.workspace == '{{ .Release.Namespace }}' && has(apiKey.environment) &&
              request.path == '/mcp/automation')
            {{- end }}
            {{- if .Values.evaluation.enabled }} ||
            (has(apiKey.service) && apiKey.service == 'evaluator' &&
              apiKey.workspace == '{{ .Values.evaluation.namespace }}' && has(apiKey.candidate) &&
              request.path in ['/agentos.evaluation.v1.EvaluationExecutionService/Execute', '/agentos.evaluation.v1.EvaluationExecutionService/Complete']) ||
            (has(apiKey.service) && apiKey.service == 'evaluation' &&
              apiKey.workspace == '{{ .Values.evaluation.namespace }}' && has(apiKey.candidate) &&
              request.path in ['/mcp/team-sessions', '/mcp/evaluation-collaboration'])
            {{- end }}
    headerModifiers:
      request:
        remove: [authorization, x-api-key]
