{{- $trust := include "agentos.workloadAuth" . | fromJson -}}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "agentos.name" . }}-gateway-auth
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: {{ include "agentos.name" . }}-gateway}
  frontend:
    http: {maxBufferSize: 16Mi}
  traffic:
    jwtAuthentication:
      mode: Permissive
      preserveToken: true
      location:
        expression: >-
          request.path == '/mcp/automation' ? '' :
          ('x-substrate-actor-token' in request.headers ? request.headers['x-substrate-actor-token'].replace('Bearer ', '') : '')
      providers:
        - issuer: {{ .Values.execution.actorIssuer | quote }}
          audiences: {{ include "agentos.actorAudiences" . }}
          jwks:
            remote:
              backendRef: {name: {{ include "agentos.name" . }}-console, port: 9092}
              jwksPath: /keys/actor
          validation: {requiredClaims: [sub, exp, aud]}
    authorization:
      action: Require
      policy:
        matchExpressions:
          - >-
            {{- if .Values.automation.enabled }}
            request.path == '/mcp/automation' ||
            {{- end }}
            (has(jwt.iss) && jwt.iss == '{{ .Values.execution.actorIssuer }}' && (
              (request.path.startsWith('/v1/') && (jwt.aud == '{{ $trust.modelAudience }}' || '{{ $trust.modelAudience }}' in jwt.aud)) ||
              request.path.startsWith('/mcp/')
            )) ||
            (!('x-substrate-actor-token' in request.headers) && 'authorization' in request.headers &&
             (request.path.startsWith('/mcp/') || request.path.startsWith('/v1/')))
    extAuth:
      conditional:
        {{- if .Values.automation.enabled }}
        - condition: "request.path == '/mcp/automation'"
          policy:
            {{- include "agentos.automationAuthorization" . | nindent 12 }}
        {{- end }}
        - condition: "request.path.startsWith('/v1/')"
          policy:
            backendRef: {name: {{ include "agentos.name" . }}-console, port: 9090}
            failureMode: FailClosed
            http:
              path: "'/authorize/model'"
              body: "{'path': request.path, 'method': request.method, 'model': request.method == 'POST' ? json(request.body).model : ''}"
              allowedRequestHeaders: [x-substrate-actor-token, authorization]
              allowedResponseHeaders: [authorization]
