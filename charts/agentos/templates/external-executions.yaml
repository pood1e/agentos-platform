{{- if .Values.execution.sources }}
{{- $name := include "agentos.name" . }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: executions
  annotations:
    agentos.dev/connection-role: ingress
    agentos.dev/system-connection: 'true'
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  mcp:
    prefixMode: Never
    targets:
      - name: executions
        static:
          host: {{ include "agentos.dataplaneService" . }}
          port: 8080
          path: /mcp
          policies: {http: {requestTimeout: 10m}}
          protocol: StreamableHTTP
  policies:
    extAuth:
      {{- include "agentos.executionAuthorization" . | nindent 6 }}
    mcp:
      authorization:
        action: Require
        policy:
          matchExpressions: ["mcp.tool.name in ['run_execution', 'get_execution', 'cancel_execution']"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: executions
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: [{name: {{ $name }}-gateway, sectionName: http}]
  rules:
    - matches: [{path: {type: Exact, value: /mcp/executions}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: executions}]
{{- end }}
