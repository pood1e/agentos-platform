{{- $name := printf "%s-mcp" (include "agentos.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := randAlphaNum 64 -}}
{{- if $existing -}}
{{- $token = required "Existing MCP secret has no token" (index $existing.data "token" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
  authorization: {{ printf "Bearer %s" $token | b64enc | quote }}
