apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentos.name" . }}-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {agentos.dev/gateway: business}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentos}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [api, dataplane]}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [atenet-egress, atenet-router]}
        - podSelector:
            matchLabels: {ate.dev/worker-pool: kagent-default}
        {{- if .Values.voice.enabled }}
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: voice}
        {{- end }}
      ports: [{port: 8080, protocol: TCP}]
    {{- if .Values.execution.sources }}
    - from: {{ toYaml .Values.route.from | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
    {{- end }}
