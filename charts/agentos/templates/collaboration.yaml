apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: kagent-collaboration
  annotations:
    agentos.dev/system-connection: 'true'
  labels: {{ include "agentos.labels" . | nindent 4 }}
spec:
  description: Native kagent collaboration
  url: {{ printf "%s/mcp" (include "agentos.kagentEndpoint" .) | quote }}
  tokenPassthrough: true
  protocol: STREAMABLE_HTTP
  timeout: 10m
  discoveryAuth:
    serviceAccount:
      serviceAccountRef: {name: {{ include "agentos.name" . }}-discovery}
      audience: kagent-invocation
