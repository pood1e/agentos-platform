apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.name" . }}-mcp-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  selector:
    gateway.networking.k8s.io/gateway-name: {{ include "agentos.name" . }}-gateway
  ports:
    - {name: http, port: 8080, targetPort: 8080, protocol: TCP}
