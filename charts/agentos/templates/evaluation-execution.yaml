{{- if .Values.evaluation.enabled }}
{{- $name := include "agentos.name" . }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ $name }}-evaluation-execution
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  static: {host: {{ $name }}-console, port: 8080}
  policies:
    auth: {secretRef: {name: {{ $name }}-evaluation-backend, key: api-key}}
    http: {requestTimeout: 10m}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-evaluation-execution
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: [{name: {{ $name }}-gateway, sectionName: http}]
  rules:
    - matches:
        - path: {type: Exact, value: /agentos.evaluation.v1.EvaluationExecutionService/Execute}
        - path: {type: Exact, value: /agentos.evaluation.v1.EvaluationExecutionService/Complete}
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ $name }}-evaluation-execution}]
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}-evaluation-execution
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: {{ $name }}-evaluation-execution}]
  traffic:
    transformation:
      request:
        set:
          - {name: x-agentos-candidate, value: apiKey.candidate}
          - {name: x-agentos-workspace, value: apiKey.workspace}
{{- end }}
