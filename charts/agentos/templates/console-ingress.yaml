apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentos.name" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-login@kubernetescrd,%s-%s-auth@kubernetescrd" .Release.Namespace (include "agentos.name" .) .Release.Namespace (include "agentos.name" .) | quote }}
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts: [{{ .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentos.name" . }}-console
                port: {name: http}
