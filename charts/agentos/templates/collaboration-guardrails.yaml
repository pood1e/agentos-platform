apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "agentos.name" . }}-collaboration-guardrails
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  targetRefs:
    - {group: agentgateway.dev, kind: AgentgatewayBackend, name: kagent-collaboration}
  backend:
    mcp:
      guardrails:
        processors:
          - methods: {'*': Full}
            remote:
              backendRef: {name: {{ include "agentos.name" . }}-console, port: 9090}
              failureMode: FailClosed
              allowedRequestHeaders: [x-substrate-actor-token]
              metadata:
                workspace: apiKey.workspace
                toolName: "has(mcp.tool) ? mcp.tool.name : ''"
                service: "has(apiKey.service) ? apiKey.service : ''"
                runtimeIdentity: "'x-substrate-actor-token' in request.headers ? request.headers['x-substrate-actor-token'] : ''"
