{{- $name := printf "%s-sessions" (include "agentos.name" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  web: {{ $existing.web | default (randAlphaNum 32 | b64enc) | quote }}
  delegation: {{ $existing.delegation | default (randBytes 32 | b64enc) | quote }}
