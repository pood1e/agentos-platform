apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "agentos.name" . }}-auth
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ include "agentos.authService" . }}.{{ .Release.Namespace }}.svc:{{ index .Values "oauth2-proxy" "service" "portNumber" }}/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email]
