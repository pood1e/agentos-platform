{{- with .Values.ingress.sandbox }}
{{- if .host }}
{{- if eq .host $.Values.ingress.host }}{{ fail "ingress.sandbox.host must differ from ingress.host" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentos.name" $ }}-sandbox
  labels: {{ include "agentos.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .tlsSecret }}
      hosts: [{{ .host | quote }}]
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /mcp-app-sandbox
            pathType: Exact
            backend:
              service:
                name: {{ include "agentos.name" $ }}-console
                port: {name: http}
{{- end }}
{{- end }}
