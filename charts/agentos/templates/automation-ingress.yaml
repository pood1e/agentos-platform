{{- if .Values.automation.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentos.name" . }}-automation
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts: [{{ .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /mcp/automation
            pathType: Exact
            backend:
              service:
                name: {{ include "agentos.name" . }}-gateway
                port: {number: 8080}
{{- end }}
