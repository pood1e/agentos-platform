{{- if .Values.voice.enabled }}
# The API reviews the voice worker's token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentos.workloadAuthName" . }}
  labels: {{ include "agentos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentos.apiService" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentos.workloadAuthName" . }}
{{- end }}
