apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.name" . }}-team-sessions
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: team-sessions
  ports: [{name: http, port: 8081, targetPort: http}]
