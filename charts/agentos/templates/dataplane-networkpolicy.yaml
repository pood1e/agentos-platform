{{- $component := dict "root" . "component" "dataplane" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentos.name" . }}-dataplane
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentos.platformSelector" $component | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {agentos.dev/gateway: business}
      ports: [{port: 8080, protocol: TCP}, {port: 9090, protocol: TCP}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-egress}
      ports: [{port: 9091, protocol: TCP}]
