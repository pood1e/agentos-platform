{{- $token := include "agentos.gatewayToken" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentos.name" . }}-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $token | b64enc | quote }}
  authorization: {{ printf "Bearer %s" $token | b64enc | quote }}
  mcp-api-key: {{ include "agentos.collaborationToken" . | b64enc | quote }}
  mcp-authorization: {{ printf "Bearer %s" (include "agentos.collaborationToken" .) | b64enc | quote }}
  catalog-api-key: {{ include "agentos.catalogToken" . | b64enc | quote }}
  catalog-authorization: {{ printf "Bearer %s" (include "agentos.catalogToken" .) | b64enc | quote }}
