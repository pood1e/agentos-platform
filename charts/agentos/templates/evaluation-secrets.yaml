{{- if .Values.evaluation.enabled }}
{{- range list "evaluation-backend" "online-judge" }}
{{- $name := printf "%s-%s" (include "agentos.name" $) . }}
{{- $token := include "agentos.nativeToken" (dict "root" $ "name" $name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" $ | nindent 4 }}
type: Opaque
data:
  api-key: {{ $token | b64enc | quote }}
  authorization: {{ printf "Bearer %s" $token | b64enc | quote }}
{{- end }}
{{- end }}
