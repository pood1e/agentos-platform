apiVersion: agentos.dev/v1alpha1
kind: Preset
metadata:
  name: {{ include "agentos.name" . }}-skills
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata: {name: {{ include "agentos.name" . }}-skills}
      data:
        catalog.json: {{ dict "items" .Values.global.agentos.skills | toJson | quote }}
