apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}.{{ include "agentos.name" . }}-api-namespaces
  labels: {{ include "agentos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentos.apiService" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}.{{ include "agentos.name" . }}-api-namespaces
