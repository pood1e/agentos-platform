{{- $component := dict "root" . "component" "worker" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentos.name" . }}-worker
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentos.platformSelector" $component | nindent 6 }}
  policyTypes: [Ingress]
