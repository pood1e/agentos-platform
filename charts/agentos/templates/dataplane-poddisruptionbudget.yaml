{{- $component := dict "root" . "component" "dataplane" -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentos.name" . }}-dataplane
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "agentos.platformSelector" $component | nindent 6 }}
