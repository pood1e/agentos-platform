{{- if .Values.evaluation.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentos.name" . }}-evaluations
  namespace: {{ .Values.evaluation.namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [configmaps, secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [api.kagent.dev]
    resources: [agents, agenttemplates, harnesses, modelconfigs, remotemcpservers]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewayparameters, agentgatewaymodels, agentgatewaypolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentos.name" . }}-evaluations
  namespace: {{ .Values.evaluation.namespace }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: {{ include "agentos.name" . }}-console, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "agentos.name" . }}-evaluations}
{{- end }}
