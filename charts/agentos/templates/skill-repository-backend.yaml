{{- if .Values.global.agentos.skillRepository.host }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: {{ include "agentos.name" . }}-skill-repository
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  static:
    host: {{ .Values.global.agentos.skillRepository.host }}
    port: 443
  policies:
    tls: {}
    auth:
      credentials:
        - secretRef: {name: {{ .Values.global.agentos.skillRepository.secretRef }}}
          location: {header: {name: Authorization}}
    http:
      requestTimeout: 5m
{{- end }}
