{{- range .Values.gateway.mcps }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-{{ .name }}
  labels:
    {{- include "agentos.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - {name: {{ include "agentos.name" $ }}-gateway, sectionName: http}
  rules:
    - matches:
        - path: {type: PathPrefix, value: '/mcp/{{ .name }}'}
      backendRefs:
        - {group: agentgateway.dev, kind: AgentgatewayBackend, name: {{ .name }}}
{{- end }}
