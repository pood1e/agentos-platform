apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.name" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/name: agentos
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
      annotations:
        checksum/tools: {{ include (print $.Template.BasePath "/execution-tools.yaml") . | sha256sum }}
        {{- if .Values.evaluation.enabled }}
        checksum/evaluation: {{ include (print $.Template.BasePath "/evaluation-config.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentos.name" . }}-console
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentos.securityContext" . | nindent 8 }}
        fsGroup: 1000
      {{- with .Values.pack.image }}
      initContainers:
        - name: pack
          image: {{ . | quote }}
          command: [cp, -R, /pack/., /etc/agentos-pack/]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            {{- include "agentos.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - {name: pack, mountPath: /etc/agentos-pack}
      {{- end }}
      containers:
        - name: console
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: [node, build/server/platform/main.js]
          ports: [{name: http, containerPort: 8080}, {name: guardrails, containerPort: 9090}]
          env:
            - {name: AGENTOS_AUTH_MODE, value: {{ .Values.identity.mode | quote }}}
            {{- if eq .Values.identity.mode "oidc" }}
            - {name: AGENTOS_OIDC_ISSUER, value: {{ required "identity.issuer is required" .Values.identity.issuer | quote }}}
            - {name: AGENTOS_OIDC_CLIENT_ID, value: {{ required "identity.clientId is required" .Values.identity.clientId | quote }}}
            - {name: AGENTOS_OIDC_WRITER_ROLE, value: {{ required "identity.writerRole is required" .Values.identity.writerRole | quote }}}
            {{- end }}
            - {name: AGENTOS_ORIGIN, value: {{ printf "https://%s" .Values.ingress.host | quote }}}
            {{- if .Values.evaluation.enabled }}
            - {name: AGENTOS_EVALUATION_CONFIG, value: /etc/agentos-evaluation/configuration.json}
            - name: AGENTOS_EVALUATION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-evaluation-backend, key: api-key}
            {{- end }}
            - {name: AGENTOS_ENTRY_AGENT, value: {{ .Values.entryAgent | quote }}}
            {{- if .Values.global.agentos.environments }}
            - {name: AGENTOS_GOVERNANCE_CONFIG, value: /etc/agentos-governance/connections.json}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: AGENTOS_PACK_DIR, value: /etc/agentos-pack}
            {{- end }}
            - {name: AGENTOS_HOST, value: '0.0.0.0'}
            - {name: AGENTOS_PORT, value: '8080'}
            - {name: AGENTOS_RELEASE, value: {{ include "agentos.name" . }}}
            - {name: KAGENT_URL, value: {{ .Values.kagent.endpoint | quote }}}
            - {name: KAGENT_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: KAGENT_USER_ID, value: {{ .Values.kagent.userId | quote }}}
            - {name: AGENTOS_MCP_GATEWAY_URL, value: "http://{{ include "agentos.name" . }}-mcp-gateway.{{ .Release.Namespace }}.svc:8080"}
            - {name: AGENTOS_GATEWAY_URL, value: 'http://{{ include "agentos.name" . }}-gateway.{{ .Release.Namespace }}.svc:8080'}
            - {name: AGENTOS_GATEWAY_NAME, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_GATEWAY_SECRET, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_SKILL_CATALOG, value: {{ printf "%s-skills" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_SKILL_ORIGINS, value: 'http://{{ include "agentos.name" . }}-skill-gateway.{{ .Release.Namespace }}.svc:8080,http://{{ include "agentos.name" . }}-skill-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080'}
            - {name: AGENTOS_EMBEDDING_MODEL, value: {{ .Values.embedding.model | quote }}}
            - {name: AGENTOS_KNOWLEDGE_TTL_DAYS, value: {{ .Values.knowledgeMemory.ttlDays | quote }}}
            - name: AGENTOS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-gateway, key: api-key}
            - name: AGENTOS_MCP_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-mcp, key: token}
            - name: AGENTOS_COLLABORATION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-gateway, key: mcp-api-key}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- if .Values.evaluation.enabled }}
            - {name: evaluation, mountPath: /etc/agentos-evaluation, readOnly: true}
            {{- end }}
            - {name: tools, mountPath: /etc/agentos, readOnly: true}
            {{- if .Values.global.agentos.environments }}
            - {name: governance, mountPath: /etc/agentos-governance, readOnly: true}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: pack, mountPath: /etc/agentos-pack, readOnly: true}
            {{- end }}
        {{- if eq .Values.identity.mode "oidc" }}
        - name: identity
          image: {{ .Values.identity.proxy.image | quote }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.identity.issuer }}
            - --client-id={{ .Values.identity.clientId }}
            - --redirect-url=https://{{ .Values.ingress.host }}/auth/callback
            - --proxy-prefix=/auth
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --scope=openid profile email
            - --pass-access-token=true
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --cookie-name=__Host-agentos
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=5m
            - --cookie-refresh=1m
            - --request-logging=false
            - --api-route=^/agentos\.
          ports: [{name: identity, containerPort: 4180}]
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.secretRef }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.secretRef }}, key: cookie-secret}
          readinessProbe:
            httpGet: {path: /ready, port: identity}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /ping, port: identity}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.identity.proxy.resources | nindent 12 }}
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
        {{- end }}
      volumes:
        {{- if .Values.evaluation.enabled }}
        - name: evaluation
          configMap: {name: {{ include "agentos.name" . }}-evaluation}
        {{- end }}
        - name: tools
          configMap: {name: {{ include "agentos.name" . }}-tools}
      {{- if .Values.pack.image }}
        - name: pack
          emptyDir: {sizeLimit: 64Mi}
      {{- end }}
      {{- if .Values.global.agentos.environments }}
        - name: governance
          secret: {secretName: agentos-governance}
      {{- end }}
