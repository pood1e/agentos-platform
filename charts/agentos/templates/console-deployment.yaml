apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.name" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/name: agentos
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
spec:
  replicas: 1
  revisionHistoryLimit: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
      annotations:
        checksum/tools: {{ include (print $.Template.BasePath "/execution-tools.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ include "agentos.name" . }}-console
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentos.securityContext" . | nindent 8 }}
        fsGroup: 1000
      {{- with .Values.pack.image }}
      initContainers:
        - name: pack
          image: {{ . | quote }}
          command: [cp, -R, /pack/., /etc/agentos-pack/]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            {{- include "agentos.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - {name: pack, mountPath: /etc/agentos-pack}
      {{- end }}
      containers:
        - name: console
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: [node, build/server/platform/main.js]
          ports: [{name: http, containerPort: 8080}, {name: guardrails, containerPort: 9090}, {name: runtime, containerPort: 9091}]
          env:
            {{- include "agentos.executionEnv" . | nindent 12 }}
            - {name: AGENTOS_ENVIRONMENT_CA_DIR, value: /etc/agentos-environments}
            - {name: AGENTOS_AUTH_MODE, value: {{ .Values.identity.mode | quote }}}
            {{- if eq .Values.identity.mode "oidc" }}
            - {name: AGENTOS_OIDC_ISSUER, value: {{ required "identity.issuer is required" .Values.identity.issuer | quote }}}
            - {name: AGENTOS_OIDC_CLIENT_ID, value: {{ required "identity.clientId is required" .Values.identity.clientId | quote }}}
            - {name: AGENTOS_OIDC_AUDIENCE, value: {{ required "identity.audience is required" .Values.identity.audience | quote }}}
            - {name: AGENTOS_OIDC_WRITER_ROLE, value: {{ required "identity.writerRole is required" .Values.identity.writerRole | quote }}}
            - name: AGENTOS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.secretRef }}, key: client-secret}
            - name: AGENTOS_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.identity.secretRef }}, key: cookie-secret}
            {{- end }}
            - {name: AGENTOS_ORIGIN, value: {{ printf "https://%s" .Values.ingress.host | quote }}}
            - {name: AGENTOS_ENTRY_AGENT, value: {{ .Values.entryAgent | quote }}}
            - {name: AGENTOS_EVENT_AUTOMATION_ENABLED, value: {{ .Values.automation.enabled | quote }}}
            - {name: AGENTOS_SPEECH_SECRET, value: {{ include "agentos.name" . }}-speech}
            {{- if .Values.voice.enabled }}
            - {name: AGENTOS_VOICE_URL, value: "http://{{ include "agentos.name" . }}-voice:8080"}
            - name: AGENTOS_VOICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.voice.secretRef }}, key: api-token}}
            {{- end }}
            {{- if .Values.global.agentos.environments }}
            - {name: AGENTOS_GOVERNANCE_CONFIG, value: /etc/agentos-governance/connections.json}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: AGENTOS_PACK_DIR, value: /etc/agentos-pack}
            {{- end }}
            - {name: AGENTOS_HOST, value: '0.0.0.0'}
            - {name: AGENTOS_PORT, value: '8080'}
            - {name: AGENTOS_RELEASE, value: {{ include "agentos.name" . }}}
            - {name: KAGENT_URL, value: {{ .Values.kagent.endpoint | quote }}}
            - {name: KAGENT_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: KAGENT_USER_ID, value: {{ .Values.kagent.userId | quote }}}
            - {name: AGENTOS_HARNESS, value: {{ .Values.defaultHarness | quote }}}
            - {name: AGENTOS_MCP_GATEWAY_URL, value: "http://{{ include "agentos.name" . }}-mcp-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080"}
            - {name: AGENTOS_GATEWAY_URL, value: 'http://{{ include "agentos.name" . }}-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080'}
            - {name: AGENTOS_GATEWAY_NAME, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_GATEWAY_SECRET, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_SKILL_CATALOG, value: {{ printf "%s-skills" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_SKILL_ORIGINS, value: 'http://{{ include "agentos.name" . }}-skill-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080'}
            - {name: AGENTOS_EMBEDDING_MODEL, value: {{ .Values.embedding.model | quote }}}
            - {name: AGENTOS_KNOWLEDGE_TTL_DAYS, value: {{ .Values.knowledgeMemory.ttlDays | quote }}}
            - name: AGENTOS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-gateway, key: api-key}
            - name: AGENTOS_MCP_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-mcp, key: token}
            - name: AGENTOS_COLLABORATION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-gateway, key: mcp-api-key}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: runtime-identity, mountPath: /etc/agentos-runtime, readOnly: true}
            - {name: execution-database, mountPath: /etc/agentos-database, readOnly: true}
            - {name: tools, mountPath: /etc/agentos, readOnly: true}
            {{- if .Values.global.agentos.environments }}
            - {name: environment-ca, mountPath: /etc/agentos-environments, readOnly: true}
            - {name: governance, mountPath: /etc/agentos-governance, readOnly: true}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: pack, mountPath: /etc/agentos-pack, readOnly: true}
            {{- end }}
      volumes:
        - name: execution-database
          secret:
            secretName: {{ .Values.execution.databaseCASecret }}
            items: [{key: ca.crt, path: ca.crt}]
        - name: runtime-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ (urlParse .Values.execution.substrateURL).host | quote }}
                  expirationSeconds: 600
                  path: token
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels: {podcert.ate.dev/canarying: live}
                  path: ca.crt
        - name: tools
          configMap: {name: {{ include "agentos.name" . }}-tools}
      {{- if .Values.pack.image }}
        - name: pack
          emptyDir: {sizeLimit: 64Mi}
      {{- end }}
      {{- if .Values.global.agentos.environments }}
        - name: environment-ca
          projected:
            sources:
              {{- range .Values.global.agentos.environments }}
              - configMap:
                  name: {{ .name }}-gateway-ca
                  items: [{key: ca.crt, path: {{ printf "%s/ca.crt" .name | quote }}}]
              {{- end }}
        - name: governance
          secret: {secretName: agentos-governance}
      {{- end }}
