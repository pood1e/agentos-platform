apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.name" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/name: agentos
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: console
      annotations:
        checksum/tools: {{ include (print $.Template.BasePath "/execution-tools.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "agentos.name" . }}-console
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentos.securityContext" . | nindent 8 }}
      {{- with .Values.pack.image }}
      initContainers:
        - name: pack
          image: {{ . | quote }}
          command: [cp, -R, /pack/., /etc/agentos-pack/]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            {{- include "agentos.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - {name: pack, mountPath: /etc/agentos-pack}
      {{- end }}
      containers:
        - name: console
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: [node, build/server/console/main.js]
          ports: [{name: http, containerPort: 8080}]
          env:
            {{- if .Values.global.agentos.environments }}
            - {name: AGENTOS_OPERATIONS_CONFIG, value: /etc/agentos-operations/connections.json}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: AGENTOS_PACK_DIR, value: /etc/agentos-pack}
            {{- end }}
            - {name: AGENTOS_HOST, value: '0.0.0.0'}
            - {name: AGENTOS_PORT, value: '8080'}
            - {name: KAGENT_URL, value: {{ .Values.kagent.endpoint | quote }}}
            - {name: KAGENT_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: KAGENT_USER_ID, value: {{ .Values.kagent.userId | quote }}}
            - {name: AGENTOS_MCP_GATEWAY_URL, value: "http://{{ include "agentos.name" . }}-mcp-gateway.{{ .Release.Namespace }}.svc:8080"}
            - {name: AGENTOS_GATEWAY_URL, value: 'http://{{ include "agentos.name" . }}-gateway.{{ .Release.Namespace }}.svc:8080'}
            - {name: AGENTOS_GATEWAY_NAME, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_GATEWAY_SECRET, value: {{ printf "%s-gateway" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_SKILL_CATALOG, value: {{ printf "%s-skills" (include "agentos.name" .) | quote }}}
            - {name: AGENTOS_EMBEDDING_MODEL, value: {{ .Values.embedding.model | quote }}}
            - {name: AGENTOS_KNOWLEDGE_TTL_DAYS, value: {{ .Values.knowledgeMemory.ttlDays | quote }}}
            - name: AGENTOS_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "agentos.name" . }}-gateway, key: api-key}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tools, mountPath: /etc/agentos, readOnly: true}
            {{- if .Values.global.agentos.environments }}
            - {name: operations, mountPath: /etc/agentos-operations, readOnly: true}
            {{- end }}
            {{- if .Values.pack.image }}
            - {name: pack, mountPath: /etc/agentos-pack, readOnly: true}
            {{- end }}
      volumes:
        - name: tools
          configMap: {name: {{ include "agentos.name" . }}-tools}
      {{- if .Values.pack.image }}
        - name: pack
          emptyDir: {sizeLimit: 64Mi}
      {{- end }}
      {{- if .Values.global.agentos.environments }}
        - name: operations
          secret: {secretName: agentos-operations}
      {{- end }}
