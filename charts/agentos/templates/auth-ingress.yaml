apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentos.name" . }}-oauth
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts: [{{ .Values.ingress.host | quote }}]
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentos.authService" . }}
                port: {number: {{ index .Values "oauth2-proxy" "service" "portNumber" }}}
