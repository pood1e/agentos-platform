apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentos.name" . }}-tools
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
data:
  toolsets.yaml: |
    {{- toYaml .Values.global.agentos.toolsets | nindent 4 }}
  platform-tools.yaml: |
    {{- .Files.Get "presets/platform-tools.yaml" | nindent 4 }}
  workloads.json: |
    {{- include "agentos.workloadAuth" . | nindent 4 }}
