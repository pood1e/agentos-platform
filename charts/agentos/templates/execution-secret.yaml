{{- $name := printf "%s-execution" (include "agentos.name" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := randBytes 32 -}}
{{- if $existing -}}
{{- $key = required "Existing execution secret has no key" (index $existing.data "key" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | b64enc | quote }}
