apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentos.name" . }}-console
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentos.name" . }}-console
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentos.name" . }}-console
