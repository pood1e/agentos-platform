{{- if .Values.automation.enabled }}
{{- $name := include "agentos.name" . }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: automation
  annotations:
    agentos.dev/connection-role: ingress
    agentos.dev/system-connection: 'true'
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  mcp:
    prefixMode: Never
    targets:
      - name: automation
        static:
          host: {{ $name }}-console
          port: 8080
          path: /mcp
          policies: {http: {requestTimeout: 10m}}
          protocol: StreamableHTTP
  policies:
    extAuth:
      {{- include "agentos.automationAuthorization" . | nindent 6 }}
    mcp:
      authorization:
        action: Require
        policy:
          matchExpressions: ["mcp.tool.name in ['run_case', 'observe_case', 'cancel_case', 'list_scheduled_run_executions', 'get_scheduled_run_execution_result', 'dispatch_scheduled_run_execution']"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: automation
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: [{name: {{ $name }}-gateway, sectionName: http}]
  rules:
    - matches: [{path: {type: Exact, value: /mcp/automation}}]
      backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: automation}]
{{- end }}
