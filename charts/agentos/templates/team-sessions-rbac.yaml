{{- $name := include "agentos.name" . }}
{{- range $component := list "team-sessions" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "agentos.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "agentos.labels" $ | nindent 4 }}
rules:
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaybackends]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "agentos.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-{{ $component }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-{{ $component }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
