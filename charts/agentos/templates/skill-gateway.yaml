{{- if .Values.global.agentos.skillRepository.host }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "agentos.name" . }}-skill-gateway
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef: {group: agentgateway.dev, kind: AgentgatewayParameters, name: {{ include "agentos.name" . }}-gateway}
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
{{- end }}
