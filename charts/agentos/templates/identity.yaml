{{- if eq .Values.identity.mode "password" }}
{{- $name := include "agentos.name" . -}}
{{- $origins := include "agentos.origins" . | fromJson -}}
{{- $identity := include "agentos.identity" . | fromJson -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-identity
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  # Sign-in rate limits are kept in process memory.
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: identity
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "agentos.securityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: identity
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          command: [node, --import, ./build/server/apps/telemetry.js, build/server/apps/identity.js]
          env:
            {{- include "agentos.telemetryEnv" (dict "root" . "component" "identity") | nindent 12 }}
            - {name: AGENTOS_HOST, value: 0.0.0.0}
            - {name: AGENTOS_PORT, value: '8080'}
            - {name: AGENTOS_IDENTITY_ISSUER, value: {{ $identity.issuer | quote }}}
            - {name: AGENTOS_IDENTITY_AUDIENCE, value: {{ $identity.audience | quote }}}
            - {name: AGENTOS_IDENTITY_WRITER_ROLE, value: {{ $identity.writerRole | quote }}}
            - {name: AGENTOS_IDENTITY_CLIENT_ID, value: {{ $identity.clientId | quote }}}
            - name: AGENTOS_IDENTITY_REDIRECT_URIS
              value: {{ list (printf "%s/oauth2/callback" $origins.console) (printf "%s/delegation/callback" $origins.api) | toJson | quote }}
            - name: AGENTOS_IDENTITY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $identity.secret }}, key: client-secret}}
            - name: AGENTOS_IDENTITY_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ $identity.secret }}, key: signing-key}}
            - name: AGENTOS_IDENTITY_COOKIE_KEY
              valueFrom: {secretKeyRef: {name: {{ $identity.secret }}, key: cookie-key}}
            - name: AGENTOS_IDENTITY_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.identity.secretRef }}, key: password}}
            - name: AGENTOS_IDENTITY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.execution.databaseSecret }}, key: connectionString}}
            - {name: AGENTOS_IDENTITY_DATABASE_CA, value: /etc/agentos-database/ca.crt}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            {{- include "agentos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: execution-database, mountPath: /etc/agentos-database, readOnly: true}
      volumes:
        - name: execution-database
          secret:
            secretName: {{ .Values.execution.databaseCASecret }}
            items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-identity
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: identity
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-identity
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: identity}
  policyTypes: [Ingress]
  ingress:
    - from: {{ toYaml .Values.route.from | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
{{- end }}
