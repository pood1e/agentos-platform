apiVersion: agentos.dev/v1alpha1
kind: Preset
metadata:
  name: {{ include "agentos.name" . }}-mcps
spec:
  resources:
    {{- range .Values.gateway.mcps }}
    - apiVersion: agentgateway.dev/v1alpha1
      kind: AgentgatewayBackend
      metadata:
        name: {{ .name }}
        annotations:
          agentos.dev/system-connection: 'true'
          kagent.dev/connection: 'true'
          agentos.dev/description: {{ .description | default .name | quote }}
        labels:
          {{- include "agentos.labels" $ | nindent 10 }}
      spec:
        {{- $spec := tpl (toYaml .spec) $ | fromYaml }}
        {{- $_ := unset ($spec.policies | default dict | dig "mcp" dict) "authorization" }}
        {{- $native := dict "transformation" (dict "request" (dict "remove" (list "x-substrate-actor-token" "cookie" "x-forwarded-access-token"))) }}
        {{- $_ := set $spec "policies" (mergeOverwrite (deepCopy ($spec.policies | default dict)) $native) }}
        {{- toYaml $spec | nindent 8 }}
    {{- end }}
