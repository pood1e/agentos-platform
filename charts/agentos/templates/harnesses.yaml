apiVersion: agentos.dev/v1alpha1
kind: Preset
metadata:
  name: {{ include "agentos.name" . }}-harnesses
spec:
  resources:
    {{- range $name, $spec := .Values.harnesses }}
    {{- $spec := deepCopy $spec }}
    {{- if and (eq $name "memory") (dig "kagent" "memory" false $spec) }}
    {{- $_ := set $spec.kagent.memory "teamNamespace" $.Release.Namespace }}
    {{- end }}
    - apiVersion: api.kagent.dev/v1alpha3
      kind: Harness
      metadata: {name: {{ $name }}}
      spec: {{ tpl (toYaml $spec) $ | nindent 8 }}
    {{- end }}
