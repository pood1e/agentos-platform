apiVersion: agentos.dev/v1alpha1
kind: Preset
metadata:
  name: {{ include "agentos.name" . }}-harnesses
spec:
  resources:
    {{- range $name, $spec := .Values.harnesses }}
    - apiVersion: api.kagent.dev/v1alpha3
      kind: Harness
      metadata: {name: {{ $name }}}
      spec: {{ toYaml $spec | nindent 8 }}
    {{- end }}
