apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentos.name" . }}-team-sessions
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agentos, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: team-sessions}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {agentos.dev/gateway: business}
      ports: [{port: 8081, protocol: TCP}]
