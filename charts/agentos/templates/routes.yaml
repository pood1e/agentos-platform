{{- $name := include "agentos.name" . -}}
{{- $hosts := .Values.route.hosts -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-web
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: {{ toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames: [{{ $hosts.console | quote }}]
  rules:
    - backendRefs: [{name: {{ $name }}-web, port: 4180}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: {{ toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames: [{{ $hosts.api | quote }}]
  rules:
    - backendRefs: [{name: {{ include "agentos.apiService" . }}, port: 8080}]
    {{- if .Values.execution.sources }}
    - matches: [{path: {type: Exact, value: /mcp/executions}}]
      backendRefs: [{name: {{ $name }}-gateway, port: 8080}]
    {{- end }}
{{- if $hosts.sandbox }}
{{- if has $hosts.sandbox (list $hosts.console $hosts.api) }}{{ fail "route.hosts.sandbox must be a separate host" }}{{ end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-sandbox
  labels:
    {{- include "agentos.labels" . | nindent 4 }}
spec:
  parentRefs: {{ toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames: [{{ $hosts.sandbox | quote }}]
  rules:
    - matches: [{path: {type: Exact, value: /mcp-app-sandbox}}]
      backendRefs: [{name: {{ $name }}-web, port: 8081}]
{{- end }}
