version: v2
clean: true
plugins:
  - protoc_builtin: python
    protoc_path: .cache/bin/protoc
    strategy: all
    out: gen/python
    include_imports: true
    types:
      - agentos.automation.v1.CaseRequest
      - agentos.automation.v1.CaseReference
      - agentos.automation.v1.AutomationConfig
      - agentos.automation.v1.CaseSignal
      - agentos.automation.v1.CaseWorkflowInput
      - agentos.automation.v1.CaseFeedback
      - agentos.automation.v1.CaseFact
      - agentos.kagent.v1.InvokeSessionOutput
      - agentos.voice.v1.StartSessionRequest
      - agentos.voice.v1.EndSessionRequest
      - agentos.voice.v1.VoiceEvent
      - agentos.voice.v1.VoiceReply
      - agentos.console.v1.VoiceCallConnection
      - ateapi.Control
