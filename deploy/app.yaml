- name: Install application release
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.cache/deploy-venv/bin/python"
    chart_user: "{{ lookup('env', 'AGENTOS_CHART_USER') }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Prepare image pull credentials
      ansible.builtin.include_tasks: registry.yaml

    - name: Configure skill repository credentials
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentos-skill-repository, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData: "{{ lookup('file', skill_repository_credential_file) | from_json }}"
      when: skill_repository_credential_file | length > 0
      no_log: true

    - name: Discover application credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ agentos_namespace }}"
      loop: [model-credentials]
      register: application_credentials
      no_log: true

    - name: Require application credentials
      ansible.builtin.assert:
        that: item.resources | length > 0 or ansible_check_mode
      loop: "{{ application_credentials.results }}"
      no_log: true

    - name: Authenticate application chart registry
      ansible.builtin.command:
        argv:
          - "{{ helm_binary }}"
          - registry
          - login
          - "{{ (app_chart_repository | ansible.builtin.urlsplit).netloc }}"
          - --username
          - "{{ chart_user }}"
          - --password-stdin
        stdin: "{{ lookup('env', 'AGENTOS_CHART_TOKEN') }}"
      when: chart_user | length > 0
      changed_when: false
      no_log: true

    - name: Discover native workload signing keys
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ playbook_dir }}/runtime/discover-trust.py"
          - --kubeconfig
          - "{{ kubeconfig_path }}"
      register: workload_discovery
      changed_when: false
      check_mode: false

    - name: Write application Helm values
      ansible.builtin.copy:
        content: >-
          {{ (app_values | combine({'execution': workload_discovery.stdout | from_json}, recursive=true)
              if app_chart == 'agentos' else
              app_values | combine({'agentos': {'execution': workload_discovery.stdout | from_json}}, recursive=true)) | to_nice_json }}
        dest: "{{ playbook_dir }}/../.cache/application-values.json"
        mode: "0600"
      no_log: true

    - name: Deploy application chart
      kubernetes.core.helm:
        name: "{{ app_release_name }}"
        binary_path: "{{ helm_binary }}"
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: "{{ app_chart_repository }}/{{ app_chart }}"
        chart_version: "{{ app_chart_version }}"
        release_namespace: "{{ agentos_namespace }}"
        reset_values: true
        take_ownership: true
        history_max: 3
        wait: true
        timeout: 20m
        values_files: ["{{ playbook_dir }}/../.cache/application-values.json"]
      environment:
        HELM_DIFF_USE_UPGRADE_DRY_RUN: "true"

    - name: Publish the current collaboration tool catalog
      ansible.builtin.include_tasks: mcp-discovery.yaml
      when: not ansible_check_mode

    - name: Retire console OIDC credentials
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ agentos_namespace }}"
        state: absent
      loop: "{{ ['agentos-oidc', app_release_name ~ '-oidc'] | unique }}"
      no_log: true
      diff: false
