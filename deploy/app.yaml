- name: Install application release
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    site_identity: "{{ (app_values | default({})).get('agentos', app_values | default({})).get('identity', {}) }}"
    site_password_secret: "{{ site_identity.get('secretRef', 'agentos-identity') }}"
    site_application_name: "{{ app_release_name[:44] | regex_replace('-$', '') }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Prepare image pull credentials
      ansible.builtin.include_tasks: registry.yaml

    - name: Configure skill repository credentials
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentos-skill-repository, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData: "{{ lookup('file', skill_repository_credential_file) | from_json }}"
      when: skill_repository_credential_file | length > 0
      no_log: true

    - name: Discover application credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ agentos_namespace }}"
      loop: [model-credentials, "{{ app_values.get('agentos', app_values).get('execution', {}).get('keySecret', 'agentos-execution') }}"]
      register: application_credentials
      no_log: true

    - name: Require application credentials
      ansible.builtin.assert:
        that: item.resources | length > 0 or ansible_check_mode
      loop: "{{ application_credentials.results }}"
      no_log: true

    - name: Provision site authentication credentials
      ansible.builtin.include_tasks: tasks/site-credentials.yaml

    - name: Write application Helm values
      ansible.builtin.copy:
        content: >-
          {{ app_values | to_nice_json }}
        dest: "{{ agentos_cache }}/application-values.json"
        mode: "0600"
      no_log: true

    - name: Deploy verified application chart
      ansible.builtin.include_tasks: tasks/install-chart.yaml
      vars:
        delivery_chart: "{{ app_chart_repository }}/{{ app_chart }}"
        delivery_release: "{{ app_release_name }}"
        delivery_namespace: "{{ agentos_namespace }}"
        delivery_values_file: "{{ agentos_cache }}/application-values.json"
        delivery_chart_version: "{{ app_chart_version }}"
        delivery_chart_revision: "{{ app_chart_revision }}"
        delivery_chart_public_key: "{{ app_chart_public_key }}"
        delivery_kubeconfig: "{{ kubeconfig_path }}"
        delivery_timeout: 20m

    - name: Publish the current collaboration tool catalog
      ansible.builtin.include_tasks: mcp-discovery.yaml
      when: not ansible_check_mode
