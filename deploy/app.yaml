- name: Install application release
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.cache/deploy-venv/bin/python"
    app_package: "{{ playbook_dir }}/../.cache/{{ app_chart }}-{{ app_chart_version }}.tgz"
    chart_user: "{{ lookup('env', 'AGENTOS_CHART_USER') }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Prepare image pull credentials
      ansible.builtin.include_tasks: registry.yaml

    - name: Configure OIDC credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentos-oidc, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData: "{{ lookup('file', oidc_secret_file) | from_json }}"
      when: oidc_secret_file | length > 0
      no_log: true

    - name: Configure skill repository credentials
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentos-skill-repository, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData: "{{ lookup('file', skill_repository_credential_file) | from_json }}"
      when: skill_repository_credential_file | length > 0
      no_log: true

    - name: Discover application credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ agentos_namespace }}"
      loop: [agentos-oidc, model-credentials]
      register: application_credentials
      no_log: true

    - name: Require application credentials
      ansible.builtin.assert:
        that: item.resources | length > 0 or ansible_check_mode
      loop: "{{ application_credentials.results }}"
      no_log: true

    - name: Fetch published application chart
      ansible.builtin.get_url:
        url: "{{ app_chart_repository }}/charts/{{ app_chart }}-{{ app_chart_version }}.tgz"
        dest: "{{ app_package }}"
        url_username: "{{ chart_user or omit }}"
        url_password: "{{ lookup('env', 'AGENTOS_CHART_TOKEN') or omit }}"
        force_basic_auth: "{{ chart_user | length > 0 }}"
        mode: "0600"
      no_log: true

    - name: Deploy application chart
      kubernetes.core.helm:
        name: agentos
        binary_path: "{{ helm_binary }}"
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: "{{ app_package }}"
        release_namespace: "{{ agentos_namespace }}"
        reset_values: true
        take_ownership: true
        history_max: 3
        wait: true
        timeout: 20m
        release_values: "{{ app_values }}"
      environment:
        HELM_DIFF_USE_UPGRADE_DRY_RUN: "true"
