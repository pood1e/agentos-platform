- name: Configure model connection
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Configure model credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: model-credentials, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          data:
            api-key: "{{ lookup('file', model_key_file) | trim | b64encode }}"
      when: model_key_file | length > 0
      no_log: true

    - name: Discover model credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: model-credentials
        namespace: "{{ agentos_namespace }}"
      register: model_secret
      no_log: true

    - name: Require model credentials
      ansible.builtin.assert:
        that: model_secret.resources | length > 0 or ansible_check_mode
        fail_msg: Configure model_key_file with the inference API key.
      no_log: true
