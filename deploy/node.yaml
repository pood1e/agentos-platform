- name: Install K3s and administration tools
  hosts: agentos
  become: true
  vars_files: [vars.yaml]
  tasks:
    - name: Install host dependencies
      ansible.builtin.apt:
        name: [ca-certificates, curl, openssl, jq, qemu-guest-agent, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable QEMU guest agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure independent K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          node-name: {{ inventory_hostname }}
          node-ip: {{ ansible_host }}
          tls-san: [{{ ansible_host }}]
          write-kubeconfig-mode: "0600"
          kube-apiserver-arg:
            - runtime-config=certificates.k8s.io/v1beta1=true
          secrets-encryption: true
      notify: Restart K3s

    - name: Download pinned K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
        dest: /usr/local/bin/k3s
        checksum: "{{ k3s_checksum }}"
        mode: "0755"
        timeout: 300
      notify: Restart K3s

    - name: Download pinned K3s service installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
        dest: /usr/local/lib/k3s-install.sh
        checksum: "{{ k3s_install_checksum }}"
        mode: "0755"

    - name: Install K3s service
      ansible.builtin.command:
        argv: [/usr/local/lib/k3s-install.sh, server]
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Apply K3s configuration
      ansible.builtin.meta: flush_handlers

    - name: Ensure K3s is running
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        port: 6443
        timeout: 180

    - name: Wait for Kubernetes node readiness
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, "node/{{ inventory_hostname }}", --timeout=300s]
      changed_when: false

    - name: Enable Gateway API routing in the bundled Traefik
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              providers:
                kubernetesGateway:
                  enabled: true
              gateway:
                enabled: false

    - name: Download Agent Substrate CLI
      ansible.builtin.get_url:
        url: "https://github.com/kagent-dev/substrate/releases/download/v{{ substrate_version }}/kubectl-ate-linux-amd64"
        dest: /usr/local/bin/kubectl-ate
        checksum: "{{ kubectl_ate_checksum }}"
        mode: "0755"
        timeout: 300

    - name: Download kagent CLI
      ansible.builtin.get_url:
        url: "https://github.com/kagent-dev/kagent/releases/download/v{{ kagent_version }}/kagent-linux-amd64"
        dest: /usr/local/bin/kagent
        checksum: "{{ kagent_cli_checksum }}"
        mode: "0755"
        timeout: 300

    - name: Read cluster credentials
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: cluster_credentials
      no_log: true

    - name: Save remote cluster credentials
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        content: >-
          {{ cluster_credentials.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' + agentos_address + ':6443') }}
        mode: "0600"
      become: false
      delegate_to: localhost
      no_log: true

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true
