- name: Configure DNS and automatically renewed TLS
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.cache/deploy-venv/bin/python"
    cloudflare_token: >-
      {{ lookup('env', 'CLOUDFLARE_API_TOKEN')
         | default(lookup('file', cloudflare_token_file) if cloudflare_token_file | length > 0 else '', true)
         | trim }}
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Require scoped Cloudflare credentials
      ansible.builtin.assert:
        that: cloudflare_token | length > 20
        fail_msg: Configure CLOUDFLARE_API_TOKEN or cloudflare_token_file.
      no_log: true

    - name: Converge application DNS record
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - "{{ playbook_dir }}/dns_record.py"
          - --zone
          - "{{ dns_zone }}"
          - --name
          - "{{ agentos_domain }}"
          - --address
          - "{{ agentos_address }}"
      environment:
        CLOUDFLARE_API_TOKEN: "{{ cloudflare_token }}"
      register: dns_record
      changed_when: (dns_record.stdout | from_json).changed
      no_log: true
      when: not ansible_check_mode

    - name: Install cert-manager
      kubernetes.core.helm:
        name: cert-manager
        binary_path: "{{ helm_binary }}"
        kubeconfig: "{{ kubeconfig_path }}"
        chart_ref: oci://quay.io/jetstack/charts/cert-manager
        chart_version: "{{ cert_manager_version }}"
        release_namespace: cert-manager
        create_namespace: true
        reset_values: true
        wait: true
        timeout: 10m
        release_values:
          crds:
            enabled: true
          extraArgs:
            - --dns01-recursive-nameservers-only
            - "--dns01-recursive-nameservers={{ agentos_address }}:53"

    - name: Ensure application namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata: { name: "{{ agentos_namespace }}" }

    - name: Configure DNS challenge credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: cloudflare-dns, namespace: "{{ agentos_namespace }}" }
          type: Opaque
          data:
            api-token: "{{ cloudflare_token | b64encode }}"
      no_log: true

    - name: Configure ACME issuer
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Issuer
          metadata: { name: letsencrypt, namespace: "{{ agentos_namespace }}" }
          spec:
            acme:
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef: { name: letsencrypt-account }
              solvers:
                - dns01:
                    cloudflare:
                      apiTokenSecretRef: { name: cloudflare-dns, key: api-token }

    - name: Request application certificate
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: { name: agentos-ingress, namespace: "{{ agentos_namespace }}" }
          spec:
            secretName: agentos-ingress
            issuerRef: { name: letsencrypt, kind: Issuer }
            dnsNames: ["{{ agentos_domain }}"]

    - name: Wait for certificate readiness
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: cert-manager.io/v1
        kind: Certificate
        namespace: "{{ agentos_namespace }}"
        name: agentos-ingress
        wait: true
        wait_condition: { type: Ready, status: "True" }
        wait_timeout: 600
