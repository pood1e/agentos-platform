- name: Prepare Helm client
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  tasks:
    - name: Create Helm cache
      ansible.builtin.file:
        path: "{{ agentos_cache }}/helm"
        state: directory
        mode: "0755"

    - name: Download Helm 4
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "{{ agentos_cache }}/helm.tar.gz"
        checksum: "{{ helm_checksum }}"
        mode: "0644"

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "{{ agentos_cache }}/helm.tar.gz"
        dest: "{{ agentos_cache }}/helm"

    - name: Read the native Helm plugin directory
      ansible.builtin.command:
        argv: ["{{ helm_binary }}", env, HELM_PLUGINS]
      register: helm_plugin_directory
      changed_when: false
      check_mode: false

    - name: Create the Helm plugin directory
      ansible.builtin.file:
        path: "{{ helm_plugin_directory.stdout }}"
        state: directory
        mode: "0755"

    - name: Register the bundled Kustomize post-renderer
      ansible.builtin.file:
        src: "{{ playbook_dir }}/helm-plugins/agentos-kustomize"
        dest: "{{ helm_plugin_directory.stdout }}/agentos-kustomize"
        state: link

    - name: Download the pinned Helm diff plugin
      ansible.builtin.get_url:
        url: >-
          {{ 'https://github.com/databus23/helm-diff/releases/download/' ~ helm_diff_version
             ~ '/diff-' ~ (helm_diff_version | regex_replace('^v', '')) ~ '-linux-amd64.tgz' }}
        dest: "{{ agentos_cache }}/helm-diff.tgz"
        checksum: "{{ helm_diff_checksum }}"
        mode: "0644"

    - name: Install the verified Helm diff plugin
      ansible.builtin.unarchive:
        src: "{{ agentos_cache }}/helm-diff.tgz"
        dest: "{{ helm_plugin_directory.stdout }}"
