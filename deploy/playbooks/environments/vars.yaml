# ci/package-collection.py sets the platform release, registry and public key of the source revision.
agentos_cache: "{{ lookup('env', 'XDG_CACHE_HOME') | default(lookup('env', 'HOME') ~ '/.cache', true) }}/agentos"
delivery_version: ""
delivery_revision: ""
agentos_image_registry: ""
delivery_public_key: "{{ playbook_dir }}/../deploy/files/cosign.pub"
# Defaults and values derived from the solution's chart values. Site inventories and variables are passed at
# deployment time; see docs/environments.md.
agentos_namespace: agentos
platform_release: agentos
platform_gateway: "{{ platform_release }}-gateway"
platform_kubeconfig: "{{ agentos_cache }}/kubeconfig.yaml"
helm_binary: "{{ agentos_cache }}/helm/linux-amd64/helm"
chart_cache: "{{ agentos_cache }}/environments/charts"
environment_cache: "{{ agentos_cache }}/environments/{{ environment_name }}"
kubeconfig: "{{ environment_kubeconfig | default(environment_cache ~ '/kubeconfig.yaml') }}"
gateway_namespace: mcp
gateway_node_port: 31000
gateway_address: "{{ ansible_host }}"
gateway_port: "{{ gateway_node_port }}"
environment_issuer: ""
environment_discovery_auth: {}
gateway_server_name: "{{ environment_name }}-mcp.{{ environment_domain }}"
gateway_resource: "https://{{ gateway_server_name }}:{{ gateway_node_port }}/mcp"
cert_manager_version: v1.21.2
native_controller_service_account: kagent-controller
environment_apis: []
registry_config_file: ""
solution_values: "{{ lookup('ansible.builtin.file', agentos_values_file) | from_yaml }}"
agentos_config: "{{ solution_values.global.agentos }}"
platform_identity: "{{ solution_values.get('agentos', solution_values).get('identity', {}) }}"
toolsets: >-
  {{ agentos_config.toolsets | dict2items
     | selectattr('key', 'in', environment_connectors.keys() | list) | items2dict }}
toolset_revision: "{{ (toolsets | to_json | hash('sha256'))[:16] }}"
environment_governance: "{{ (agentos_config.environments | selectattr('name', 'equalto', environment_name) | first).governance }}"
engineer_identities: >-
  {{ [] if environment_state == 'absent' else
     (agentos_config.identities | rejectattr('environments', 'defined') | list)
     + (agentos_config.identities | selectattr('environments', 'defined')
        | selectattr('environments', 'contains', environment_name) | list) }}
environment_state: present
environment_release: agentos-environment
connections_release: "{{ platform_release }}-connections"
environment_chart_repository: "oci://{{ agentos_image_registry }}/charts"
environment_chart_version: "{{ delivery_version }}"
agentgateway_managed: true
agentgateway_version: v1.7.0
gateway_charts:
  - name: agentgateway
    checksum: 00c63256acd5c4305b2e7eab1da56c3e3a35a74a8f04e34aca58641dfdbc6037
  - name: agentgateway-crds
    checksum: abf0327cd44f89bc263d86f155db4094166cb2e6b920805bcf879d426ecd6d91
