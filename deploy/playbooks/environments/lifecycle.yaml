---
- name: Prepare managed environment identity changes
  hosts: environments
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Read the previous environment release
      kubernetes.core.helm_info:
        kubeconfig: "{{ kubeconfig }}"
        binary_path: "{{ helm_binary }}"
        name: "{{ environment_release }}"
        release_namespace: "{{ gateway_namespace }}"
      register: previous_environment_release
      no_log: true

    - name: Publish previous identity scope
      ansible.builtin.set_fact:
        previous_environment_values: "{{ previous_environment_release.status.release_values | default({}) }}"
        retired_engineer_identities: >-
          {{ ((previous_environment_release.status.release_values.identities | default([])) + agentos_config.identities)
             | unique(attribute='name') | rejectattr('name', 'in', engineer_identities | map(attribute='name') | list) | list }}
      no_log: true
