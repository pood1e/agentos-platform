---
- name: Install environment certificate management
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    binary_path: "{{ helm_binary }}"
    name: cert-manager
    chart_ref: oci://quay.io/jetstack/charts/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    reset_values: true
    release_values: { crds: { enabled: true } }
    wait: true
    timeout: 10m

- name: Install environment agentgateway CRDs
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    binary_path: "{{ helm_binary }}"
    name: agentgateway-crds
    chart_ref: "{{ chart_cache }}/agentgateway-crds-{{ agentgateway_version }}.tgz"
    release_namespace: agentgateway-system
    create_namespace: true
    reset_values: true
    wait: true
    timeout: 10m

- name: Install environment agentgateway controller
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    binary_path: "{{ helm_binary }}"
    name: agentgateway
    chart_ref: "{{ chart_cache }}/agentgateway-{{ agentgateway_version }}.tgz"
    release_namespace: agentgateway-system
    reset_values: true
    release_values:
      controller:
        image:
          tag: v1.7.0@sha256:87c1363bf0cbc7fdb375866e592294114c8763097d2d0c9fc45fcb1fe00a4ab8
      rbac:
        gatewayNamespaces: ["{{ gateway_namespace }}"]
      discoveryNamespaceSelectors:
        - matchLabels: { kubernetes.io/metadata.name: "{{ gateway_namespace }}" }
        - matchLabels: { kubernetes.io/metadata.name: agentgateway-system }
      istio: { enabled: false }
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
    wait: true
    timeout: 10m

- name: Install environment resources
  ansible.builtin.import_tasks: install-chart.yaml
