---
- name: Publish managed environment connection releases
  hosts: environments
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    connected_environments: >-
      {{ groups['environments'] | map('extract', hostvars) | selectattr('environment_connection', 'defined')
         | selectattr('environment_connection') | map(attribute='environment_connection') | list }}
  tasks:
    - name: Use the controller Python environment
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Require the complete inventory for the shared connection release
      ansible.builtin.assert:
        that: ansible_play_hosts_all | sort == groups['environments'] | sort
        fail_msg: The shared connection release requires the complete environments inventory.
        quiet: true

    - name: Require the versioned environment charts
      ansible.builtin.assert:
        that:
          - environment_chart_repository | length > 0
          - environment_chart_version | length > 0
        quiet: true

    - name: Read the environment gateway certificate authority
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ gateway_namespace }}"
        name: mcp-gateway-tls
      register: gateway_certificate
      when: environment_state == 'present'
      no_log: true

    - name: Discover the environment identity provider
      ansible.builtin.import_tasks: tasks/discover-oidc.yaml
      vars:
        oidc_issuer: "{{ environment_issuer }}"
      when: environment_state == 'present'

    - name: Require native catalog discovery credentials
      ansible.builtin.assert:
        that:
          - environment_discovery_auth.get('oauth2', {}).get('clientId', '') == 'agentos-catalog'
          - environment_discovery_auth.get('oauth2', {}).get('clientSecretRef', {}).get('name', '') | length > 0
          - environment_discovery_auth.get('oauth2', {}).get('clientSecretRef', {}).get('key', '') | length > 0
          - "'serviceAccount' not in environment_discovery_auth"
        quiet: true
      when: environment_state == 'present'

    - name: Record environment connection inputs
      ansible.builtin.set_fact:
        environment_connection: "{{ lookup('ansible.builtin.template', 'templates/connection-values.json.j2') | from_json }}"
      when: environment_state == 'present'
      no_log: true

    - name: Clear retired environment connection inputs
      ansible.builtin.set_fact:
        environment_connection:
      when: environment_state == 'absent'

    - name: Create the connection chart cache
      ansible.builtin.file:
        path: "{{ chart_cache }}"
        state: directory
        mode: "0700"
      when: inventory_hostname == groups['environments'][-1]

    - name: Discover native runtime trust
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/discover-runtime.py"
          - --kubeconfig
          - "{{ platform_kubeconfig }}"
      register: runtime_discovery
      changed_when: false
      check_mode: false
      when: inventory_hostname == groups['environments'][-1]

    - name: Require platform identity authorization
      ansible.builtin.assert:
        that:
          - platform_identity.get('audience', '') | length > 0
          - platform_identity.get('writerRole', '') | length > 0
        quiet: true
      when:
        - inventory_hostname == groups['environments'][-1]
        - connected_environments | length > 0

    - name: Discover the platform identity provider
      ansible.builtin.import_tasks: tasks/discover-oidc.yaml
      vars:
        oidc_issuer: "{{ platform_identity.get('issuer', '') }}"
      when:
        - inventory_hostname == groups['environments'][-1]
        - connected_environments | length > 0

    - name: Write the platform connection release values
      ansible.builtin.template:
        src: templates/connection-release.json.j2
        dest: "{{ chart_cache }}/connections-values.json"
        mode: "0600"
      vars:
        native: "{{ runtime_discovery.stdout | from_json }}"
      when: inventory_hostname == groups['environments'][-1]
      no_log: true

    - name: Install verified platform connection release
      ansible.builtin.include_tasks: ../deploy/tasks/install-chart.yaml
      vars:
        delivery_chart: "{{ environment_chart_repository }}/agentos-connections"
        delivery_release: "{{ connections_release }}"
        delivery_namespace: "{{ agentos_namespace }}"
        delivery_values_file: "{{ chart_cache }}/connections-values.json"
        delivery_kubeconfig: "{{ platform_kubeconfig }}"
      when: inventory_hostname == groups['environments'][-1]
