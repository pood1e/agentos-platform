apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kagent-controller
  labels:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/component: controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/instance: kagent
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/instance: kagent
              app.kubernetes.io/component: controller
        - podSelector:
            matchLabels: {agentos.dev/gateway: business}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentos}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, dataplane]
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ate-system}
          podSelector:
            matchLabels: {app: atenet-egress}
      ports: [{port: http, protocol: TCP}]
