apiVersion: api.kagent.dev/v1alpha3
kind: SandboxTemplate
metadata:
  name: runtime-check
  namespace: "{{ agentos_namespace }}"
spec:
  workload:
    image: "{{ runtime_check_image }}"
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
