apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-microvm-assets
  namespace: ate-system
spec:
  podSelector:
    matchLabels: {app: rustfs}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: agentos-microvm-assets}
      ports: [{port: 9000, protocol: TCP}]
