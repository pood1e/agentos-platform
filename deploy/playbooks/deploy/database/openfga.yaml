- name: Converge the OpenFGA database
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Database
      metadata: {name: openfga, namespace: "{{ agentos_namespace }}"}
      spec:
        cluster: {name: kagent-postgres}
        name: openfga
        owner: openfga_owner

- name: Wait for the OpenFGA database
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Database
    name: openfga
    namespace: "{{ agentos_namespace }}"
  register: openfga_database
  until: openfga_database.resources[0].status.applied | default(false)
  retries: 60
  delay: 5
