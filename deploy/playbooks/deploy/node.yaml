- name: Install K3s and administration tools
  hosts: agentos
  become: true
  vars_files: [vars.yaml]
  tasks:
    - name: Install host dependencies
      ansible.builtin.apt:
        name: "{{ ['ca-certificates', 'curl', 'openssl', 'jq', 'python3']
                  + (['qemu-guest-agent'] if ansible_virtualization_role == 'guest' else []) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable QEMU guest agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
        enabled: true
      when: ansible_virtualization_role == 'guest'

    - name: Raise inotify limits for node agents
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-agentos.conf
        sysctl_set: true
      loop:
        - {name: fs.inotify.max_user_instances, value: "8192"}
        - {name: fs.inotify.max_user_watches, value: "524288"}

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Limit anonymous API access to service account public keys
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/authentication-config.yaml
        mode: "0600"
        content: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: AuthenticationConfiguration
          anonymous:
            enabled: true
            conditions:
              - path: /openid/v1/jwks
      notify: Restart K3s

    - name: Configure independent K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          node-name: {{ inventory_hostname }}
          node-ip: {{ ansible_host }}
          tls-san: [{{ ansible_host }}]
          write-kubeconfig-mode: "0600"
          kube-apiserver-arg:
            - runtime-config=certificates.k8s.io/v1beta1=true
            - authentication-config=/etc/rancher/k3s/authentication-config.yaml
          secrets-encryption: true
      notify: Restart K3s

    - name: Download pinned K3s binary
      ansible.builtin.get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s{{ '' if node_arch == 'amd64' else '-' ~ node_arch }}"
        dest: /usr/local/bin/k3s
        checksum: "{{ k3s_checksums[node_arch] }}"
        mode: "0755"
        timeout: 300
      notify: Restart K3s

    - name: Download pinned K3s service installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
        dest: /usr/local/lib/k3s-install.sh
        checksum: "{{ k3s_install_checksum }}"
        mode: "0755"

    - name: Install K3s service
      ansible.builtin.command:
        argv: [/usr/local/lib/k3s-install.sh, server]
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Apply K3s configuration
      ansible.builtin.meta: flush_handlers

    - name: Ensure K3s is running
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        port: 6443
        timeout: 180

    - name: Wait for Kubernetes node readiness
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, --for=condition=Ready, "node/{{ inventory_hostname }}", --timeout=20s]
      register: node_readiness
      until: node_readiness.rc == 0
      retries: 15
      delay: 2
      changed_when: false

    - name: Enable Gateway API routing in the bundled Traefik
      ansible.builtin.copy:
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        mode: "0600"
        content: |
          apiVersion: helm.cattle.io/v1
          kind: HelmChartConfig
          metadata:
            name: traefik
            namespace: kube-system
          spec:
            valuesContent: |-
              providers:
                kubernetesGateway:
                  enabled: true
              gateway:
                enabled: false
              ports:
                web:
                  exposedPort: {{ ingress_ports.http }}
                websecure:
                  exposedPort: {{ ingress_ports.https }}

    - name: Download Agent Substrate CLI
      ansible.builtin.get_url:
        url: "https://github.com/kagent-dev/substrate/releases/download/v{{ substrate_version }}/kubectl-ate-linux-{{ node_arch }}"
        dest: /usr/local/bin/kubectl-ate
        checksum: "{{ kubectl_ate_checksums[node_arch] }}"
        mode: "0755"
        timeout: 300

    - name: Read cluster credentials
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: cluster_credentials
      no_log: true

    - name: Save remote cluster credentials
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        content: >-
          {{ cluster_credentials.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' + agentos_address + ':6443') }}
        mode: "0600"
      become: false
      delegate_to: localhost
      no_log: true

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true
