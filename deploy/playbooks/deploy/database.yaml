- name: Provision PostgreSQL with CloudNativePG
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  environment:
    HELM_PLUGINS: "{{ agentos_cache }}/helm-plugins"
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Install database operator
      ansible.builtin.import_tasks: database/operator.yaml

    - name: Ensure database namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata: {name: "{{ item }}"}
      loop: "{{ (site_workspace_namespaces + ['ate-system']) | unique | list }}"

    - name: Discover database credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: kagent-postgres-app
        namespace: "{{ agentos_namespace }}"
      register: database_credentials
      no_log: true

    - name: Create database credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: kagent-postgres-app, namespace: "{{ agentos_namespace }}"}
          type: kubernetes.io/basic-auth
          data:
            username: "{{ 'kagent_owner' | b64encode }}"
            password: "{{ lookup('password', playbook_dir + '/../.cache/postgres-password', length=48, chars=['ascii_letters', 'digits']) | b64encode }}"
      when: database_credentials.resources | length == 0
      no_log: true

    - name: Discover OpenFGA database credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: openfga-postgres-app
        namespace: "{{ agentos_namespace }}"
      register: openfga_database_credentials
      no_log: true

    - name: Create OpenFGA database credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openfga-postgres-app
            namespace: "{{ agentos_namespace }}"
            labels: {cnpg.io/reload: "true"}
          type: kubernetes.io/basic-auth
          data:
            username: "{{ 'openfga_owner' | b64encode }}"
            password: >-
              {{ lookup('password', playbook_dir + '/../.cache/openfga-postgres-password',
                 length=48, chars=['ascii_letters', 'digits']) | b64encode }}
      when: openfga_database_credentials.resources | length == 0
      no_log: true

    - name: Configure PostgreSQL cluster
      ansible.builtin.import_tasks: database/cluster.yaml

    - name: Configure OpenFGA PostgreSQL cluster
      ansible.builtin.import_tasks: database/openfga.yaml

    - name: Read application credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: kagent-postgres-app
        namespace: "{{ agentos_namespace }}"
      register: database_credentials
      no_log: true

    - name: Configure platform database connections
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ item.name }}", namespace: "{{ item.namespace }}"}
          type: Opaque
          data:
            connectionString: >-
              {{ ('postgres://kagent_owner:' + (database_credentials.resources[0].data.password | b64decode)
                + '@kagent-postgres-rw.' + agentos_namespace + '.svc:5432/kagent?sslmode=require') | b64encode }}
      loop:
        - {name: kagent-postgres, namespace: "{{ agentos_namespace }}"}
        - {name: substrate-postgres, namespace: ate-system}
      no_log: true

    - name: Read OpenFGA database credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: openfga-postgres-app
        namespace: "{{ agentos_namespace }}"
      register: openfga_database_credentials
      no_log: true

    - name: Configure OpenFGA database connection
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: openfga-postgres, namespace: "{{ agentos_namespace }}"}
          type: Opaque
          data:
            uri: >-
              {{ ('postgres://openfga_owner:' + (openfga_database_credentials.resources[0].data.password | b64decode)
                + '@openfga-postgres-rw.' + agentos_namespace
                + '.svc:5432/openfga?sslmode=verify-full&sslrootcert=/etc/openfga/postgres/ca.crt') | b64encode }}
      no_log: true
