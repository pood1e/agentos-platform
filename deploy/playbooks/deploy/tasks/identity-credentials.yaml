- name: Require a populated identity client secret file
  ansible.builtin.assert:
    that: lookup('ansible.builtin.file', identity_client_secret_file) | trim | length > 0
    quiet: true
  when: identity_client_secret_file | length > 0
  no_log: true

- name: Configure the identity client secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: "{{ site_identity_secret }}", namespace: "{{ agentos_namespace }}"}
      type: Opaque
      data:
        client-secret: "{{ lookup('ansible.builtin.file', identity_client_secret_file) | trim | b64encode }}"
  when: identity_client_secret_file | length > 0
  no_log: true
  diff: false

- name: Require identity credentials
  no_log: true
  diff: false
  block:
    - name: Discover the identity client secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ site_identity_secret }}"
        namespace: "{{ agentos_namespace }}"
      register: site_identity_credentials

    - name: Require an identity client secret
      ansible.builtin.assert:
        that:
          - site_identity_credentials.resources | length == 1
          - site_identity_credentials.resources[0].get('data', {}).get('client-secret', '') | b64decode | trim | length > 0
        quiet: true
      when: not ansible_check_mode or identity_client_secret_file | length == 0
