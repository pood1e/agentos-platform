- name: Configure node and Pod DNS
  hosts: agentos
  become: true
  gather_facts: false
  vars_files: [vars.yaml]
  tasks:
    - name: Resolve site hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^.*[ \t]{{ item.name | regex_escape }}$"
        line: "{{ item.address }} {{ item.name }}"
        state: present
      loop: "{{ node_hosts }}"
    - name: Configure shared node resolver
      ansible.builtin.import_role:
        name: node_dns
