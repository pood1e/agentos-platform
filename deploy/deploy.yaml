- name: Configure DNS transport
  ansible.builtin.import_playbook: dns.yaml
  tags: [node]

- name: Prepare single-node Kubernetes
  ansible.builtin.import_playbook: node.yaml
  tags: [node]

- name: Prepare Helm
  ansible.builtin.import_playbook: helm.yaml
  tags: [runtime, app, ingress, voice]

- name: Install platform runtime
  ansible.builtin.import_playbook: runtime.yaml
  tags: [runtime]

- name: Connect model service
  ansible.builtin.import_playbook: model.yaml
  tags: [model, app]

- name: Configure domain and TLS
  ansible.builtin.import_playbook: ingress.yaml
  tags: [ingress]

- name: Connect real-time voice transport
  ansible.builtin.import_playbook: voice.yaml
  tags: [voice, app]

- name: Install application chart
  ansible.builtin.import_playbook: app.yaml
  tags: [app]

- name: Install observability and evaluation services
  ansible.builtin.import_playbook: observability.yaml
  tags: [observability]
