- name: Discover the workspace ACME issuer
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Issuer
    name: "{{ langfuse_issuer_name }}"
    namespace: "{{ agentos_namespace }}"
  register: langfuse_workspace_issuer

- name: Require an existing workspace issuer
  ansible.builtin.assert:
    that: langfuse_workspace_issuer.resources | length == 1

- name: Discover workspace DNS challenge credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: cloudflare-dns
    namespace: "{{ agentos_namespace }}"
  register: langfuse_dns_credentials
  no_log: true

- name: Configure observability DNS challenge credentials
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: cloudflare-dns, namespace: "{{ langfuse_namespace }}"}
      type: Opaque
      data: "{{ langfuse_dns_credentials.resources[0].data }}"
  no_log: true

- name: Configure observability ACME issuer
  kubernetes.core.k8s:
    definition:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata: {name: "{{ langfuse_issuer_name }}", namespace: "{{ langfuse_namespace }}"}
      spec: "{{ langfuse_workspace_issuer.resources[0].spec }}"

- name: Converge observability DNS record
  community.general.cloudflare_dns:
    zone: "{{ dns_zone }}"
    record: "{{ langfuse_domain }}"
    type: A
    value: "{{ agentos_address }}"
    proxied: false
    api_token: "{{ langfuse_dns_credentials.resources[0].data['api-token'] | b64decode }}"
    state: present
  no_log: true
