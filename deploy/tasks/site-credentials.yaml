- name: Provision browser session credentials
  no_log: true
  diff: false
  block:
    - name: Discover browser session credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ site_application_name }}-sessions"
        namespace: "{{ agentos_namespace }}"
      register: site_sessions

    - name: Create browser session credentials
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ site_application_name }}-sessions", namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData:
            web: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
            delegation: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) | b64encode }}"
      when: site_sessions.resources | length == 0

- name: Provision password identity credentials
  when: site_identity.get('mode', 'password') == 'password'
  no_log: true
  diff: false
  block:
    - name: Discover the site password
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ site_password_secret }}"
        namespace: "{{ agentos_namespace }}"
      register: site_password

    - name: Create the site password
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ site_password_secret }}", namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData:
            password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      when: site_password.resources | length == 0

    - name: Discover identity credentials
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ site_application_name }}-identity-keys"
        namespace: "{{ agentos_namespace }}"
      register: site_identity_keys

    - name: Generate the identity signing key
      community.crypto.openssl_privatekey_pipe:
        type: ECC
        curve: secp256r1
        format: pkcs8
      register: site_signing_key
      when: site_identity_keys.resources | length == 0

    - name: Create identity credentials
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ site_application_name }}-identity-keys", namespace: "{{ agentos_namespace }}"}
          type: Opaque
          stringData:
            client-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
            signing-key: "{{ site_signing_key.privatekey }}"
            cookie-key: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      when: site_identity_keys.resources | length == 0
