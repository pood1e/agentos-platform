- name: Verify release artifacts
  ansible.builtin.include_tasks: verify-chart.yaml

- name: Read verified CRD definitions
  ansible.builtin.command:
    argv: ["{{ helm_binary }}", show, crds, "{{ delivery_chart_archive }}"]
  register: delivery_crds
  changed_when: false
  check_mode: false

- name: Apply release CRD schemas
  kubernetes.core.k8s:
    kubeconfig: "{{ delivery_kubeconfig }}"
    definition: "{{ delivery_crds.stdout | from_yaml_all | select | list }}"
    apply: true
    server_side_apply:
      field_manager: agentos-crds
    wait: true
    wait_condition: {type: Established, status: "True"}
    wait_timeout: 60
  when: delivery_crds.stdout | trim | length > 0

- name: Install the verified chart
  kubernetes.core.helm:
    binary_path: "{{ helm_binary }}"
    kubeconfig: "{{ delivery_kubeconfig }}"
    name: "{{ delivery_release }}"
    chart_ref: "{{ delivery_chart_archive }}"
    release_namespace: "{{ delivery_namespace }}"
    reset_values: true
    history_max: 3
    wait: true
    timeout: "{{ delivery_timeout | default('10m') }}"
    values_files: "{{ [delivery_values_file] if delivery_values_file | default('') | length > 0 else omit }}"
  no_log: true
