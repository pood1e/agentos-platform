- name: Prepare native Substrate operator identity
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata: {name: agentos-substrate-operator, namespace: ate-system}
      automountServiceAccountToken: false

- name: Admit platform services to the native Substrate API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: agentos-platform-api, namespace: ate-system}
      spec:
        podSelector:
          matchLabels: {app: ate-api-server}
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ agentos_namespace }}"
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: [console, controller]
            ports: [{port: 443, protocol: TCP}]

- name: Restrict native controller access to the control plane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: kagent-control-plane, namespace: "{{ agentos_namespace }}"}
      spec:
        podSelector:
          matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: agentos, app.kubernetes.io/component: console}
              - podSelector:
                  matchLabels: {agentos.dev/gateway: business}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
            ports: [{port: 8083, protocol: TCP}]
