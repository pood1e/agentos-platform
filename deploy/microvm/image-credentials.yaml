- name: Install credential response reader
  ansible.builtin.apt:
    name: busybox-static
    state: present
  delegate_to: "{{ agentos_node }}"
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: Create image credential executable directory
  ansible.builtin.file:
    path: /var/lib/agentos/image-credential-provider/bin
    state: directory
    mode: "0755"
  delegate_to: "{{ agentos_node }}"
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  register: credential_executable_directory

- name: Install static credential response reader
  ansible.builtin.copy:
    src: /bin/busybox
    dest: /var/lib/agentos/image-credential-provider/bin/busybox
    remote_src: true
    mode: "0755"
  delegate_to: "{{ agentos_node }}"
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  when: not ansible_check_mode or not credential_executable_directory.changed

- name: Prepare native image registry credentials
  ansible.builtin.set_fact:
    microvm_image_credentials: >-
      {%- set auth = {} -%}
      {%- set config = image_pull_credentials.resources[0].data['.dockerconfigjson'] | b64decode | from_json -%}
      {%- for registry, credentials in config.auths.items() -%}
      {%- set basic = (credentials.auth | default('Og==') | b64decode).split(':', 1) -%}
      {%- set _ = auth.update({registry: {'username': credentials.username | default(basic[0]),
                                        'password': credentials.password | default(basic[1])}}) -%}
      {%- endfor -%}
      {{ {'apiVersion': 'credentialprovider.kubelet.k8s.io/v1',
          'kind': 'CredentialProviderResponse', 'cacheKeyType': 'Registry',
          'cacheDuration': '0s', 'auth': auth} }}
  when: image_pull_credentials.resources | length > 0
  no_log: true

- name: Configure native kubelet credential response
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: {name: atelet-image-credentials, namespace: ate-system}
      type: Opaque
      data:
        response.json: "{{ microvm_image_credentials | to_json | b64encode }}"
  when: image_pull_credentials.resources | length > 0
  no_log: true
  diff: false
