apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [resources.yaml]
patches:
  - target: {kind: Deployment, name: ate-api-server}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ate-api-server}
      spec:
        template:
          spec:
            imagePullSecrets: [{name: agentos-registry}]
            containers:
              - {name: ate-api-server, image: agentos-patched-image}
  - target: {kind: DaemonSet, name: atelet}
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: atelet}
      spec:
        template:
          spec:
            volumes:
              - name: image-credentials
                secret: {secretName: atelet-image-credentials, defaultMode: 256}
            containers:
              - name: atelet
                volumeMounts:
                  - {name: image-credentials, mountPath: /run/image-credentials, readOnly: true}
replacements:
  - sourceValue: 2m
    targets:
      - select: {kind: ConfigMap, name: atenet-router-agentgateway-config}
        fieldPaths:
          - data.config\.yaml.routes.[name=substrate-actors.*].policies.substrateIngress.requestParking.budget
          - data.config\.yaml.binds.*.listeners.*.routes.[name=substrate-actors.*].policies.substrateIngress.requestParking.budget
        options: {create: true}
