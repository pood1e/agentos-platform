- name: Provision required database
  ansible.builtin.import_playbook: database.yaml

- name: Provision agentgateway
  ansible.builtin.import_playbook: gateway.yaml

- name: Install Agent Substrate and kagent
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yaml]
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.cache/deploy-venv/bin/python"
    identity_pools:
      - { name: service-dns-ca-pool, namespace: podcertificate-controller-system, type: ca }
      - { name: pod-identity-ca-pool, namespace: podcertificate-controller-system, type: ca }
      - { name: postgres-ca-pool, namespace: podcertificate-controller-system, type: ca }
      - { name: actor-id-jwt-pool, namespace: ate-system, type: jwt }
      - { name: actor-id-ca-pool, namespace: ate-system, type: ca }
      - { name: egress-mitm-ca-pool, namespace: ate-system, type: ca }
  module_defaults:
    kubernetes.core.helm:
      binary_path: "{{ helm_binary }}"
      kubeconfig: "{{ kubeconfig_path }}"
      reset_values: true
    kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
    - name: Install Agent Substrate CRDs
      kubernetes.core.helm:
        name: substrate-crds
        chart_ref: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
        chart_version: "{{ substrate_version }}"
        release_namespace: ate-system
        create_namespace: true
        wait: true
        timeout: 10m

    - name: Prepare runtime image pull credentials
      tags: [substrate]
      ansible.builtin.include_tasks:
        file: registry.yaml
        apply:
          tags: [substrate]

    - name: Share runtime image pull credentials with Substrate
      tags: [substrate]
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: agentos-registry, namespace: ate-system}
          type: kubernetes.io/dockerconfigjson
          data: "{{ image_pull_credentials.resources[0].data }}"
      no_log: true

    - name: Configure microVM image credentials
      tags: [substrate]
      ansible.builtin.include_tasks:
        file: microvm/image-credentials.yaml
        apply:
          tags: [substrate]

    - name: Install Agent Substrate
      tags: [substrate]
      kubernetes.core.helm:
        name: substrate
        chart_ref: oci://ghcr.io/kagent-dev/substrate/helm/substrate
        chart_version: "{{ substrate_version }}"
        release_namespace: ate-system
        release_values: "{{ lookup('template', 'values/substrate.yaml.j2') | from_yaml }}"
        post_renderer: "{{ playbook_dir }}/microvm/substrate-post-renderer.py"
        wait: false
        timeout: 10m
      environment:
        PATH: "{{ ansible_python_interpreter | dirname }}:{{ lookup('env', 'PATH') }}"
        AGENTOS_SUBSTRATE_API_IMAGE: "{{ substrate_api_image }}"

    - name: Prepare certificate controller namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: podcertificate-controller-system

    - name: Discover identity pools
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      loop: "{{ identity_pools }}"
      register: identity_state
      no_log: true

    - name: Generate missing identity pools
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/bin/kubectl-ate', 'admin', 'make-' + item.item.type + '-pool',
              '--name=' + item.item.name, '--secret-namespace=' + item.item.namespace]
             + (['--key-id=1'] if item.item.type == 'jwt' else ['--ca-id=1'])
             + (['--key-type=ECDSAP256'] if item.item.name == 'egress-mitm-ca-pool' else []) }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      vars:
        ansible_python_interpreter: /usr/bin/python3
      delegate_to: "{{ agentos_node }}"
      become: true
      loop: "{{ identity_state.results }}"
      when: item.resources | length == 0
      changed_when: true
      no_log: true

    - name: Install Substrate certificate controller
      kubernetes.core.helm:
        name: substrate-podcert
        chart_ref: oci://ghcr.io/kagent-dev/substrate/helm/substrate-podcert
        chart_version: "{{ substrate_version }}"
        release_namespace: podcertificate-controller-system
        wait: true
        timeout: 5m

    - name: Read actor identity root certificate
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import base64, json, ssl, subprocess
            argv = ['/usr/local/bin/k3s', 'kubectl', 'get', 'secret', 'actor-id-ca-pool', '-n', 'ate-system', '-o', 'json']
            secret = json.loads(subprocess.check_output(argv))
            pool = json.loads(base64.b64decode(secret['data']['pool']))
            print(ssl.DER_cert_to_PEM_cert(base64.b64decode(pool['CAs'][0]['RootCertificateDER'])))
      delegate_to: "{{ agentos_node }}"
      become: true
      changed_when: false
      register: actor_root
      check_mode: false
      vars:
        ansible_python_interpreter: /usr/bin/python3
      no_log: true

    - name: Install actor identity trust root
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: { name: actor-id-ca-certs, namespace: ate-system }
          type: Opaque
          data:
            ca.crt: "{{ actor_root.stdout | b64encode }}"
      no_log: true

    - name: Discover Kubernetes identity issuer
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, get, --raw, /.well-known/openid-configuration]
      delegate_to: "{{ agentos_node }}"
      become: true
      changed_when: false
      register: issuer_document
      check_mode: false
      vars:
        ansible_python_interpreter: /usr/bin/python3

    - name: Configure Agent Substrate authentication
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: ate-api-authentication, namespace: ate-system }
          data:
            authentication.yaml: |
              actorIdentityJWTProvider: kubernetes
              jwtProviders:
              - name: kubernetes
                issuer: {{ (issuer_document.stdout | from_json).issuer }}
                audiences: [api.ate-system.svc]
                certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                discoveryTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

    - name: Wait for Agent Substrate deployments
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, wait, deployment, --all, -n, ate-system, --for=condition=Available, --timeout=600s]
      delegate_to: "{{ agentos_node }}"
      become: true
      changed_when: false
      vars:
        ansible_python_interpreter: /usr/bin/python3

    - name: Prepare microVM runtime
      ansible.builtin.import_tasks: microvm/tasks.yaml

    - name: Verify Substrate rollout
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, rollout, status, "deployment/{{ item }}", -n, ate-system, --timeout=300s]
      loop: [ate-api-server, atenet-egress, atenet-router]
      delegate_to: "{{ agentos_node }}"
      become: true
      changed_when: false
      vars:
        ansible_python_interpreter: /usr/bin/python3

    - name: Install kagent CRDs
      kubernetes.core.helm:
        name: kagent-crds
        chart_ref: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
        chart_version: "{{ kagent_version }}"
        release_namespace: "{{ agentos_namespace }}"
        create_namespace: true
        wait: true
        timeout: 10m

    - name: Install Helm diff for rendered manifest checks
      kubernetes.core.helm_plugin:
        binary_path: "{{ helm_binary }}"
        plugin_path: https://github.com/databus23/helm-diff
        plugin_version: "{{ helm_diff_version }}"
        state: present
      tags: [kagent]

    - name: Prepare kagent image pull credentials
      ansible.builtin.include_tasks:
        file: registry.yaml
        apply:
          tags: [kagent]
      tags: [kagent]

    - name: Prepare worker image pull identity
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: kagent-workers, namespace: "{{ agentos_namespace }}"}
          imagePullSecrets: [{name: agentos-registry}]
      tags: [kagent]

    - name: Install kagent
      kubernetes.core.helm:
        name: kagent
        chart_ref: oci://ghcr.io/kagent-dev/kagent/helm/kagent
        chart_version: "{{ kagent_version }}"
        release_namespace: "{{ agentos_namespace }}"
        release_values: "{{ lookup('template', 'values/kagent.yaml.j2') | from_yaml }}"
        post_renderer: "{{ playbook_dir }}/gateway/kagent-post-renderer.py"
        wait: true
        timeout: 10m

      environment:
        PATH: "{{ ansible_python_interpreter | dirname }}:{{ lookup('env', 'PATH') }}"
        AGENTOS_KAGENT_CONTROLLER_IMAGE: "{{ kagent_controller_image }}"
      tags: [kagent]

    - name: Verify kagent controller rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kagent-controller
        namespace: "{{ agentos_namespace }}"
        wait: true
        wait_timeout: 300

    - name: Prepare model-independent runtime check
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'microvm/verify-template.yaml') | from_yaml }}"
