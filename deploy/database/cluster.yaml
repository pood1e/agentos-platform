- name: Discover database cluster
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: kagent-postgres
    namespace: "{{ agentos_namespace }}"
  register: database_cluster

- name: Converge PostgreSQL cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: kagent-postgres, namespace: "{{ agentos_namespace }}"}
      spec:
        instances: 1
        imageName: "{{ postgres_image }}"
        storage: {size: 2Gi, storageClass: local-path}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        bootstrap: >-
          {{ database_cluster.resources[0].spec.bootstrap if database_cluster.resources | length > 0
             else database_bootstrap | default({'initdb': database_initdb}) }}
        externalClusters: >-
          {{ database_cluster.resources[0].spec.externalClusters | default([])
             if database_cluster.resources | length > 0 else database_external_clusters | default([]) }}
  vars:
    database_initdb:
      database: kagent
      owner: kagent_owner
      secret: {name: kagent-postgres-app}
      postInitApplicationSQL:
        - CREATE SCHEMA extensions
        - CREATE EXTENSION vector WITH SCHEMA extensions
        - REVOKE ALL ON SCHEMA extensions FROM PUBLIC
        - GRANT USAGE ON SCHEMA extensions TO kagent_owner

- name: Wait for PostgreSQL readiness
  kubernetes.core.k8s_info:
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: kagent-postgres
    namespace: "{{ agentos_namespace }}"
    wait: true
    wait_condition: {type: Ready, status: "True"}
    wait_timeout: 900

- name: Restrict database ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: kagent-database, namespace: "{{ agentos_namespace }}"}
      spec:
        podSelector:
          matchLabels: {cnpg.io/cluster: kagent-postgres}
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: kagent, app.kubernetes.io/component: controller}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: agentos}
                  matchExpressions:
                    - {key: app.kubernetes.io/component, operator: In, values: [api, dataplane, worker, identity]}
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: ate-system}
                podSelector:
                  matchLabels: {app: ate-api-server}
              - podSelector:
                  matchLabels: {cnpg.io/cluster: kagent-postgres}
            ports: [{port: 5432, protocol: TCP}]
          - from:
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: cnpg-system}
            ports: [{port: 8000, protocol: TCP}, {port: 5432, protocol: TCP}]
