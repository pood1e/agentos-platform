syntax = "proto3";

package agentos.execution.v1;

import "agentos/authorization/v1/permission.proto";
import "kagent/api/v1/common.proto";

// Private execution state persisted outside the runtime and model context.
message ExecutionIdentity {
  string subject = 1;
  bool write = 2;
  oneof credential {
    string access_token = 3;
    bool service = 4;
  }
  repeated agentos.authorization.v1.Capability capabilities = 5;
}

message ExecutionBinding {
  string session_id = 1;
  string root_session_id = 2;
  string parent_session_id = 3;
  kagent.api.v1.ResourceReference agent = 4;
  string subject = 5;
  bool write = 6;
  bool revoked = 7;
  repeated agentos.authorization.v1.Capability capabilities = 8;
}
