syntax = "proto3";

package agentos.automation.v1;

import "agentos/automation/v1/automation.proto";
import "buf/validate/validate.proto";
import "kagent/api/v1alpha1/scheduled_runs.proto";

// Workspace authorization around kagent's native scheduling API.
service AutomationService {
  rpc ListScheduledRuns(kagent.api.v1alpha1.ListScheduledRunsRequest) returns (kagent.api.v1alpha1.ListScheduledRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetScheduledRun(kagent.api.v1alpha1.GetScheduledRunRequest) returns (kagent.api.v1alpha1.GetScheduledRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateScheduledRun(kagent.api.v1alpha1.CreateScheduledRunRequest) returns (kagent.api.v1alpha1.CreateScheduledRunResponse);
  rpc UpdateScheduledRun(kagent.api.v1alpha1.UpdateScheduledRunRequest) returns (kagent.api.v1alpha1.UpdateScheduledRunResponse);
  rpc DeleteScheduledRun(kagent.api.v1alpha1.DeleteScheduledRunRequest) returns (kagent.api.v1alpha1.DeleteScheduledRunResponse);
  rpc TriggerScheduledRun(kagent.api.v1alpha1.TriggerScheduledRunRequest) returns (kagent.api.v1alpha1.TriggerScheduledRunResponse);
  rpc GetScheduledRunExecution(kagent.api.v1alpha1.GetScheduledRunExecutionRequest) returns (kagent.api.v1alpha1.GetScheduledRunExecutionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListScheduledRunExecutions(kagent.api.v1alpha1.ListScheduledRunExecutionsRequest) returns (kagent.api.v1alpha1.ListScheduledRunExecutionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListEventTriggers(ListEventTriggersRequest) returns (ListEventTriggersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Solution defaults are created once; subsequent edits remain in kagent.
message AutomationPresets {
  repeated kagent.api.v1alpha1.CreateScheduledRunRequest scheduled_runs = 1 [(buf.validate.field).repeated.max_items = 64];
  repeated CaseTrigger event_triggers = 2 [(buf.validate.field).repeated.max_items = 64];
}

message ListEventTriggersRequest {}

message ListEventTriggersResponse {
  repeated EventTrigger event_triggers = 1;
}

// Describes the platform's event ingress configuration; worker health is environment-owned.
message EventTrigger {
  CaseTrigger trigger = 1;
  string environment = 2;
  bool ingress_enabled = 3;
}
