syntax = "proto3";

package agentos.distribution.v1;

// Immutable artifacts built from one source revision.
message ReleaseManifest {
  string revision = 1;
  string version = 2;
  string python_version = 3;
  map<string, Artifact> artifacts = 4;
}

// A container, chart archive, contract package or deployment bundle.
message Artifact {
  string location = 1;
  string digest = 2;
}
