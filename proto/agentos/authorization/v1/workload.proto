syntax = "proto3";

package agentos.authorization.v1;

import "agentos/authorization/v1/permission.proto";
import "buf/validate/validate.proto";
import "kagent/api/v1/common.proto";

// Exact workload subjects and trusted issuers for one deployment.
message WorkloadAuthentication {
  string controller_subject = 3;
  // Platform processes that call the gateway's embedding model with their own identity.
  repeated string platform_subjects = 4;
  string model_audience = 5;
  string mcp_audience = 6;
  repeated ExecutionSource execution_sources = 7;
}

// A registered client-credentials identity for external execution.
message ExecutionSource {
  string issuer = 2 [(buf.validate.field).string = {
    uri: true
    prefix: "https://"
  }];
  string audience = 3 [(buf.validate.field).string.min_len = 1];
  string client_id = 4 [(buf.validate.field).string.min_len = 1];
  string subject = 5 [(buf.validate.field).string.min_len = 1];
  repeated kagent.api.v1.ResourceReference agents = 7 [(buf.validate.field).repeated.min_items = 1];
  bool write = 8;
  repeated Capability capabilities = 9;
}

// Gateway-provided HTTP context, separate from the MCP authorization protocol.
message ModelAuthorization {
  string path = 1;
  string method = 2;
  string model = 3;
}
