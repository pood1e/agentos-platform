syntax = "proto3";

package agentos.console.v1;

import "agentos/console/v1/engineer.proto";
import "agentos/execution/v1/state.proto";
import "agentos/execution/v1/task.proto";
import "agentos/governance/v1/governance.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "kagent/api/v1alpha1/sessions.proto";

// Root operation started by a person or delegated from a conversation.
message TaskSummary {
  string id = 1;
  string title = 2;
  string prompt = 3;
  agentos.execution.v1.ActivityState state = 4;
  google.protobuf.Timestamp updated_at = 5;
  repeated string tags = 6;
  // Opaque concurrency token for tag edits; independent of runtime execution versions.
  string tags_version = 7;
}

// Operation tree rooted at one task. Runs omit prompt, output and calls.
message TaskDetail {
  TaskSummary summary = 1;
  repeated Engineer participants = 2;
  repeated Delegation delegations = 3;
  repeated Interaction interactions = 4;
  repeated agentos.execution.v1.TaskRun runs = 5;
  string answer = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  // Native session identities and names used by this operation.
  repeated kagent.api.v1alpha1.Session sessions = 9;
  bool operate = 10;
  bool edit_tags = 11;
}

enum DelegationKind {
  DELEGATION_KIND_UNSPECIFIED = 0;
  DELEGATION_KIND_INVOKE = 1;
  DELEGATION_KIND_BACKGROUND = 2;
  DELEGATION_KIND_HANDOFF = 3;
  DELEGATION_KIND_RESUME = 4;
  DELEGATION_KIND_REVIEW = 5;
}

message Delegation {
  string id = 1;
  DelegationKind kind = 2;
  string source_agent_id = 3;
  string target_agent_id = 4;
  string source_task_id = 5;
  string target_task_id = 6;
  string call_id = 7;
  agentos.execution.v1.ActivityState state = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp returned_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // Native approval request reviewed by this task.
  string request_id = 12;
  // Delegations whose synchronous replies were observed before this dispatch.
  repeated string depends_on = 13;
  // A synchronous reply was recorded, including replies without a timestamp.
  bool returned = 14;
  string source_context_id = 15;
  string target_context_id = 16;
}

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_APPROVAL = 1;
  INTERACTION_KIND_QUESTION = 2;
}

message ApprovalTool {
  string name = 1;
  google.protobuf.Value args = 2;
  string id = 3;
  string call_id = 4;
}

message Question {
  string question = 1;
  repeated string choices = 2;
  bool multiple = 3;
}

message Answer {
  repeated string values = 1;
}

// Native kagent human-in-the-loop request and its recorded decision.
message Interaction {
  string id = 1;
  string task_id = 2;
  string agent_id = 3;
  string request_id = 4;
  InteractionKind kind = 5;
  repeated ApprovalTool tools = 6;
  repeated Question questions = 7;
  string explanation = 8;
  agentos.execution.v1.ActivityState state = 9;
  google.protobuf.Timestamp requested_at = 10;
  google.protobuf.Timestamp answered_at = 11;
  repeated Answer answers = 12;
  string rejection_reason = 13;
  // Decisions and external references supplied by the configured approval service.
  repeated agentos.governance.v1.Approval approvals = 14;
  bool external = 15;
  bool approve = 16;
}
