syntax = "proto3";

package agentos.console.v1;

import "buf/validate/validate.proto";

message SpeechConfiguration {
  SpeechTranscription transcription = 1;
  SpeechSynthesis synthesis = 2;
  reserved 3;
  reserved "voice";
}

message SpeechEndpoint {
  string base_url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://"
  }];
  reserved 2;
  reserved "api_key_file";
}

message SpeechTranscription {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_DEEPGRAM = 1;
    PROTOCOL_WHISPERLIVEKIT = 2;
  }
  SpeechEndpoint endpoint = 1 [(buf.validate.field).required = true];
  string model = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated string language_codes = 3 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {pattern: "^[a-z]{2,3}$"}
    }
  }];
  Protocol protocol = 4 [(buf.validate.field).enum.defined_only = true];
}

message SpeechSynthesis {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_OPENAI = 1;
    PROTOCOL_NEMO = 2;
  }
  SpeechEndpoint endpoint = 1 [(buf.validate.field).required = true];
  // Voices are selected by text language; the first voice is the fallback.
  repeated SpeechVoice voices = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  Protocol protocol = 3 [(buf.validate.field).enum.defined_only = true];
}

message SpeechVoice {
  string language_code = 1 [(buf.validate.field).string.pattern = "^[a-z]{2,3}$"];
  string model = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string voice = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetSpeechCapabilitiesRequest {}

message GetSpeechCapabilitiesResponse {
  // The deployment includes the voice worker.
  bool enabled = 1;
  bool transcription = 2;
  bool synthesis = 3;
  repeated string transcription_languages = 4;
}

enum VoiceMode {
  VOICE_MODE_UNSPECIFIED = 0;
  VOICE_MODE_DICTATION = 1;
  VOICE_MODE_READ_ALOUD = 2;
  VOICE_MODE_CALL = 3;
}

message StartVoiceSessionRequest {
  option (buf.validate.message).cel = {
    id: "voice.read_aloud_text"
    message: "read-aloud sessions require text"
    expression: "this.mode != 2 || size(this.text) > 0"
  };
  VoiceMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Transcription language; empty detects it.
  string language_code = 2 [(buf.validate.field).string.pattern = "^([a-z]{2,3})?$"];
  // Markdown answer to read aloud.
  string text = 3 [(buf.validate.field).string.max_len = 8000];
  // Conversation of a call; empty starts one with the first turn.
  string context_id = 4 [(buf.validate.field).string.max_len = 128];
}

message StartVoiceSessionResponse {
  string url = 1;
  string token = 2;
}
