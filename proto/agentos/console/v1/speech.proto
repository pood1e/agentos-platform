syntax = "proto3";

package agentos.console.v1;

import "buf/validate/validate.proto";
import "google/api/httpbody.proto";

message SpeechConfiguration {
  SpeechTranscription transcription = 1;
  SpeechSynthesis synthesis = 2;
  reserved 3;
  reserved "voice";
}

message SpeechEndpoint {
  string base_url = 1 [(buf.validate.field).string = {
    uri: true
    pattern: "^https?://"
  }];
  reserved 2;
  reserved "api_key_file";
}

message SpeechTranscription {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_DEEPGRAM = 1;
    PROTOCOL_WHISPERLIVEKIT = 2;
  }
  SpeechEndpoint endpoint = 1 [(buf.validate.field).required = true];
  string model = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  repeated string language_codes = 3 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {pattern: "^[a-z]{2,3}$"}
    }
  }];
  Protocol protocol = 4 [(buf.validate.field).enum.defined_only = true];
}

message SpeechSynthesis {
  enum Protocol {
    PROTOCOL_UNSPECIFIED = 0;
    PROTOCOL_OPENAI = 1;
    PROTOCOL_NEMO = 2;
  }
  SpeechEndpoint endpoint = 1 [(buf.validate.field).required = true];
  // Voices are selected by text language; the first voice is the fallback.
  repeated SpeechVoice voices = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 32
  }];
  Protocol protocol = 3 [(buf.validate.field).enum.defined_only = true];
}

message SpeechVoice {
  string language_code = 1 [(buf.validate.field).string.pattern = "^[a-z]{2,3}$"];
  string model = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string voice = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetSpeechCapabilitiesRequest {}

message GetSpeechCapabilitiesResponse {
  bool transcription = 1;
  bool synthesis = 2;
  repeated string transcription_languages = 3;
  bool voice_calls = 4;
}

message StartVoiceCallRequest {
  string call_id = 1 [(buf.validate.field).string.uuid = true];
  string language_code = 2 [(buf.validate.field).string.pattern = "^([a-z]{2,3})?$"];
}

message VoiceCallConnection {
  string call_id = 1;
  string url = 2;
  string token = 3;
  repeated string synthesis_languages = 4;
}

message StartVoiceCallResponse {
  VoiceCallConnection connection = 1;
}

message EndVoiceCallRequest {
  string call_id = 1 [(buf.validate.field).string.uuid = true];
}

message EndVoiceCallResponse {}

message TranscribeAudioRequest {
  google.api.HttpBody audio = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "speech.audio_size"
      message: "audio must contain between 1 byte and 1 MiB"
      expression: "size(this.data) > 0 && size(this.data) <= 1048576"
    }
  ];
}

message TranscribeAudioResponse {
  string text = 1;
}

message SynthesizeSpeechRequest {
  string text = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
}

message SynthesizeSpeechResponse {
  google.api.HttpBody audio = 1;
}
