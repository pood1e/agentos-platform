syntax = "proto3";

package agentos.console.v1;

import "a2a.proto";
import "agentos/console/v1/role.proto";
import "agentos/console/v1/engineer.proto";
import "agentos/console/v1/task.proto";
import "agentos/execution/v1/state.proto";
import "agentos/execution/v1/task.proto";
import "google/protobuf/timestamp.proto";

message ConversationSummary {
  string context_id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ChatMessage {
  reserved 3, 6, 7;
  reserved "text", "progress", "calls";

  string id = 1;
  lf.a2a.v1.Role role = 2;
  string task_id = 4;
  // Operations started from this user message.
  repeated TaskSummary tasks = 5;
  repeated ChatMessagePart parts = 8;
}

message ChatMessagePart {
  string id = 1;
  oneof content {
    // User text or a completed assistant answer.
    string text = 2;
    // Assistant narration and the current draft while work is in progress.
    string progress = 3;
    agentos.execution.v1.ToolCall tool_call = 4;
    agentos.execution.v1.TaskRun agent_result = 5;
  }
}

// Empty context_id describes a conversation that has not started yet.
message Conversation {
  string context_id = 1;
  bool ready = 2;
  bool busy = 3;
  agentos.execution.v1.ActivityState state = 4;
  repeated ChatMessage messages = 5;
  repeated Interaction interactions = 6;
  RoleDefinition role_draft = 7;
  string title = 8;
  bool operate = 9;
  repeated agentos.execution.v1.TaskRun runs = 10;
  repeated Engineer participants = 11;
}
