syntax = "proto3";

package agentos.console.v1;

// Display state shared by tasks, calls, delegations, interactions and engineers.
enum ActivityState {
  ACTIVITY_STATE_UNSPECIFIED = 0;
  ACTIVITY_STATE_SUBMITTED = 1;
  ACTIVITY_STATE_WORKING = 2;
  ACTIVITY_STATE_AWAITING_APPROVAL = 3;
  ACTIVITY_STATE_AWAITING_INPUT = 4;
  ACTIVITY_STATE_SUCCEEDED = 5;
  ACTIVITY_STATE_FAILED = 6;
  ACTIVITY_STATE_REJECTED = 7;
  ACTIVITY_STATE_CANCELED = 8;
  ACTIVITY_STATE_IDLE = 9;
  ACTIVITY_STATE_UNAVAILABLE = 10;
  ACTIVITY_STATE_UNOBSERVED = 11;
}
