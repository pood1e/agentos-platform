syntax = "proto3";

package agentos.console.v1;

import "agentos/console/v1/access.proto";
import "agentos/console/v1/conversation.proto";
import "agentos/console/v1/agent.proto";
import "agentos/console/v1/execution.proto";
import "agentos/console/v1/role.proto";
import "agentos/console/v1/speech.proto";
import "agentos/console/v1/task.proto";
import "agentos/console/v1/tool.proto";
import "agentos/execution/v1/state.proto";
import "agentos/execution/v1/task.proto";
import "agentos/mcp/v1/app.proto";
import "buf/validate/validate.proto";
import "kagent/api/v1/agents.proto";
import "kagent/api/v1/common.proto";
import "kagent/api/v1/harnesses.proto";
import "kagent/api/v1/interactions.proto";
import "kagent/api/v1/models.proto";
import "kagent/api/v1/scheduled_runs.proto";
import "kagent/api/v1/sessions.proto";
import "kagent/api/v1/tools.proto";

// Workbench API. google.rpc.ErrorInfo.reason carries localization keys.
service ConsoleService {
  rpc GetAccessProfile(GetAccessProfileRequest) returns (GetAccessProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetSpeechCapabilities(GetSpeechCapabilitiesRequest) returns (GetSpeechCapabilitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Issues a LiveKit token for a dictation, read-aloud or call session.
  rpc StartVoiceSession(StartVoiceSessionRequest) returns (StartVoiceSessionResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Lists authorized executions for any native Agent, including workflows and background work.
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Owners may delete a conversation after all delegated work has finished.
  rpc DeleteSession(.kagent.api.v1.DeleteSessionRequest) returns (.kagent.api.v1.DeleteSessionResponse);
  // Sends the current conversation, then again whenever it changes.
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchConversationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc RespondInteraction(RespondInteractionRequest) returns (RespondInteractionResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetAppResource(GetAppResourceRequest) returns (GetAppResourceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CallAppTool(CallAppToolRequest) returns (CallAppToolResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // Tool bindings and execution confirmation requirements.
  rpc ExplainTools(ExplainToolsRequest) returns (ExplainToolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The caller's native schedules for Agents in this workspace. Each firing runs as the creator.
  rpc ListScheduledRuns(.kagent.api.v1.ListScheduledRunsRequest) returns (.kagent.api.v1.ListScheduledRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateScheduledRun(.kagent.api.v1.CreateScheduledRunRequest) returns (.kagent.api.v1.CreateScheduledRunResponse);
  rpc UpdateScheduledRun(.kagent.api.v1.UpdateScheduledRunRequest) returns (.kagent.api.v1.UpdateScheduledRunResponse);
  rpc DeleteScheduledRun(.kagent.api.v1.DeleteScheduledRunRequest) returns (.kagent.api.v1.DeleteScheduledRunResponse);
  rpc TriggerScheduledRun(.kagent.api.v1.TriggerScheduledRunRequest) returns (.kagent.api.v1.TriggerScheduledRunResponse);
  rpc ListScheduledRunExecutions(.kagent.api.v1.ListScheduledRunExecutionsRequest) returns (.kagent.api.v1.ListScheduledRunExecutionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetAppResourceRequest {
  agentos.mcp.v1.AppReference app = 1 [(buf.validate.field).required = true];
}

message GetAppResourceResponse {
  .kagent.api.v1.StructuredObject result = 1;
  string sandbox_origin = 2;
}

message CallAppToolRequest {
  agentos.mcp.v1.AppReference app = 1 [(buf.validate.field).required = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  .kagent.api.v1.StructuredObject arguments = 3;
}

message CallAppToolResponse {
  .kagent.api.v1.StructuredObject result = 1;
}

message ListAgentsRequest {
  // Activity from other authorized initiators; requires platform administration access.
  bool system_only = 1;
}

message ListAgentsResponse {
  repeated AgentSummary agents = 1;
}

message ListAgentRunsRequest {
  .kagent.api.v1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
  // Filters the Agent's own execution state.
  repeated agentos.execution.v1.ActivityState states = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Runs from other authorized initiators; requires platform administration access.
  bool system_only = 5;
}

message ListAgentRunsResponse {
  // Active runs include call names, intent, state and timing.
  repeated agentos.execution.v1.TaskRun runs = 1;
  string next_page_token = 2;
}

message ListTasksRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2 [(buf.validate.field).string.max_len = 2048];
  string query = 3 [(buf.validate.field).string.max_len = 200];
  repeated agentos.execution.v1.ActivityState states = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  .kagent.api.v1.ResourceReference agent = 5;
  // Only service-owned executions; requires platform administration access.
  bool system_only = 7;
  // Includes the page's compact current execution topology.
  bool include_execution_graph = 8;
}

message ListTasksResponse {
  repeated TaskSummary tasks = 1;
  string next_page_token = 2;
  int32 total_size = 3;
  ExecutionGraph execution_graph = 4;
}

message CancelTaskRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}
message CancelTaskResponse {}

message ListConversationsRequest {
  .kagent.api.v1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
  string query = 4 [(buf.validate.field).string.max_len = 200];
}

message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message WatchConversationRequest {
  .kagent.api.v1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  string context_id = 2 [(buf.validate.field).string.max_len = 128];
}

message WatchConversationResponse {
  Conversation conversation = 1;
}

message SendMessageRequest {
  .kagent.api.v1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  string context_id = 2 [(buf.validate.field).string.max_len = 128];
  string message_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string text = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
}

message SendMessageResponse {
  string context_id = 1;
  string task_id = 2;
}

message RespondInteractionRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string request_id = 2 [(buf.validate.field).string.min_len = 1];
  reserved 3;
  oneof decision {
    option (buf.validate.oneof).required = true;
    AnswerDecision answer = 4;
    .kagent.api.v1.ToolApprovalResponse approval = 5;
  }
}

message AnswerDecision {
  repeated Answer answers = 1 [(buf.validate.field).repeated.min_items = 1];
}

message RespondInteractionResponse {}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  repeated RoleDefinition roles = 1;
  repeated .kagent.api.v1.ToolServer tool_servers = 2;
  reserved 3;
  repeated .kagent.api.v1.ModelConfig model_configs = 4;
  repeated AgentTools agent_tools = 5;
  repeated .kagent.api.v1.Agent agents = 6;
  repeated .kagent.api.v1.Harness harnesses = 7;
  .kagent.api.v1.ResourceReference default_harness = 8;
}

message CreateRoleRequest {
  RoleDefinition role = 1 [(buf.validate.field).required = true];
  .kagent.api.v1.ResourceReference harness = 2;
}

message CreateRoleResponse {
  RoleDefinition role = 1;
}

message UpdateRoleRequest {
  option (buf.validate.message).cel = {
    id: "role.resource_version.required"
    message: "resource_version is required for an update"
    expression: "has(this.role) && this.role.resource_version != ''"
  };
  RoleDefinition role = 1 [(buf.validate.field).required = true];
}

message UpdateRoleResponse {
  RoleDefinition role = 1;
}

message ExplainToolsRequest {
  // Native template execution identity within the workspace.
  string identity = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
}

message ExplainToolsResponse {
  repeated ToolRequirement requirements = 1;
}
