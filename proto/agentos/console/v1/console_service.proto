syntax = "proto3";

package agentos.console.v1;

import "agentos/console/v1/access.proto";
import "agentos/console/v1/conversation.proto";
import "agentos/console/v1/engineer.proto";
import "agentos/console/v1/pack.proto";
import "agentos/console/v1/role.proto";
import "agentos/console/v1/speech.proto";
import "agentos/console/v1/task.proto";
import "agentos/console/v1/tool.proto";
import "agentos/execution/v1/state.proto";
import "agentos/execution/v1/task.proto";
import "agentos/governance/v1/governance.proto";
import "agentos/kagent/v1/wire.proto";
import "buf/validate/validate.proto";
import "kagent/api/v1alpha1/agents.proto";
import "kagent/api/v1alpha1/common.proto";
import "kagent/api/v1alpha1/harnesses.proto";
import "kagent/api/v1alpha1/models.proto";
import "kagent/api/v1alpha1/tools.proto";

// Workbench API. google.rpc.ErrorInfo.reason carries localization keys.
service ConsoleService {
  rpc GetAccessProfile(GetAccessProfileRequest) returns (GetAccessProfileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetSpeechCapabilities(GetSpeechCapabilitiesRequest) returns (GetSpeechCapabilitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc TranscribeAudio(TranscribeAudioRequest) returns (TranscribeAudioResponse);
  rpc SynthesizeSpeech(SynthesizeSpeechRequest) returns (stream SynthesizeSpeechResponse);
  rpc ListEngineers(ListEngineersRequest) returns (ListEngineersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sends the current operation tree, then again whenever it changes.
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetTaskRun(GetTaskRunRequest) returns (GetTaskRunResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // Owners edit personal task tags; shared service-owned tasks require tasks.manage.
  rpc UpdateTaskTags(UpdateTaskTagsRequest) returns (UpdateTaskTagsResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Sends the current conversation, then again whenever it changes.
  rpc WatchConversation(WatchConversationRequest) returns (stream WatchConversationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc RespondInteraction(RespondInteractionRequest) returns (RespondInteractionResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetPack(GetPackRequest) returns (GetPackResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // Tool bindings and execution confirmation requirements.
  rpc ExplainTools(ExplainToolsRequest) returns (ExplainToolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListEngineersRequest {}

message ListEngineersResponse {
  repeated Engineer engineers = 1;
}

message ListTasksRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 2 [(buf.validate.field).string.max_len = 2048];
  string query = 3 [(buf.validate.field).string.max_len = 200];
  repeated agentos.execution.v1.ActivityState states = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  string engineer = 5 [(buf.validate.field).string.max_len = 128];
  // All specified tags must be present.
  repeated string tags = 6 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 40
      }
    }
  }];
  // Only service-owned executions; requires platform administration access.
  bool system_only = 7;
}

message ListTasksResponse {
  repeated TaskSummary tasks = 1;
  string next_page_token = 2;
  int32 total_size = 3;
  // Tags from the caller's visible task roots, before filters and pagination.
  repeated string available_tags = 4;
}

message UpdateTaskTagsRequest {
  string task_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated string tags = 2 [(buf.validate.field).repeated = {
    max_items: 32
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 40
        pattern: "^\\S(.*\\S)?$"
      }
    }
  }];
  string tags_version = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]{0,18})$"];
}

message UpdateTaskTagsResponse {
  TaskSummary task = 1;
}

message WatchTaskRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}

message WatchTaskResponse {
  TaskDetail task = 1;
}

message GetTaskRunRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTaskRunResponse {
  agentos.execution.v1.TaskRun run = 1;
}

message CancelTaskRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}
message CancelTaskResponse {}

message ListConversationsRequest {
  .kagent.api.v1alpha1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
  string query = 4 [(buf.validate.field).string.max_len = 200];
}

message ListConversationsResponse {
  repeated ConversationSummary conversations = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message WatchConversationRequest {
  .kagent.api.v1alpha1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  string context_id = 2 [(buf.validate.field).string.max_len = 128];
}

message WatchConversationResponse {
  Conversation conversation = 1;
}

message SendMessageRequest {
  .kagent.api.v1alpha1.ResourceReference agent = 1 [(buf.validate.field).required = true];
  string context_id = 2 [(buf.validate.field).string.max_len = 128];
  string message_id = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string text = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8000
  }];
}

message SendMessageResponse {
  string context_id = 1;
  string task_id = 2;
}

message RespondInteractionRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string request_id = 2 [(buf.validate.field).string.min_len = 1];
  reserved 3;
  oneof decision {
    option (buf.validate.oneof).required = true;
    AnswerDecision answer = 4;
    agentos.kagent.v1.ToolApprovalResponse approval = 5;
  }
}

message AnswerDecision {
  repeated Answer answers = 1 [(buf.validate.field).repeated.min_items = 1];
}

message RespondInteractionResponse {}

message GetPackRequest {}
message GetPackResponse {
  Pack pack = 1;
}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  repeated RoleDefinition roles = 1;
  repeated .kagent.api.v1alpha1.ToolServer tool_servers = 2;
  reserved 3;
  repeated .kagent.api.v1alpha1.ModelConfig model_configs = 4;
  repeated EngineerTools engineer_tools = 5;
  repeated .kagent.api.v1alpha1.Agent agents = 6;
  repeated .kagent.api.v1alpha1.Harness harnesses = 7;
  .kagent.api.v1alpha1.ResourceReference default_harness = 8;
}

message CreateRoleRequest {
  RoleDefinition role = 1 [(buf.validate.field).required = true];
  .kagent.api.v1alpha1.ResourceReference harness = 2;
}

message CreateRoleResponse {
  RoleDefinition role = 1;
}

message UpdateRoleRequest {
  option (buf.validate.message).cel = {
    id: "role.resource_version.required"
    message: "resource_version is required for an update"
    expression: "has(this.role) && this.role.resource_version != ''"
  };
  RoleDefinition role = 1 [(buf.validate.field).required = true];
}

message UpdateRoleResponse {
  RoleDefinition role = 1;
}

message ExplainToolsRequest {
  string engineer = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
  }];
}

message ExplainToolsResponse {
  repeated ToolRequirement requirements = 1;
}

message ListApprovalsRequest {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string request_id = 2 [(buf.validate.field).string.min_len = 1];
}
message ListApprovalsResponse {
  repeated agentos.governance.v1.Approval approvals = 1;
}
