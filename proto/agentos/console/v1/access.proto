syntax = "proto3";

package agentos.console.v1;

import "agentos/authorization/v1/permission.proto";
import "kagent/api/v1/common.proto";

message AccessProfile {
  string workspace = 1;
  string subject = 2;
  reserved 3, 4;
  reserved "operate", "manage";
  kagent.api.v1.ResourceReference entry_agent = 5;
  repeated agentos.authorization.v1.Capability capabilities = 6;
  bool write = 7;
  // An offline grant lets background work continue after the caller's access token expires.
  bool delegated = 8;
  // Browser address that obtains the offline grant; `return_to` names a registered front end.
  string delegation_url = 9;
}

message GetAccessProfileRequest {}
message GetAccessProfileResponse {
  AccessProfile profile = 1;
}
