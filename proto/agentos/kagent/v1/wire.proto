syntax = "proto3";

package agentos.kagent.v1;

import "a2a.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

// JSON payloads that kagent v1.0.0-alpha11 defines as Go structs rather than
// protobuf: go/api/a2a/tool_activity.go, go/api/a2a/hitl.go and
// go/core/internal/mcp/server.go.

// Data of a DataPart whose kagent.dev/a2a/part-type is function_call or
// function_response.
message ToolActivity {
  string id = 1;
  string name = 2;
  google.protobuf.Value args = 3;
  google.protobuf.Value response = 4;
}

message HitlTool {
  string id = 1;
  string call_id = 2;
  string name = 3;
  google.protobuf.Struct args = 4;
}

message NestedHitlRequest {
  string subagent_name = 1;
  string task_id = 2;
  string context_id = 3;
  repeated HitlTool tools = 4;
}

message ToolApprovalRequest {
  string type = 1;
  string hint = 2;
  repeated HitlTool tools = 3;
  NestedHitlRequest nested = 4;
}

message ToolApproval {
  string id = 1;
  bool approved = 2;
  string rejection_reason = 3;
}

message ToolApprovalResponse {
  string type = 1;
  repeated ToolApproval approvals = 2;
}

message HitlQuestion {
  string question = 1;
  repeated string choices = 2;
  bool multiple = 3;
}

message AskUserRequest {
  string type = 1;
  string id = 2;
  repeated HitlQuestion questions = 3;
  NestedHitlRequest nested = 4;
}

message AskUserAnswer {
  repeated string answer = 1;
}

message AskUserResponse {
  string type = 1;
  string id = 2;
  repeated AskUserAnswer answers = 3;
}

// Native kagent MCP input shared by synchronous and background delegation.
message InvokeSessionInput {
  optional string session_id = 1 [
    json_name = "session_id",
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  optional string message = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  optional string message_id = 3 [
    json_name = "message_id",
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// Structured output of the kagent-collaboration invoke_session tool.
message InvokeSessionOutput {
  string session_id = 1;
  string task_id = 2;
  string context_id = 3;
  lf.a2a.v1.TaskState state = 4;
  string text = 5;
}

// Native kagent MCP structs from go/core/internal/mcp/server.go.
message SessionSummary {
  string id = 1;
  string agent = 2;
  string state = 3;
}

message ListSessionsOutput {
  repeated SessionSummary sessions = 1;
  string next_page_token = 2;
}
