syntax = "proto3";

package agentos.governance.v1;

import "buf/validate/validate.proto";

enum Governance {
  GOVERNANCE_UNSPECIFIED = 0;
  GOVERNANCE_APPROVAL = 1;
  GOVERNANCE_DIRECT = 2;
}

message Environment {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Governance governance = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Environment OAuth resource used by runtime authorization.
message EnvironmentConnection {
  Environment environment = 1 [(buf.validate.field).required = true];
  string issuer = 4 [(buf.validate.field).string = {
    uri: true
    prefix: "https://"
  }];
  string resource = 5 [(buf.validate.field).string = {
    uri: true
    prefix: "https://"
  }];
  reserved 6, 7;
  reserved "gateway", "apis";
}

// Unary Connect JSON APIs served by the environment's OAuth resource.
message EnvironmentApi {
  string service = 1 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"];
  repeated string read_methods = 2 [(buf.validate.field).repeated = {
    unique: true
    items: {string: {pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}}
  }];
  repeated string write_methods = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {string: {pattern: "^[A-Za-z_][A-Za-z0-9_]*$"}}
  }];
}

message GovernanceConfig {
  repeated EnvironmentConnection environments = 1;
}
