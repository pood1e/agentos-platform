syntax = "proto3";

package agentos.governance.v1;

import "buf/validate/validate.proto";

enum Governance {
  GOVERNANCE_UNSPECIFIED = 0;
  GOVERNANCE_APPROVAL = 1;
  GOVERNANCE_DIRECT = 2;
}

message Environment {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Governance governance = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Environment OAuth resource, gateway and service APIs.
message EnvironmentConnection {
  Environment environment = 1 [(buf.validate.field).required = true];
  string issuer = 4 [(buf.validate.field).string = {
    uri: true
    prefix: "https://"
  }];
  string resource = 5 [(buf.validate.field).string = {
    uri: true
    prefix: "https://"
  }];
  GatewayEndpoint gateway = 6;
  repeated EnvironmentApi apis = 7;
}

// Unary Connect JSON APIs served by the environment's OAuth resource.
message EnvironmentApi {
  string service = 1 [(buf.validate.field).string.min_len = 1];
  repeated string read_methods = 2;
  repeated string write_methods = 3;
}

message GatewayEndpoint {
  string address = 1 [(buf.validate.field).string.min_len = 1];
  uint32 port = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
  string tls_server_name = 3 [(buf.validate.field).string.min_len = 1];
}

message GovernanceConfig {
  repeated EnvironmentConnection environments = 1;
}
