[tool.ruff]
target-version = "py311"
line-length = 100
include = ["automation/**/*.py", "voice/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["gen/python", "automation"]
testpaths = ["automation/tests"]
asyncio_mode = "auto"
timeout = 60
