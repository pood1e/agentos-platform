stages: [verify, package, release]

include:
  - local: ci/build.gitlab-ci.yml
  - local: ci/runtime.gitlab-ci.yml
  - local: ci/langfuse.gitlab-ci.yml
  - local: ci/python.gitlab-ci.yml

.shell:
  tags: [$AGENTOS_SHELL_RUNNER]
  before_script:
    - . ci/shell-env.sh

verify:
  extends: .shell
  stage: verify
  before_script:
    - . ci/shell-env.sh
    - npm ci --prefer-offline
  script:
    - ci/with-postgres.sh npm run verify
    - ci/with-postgres.sh npm run test:e2e
  artifacts:
    when: always
    expire_in: 1 day
    paths: [build/, dist/, test-results/, playwright-report/]

authorization-check:
  extends: .shell
  stage: verify
  script: [npm run test:authorization]

deployment-check:
  extends: .shell
  stage: verify
  variables:
    ANSIBLE_CONFIG: deploy/ansible.cfg
    ANSIBLE_DEPRECATION_WARNINGS: "false"
  before_script:
    - . ci/shell-env.sh
    - . ci/python-env.sh deploy/requirements.txt deploy/requirements.yaml
  script:
    - .cache/venv/bin/ansible-lint deploy environments
    - .cache/venv/bin/ansible-playbook deploy/deploy.yaml --syntax-check
    - .cache/venv/bin/ansible-playbook deploy/validate.yaml --syntax-check
    - .cache/venv/bin/ansible-playbook environments/deploy.yaml --syntax-check
    - .cache/venv/bin/ansible-playbook environments/connect.yaml --syntax-check
    - ci/tools.sh
    - .cache/venv/bin/python ci/check-chart.py
    - .cache/venv/bin/python ci/check-environments.py

build-image:
  extends: .build-image
  needs:
    - verify
    - job: authorization-check
      artifacts: false
    - job: deployment-check
      artifacts: false

build-contracts:
  extends: .shell
  stage: package
  before_script:
    - . ci/shell-env.sh
    - . ci/python-env.sh contracts/requirements.txt
    - npm ci --prefer-offline
  script:
    - .cache/venv/bin/python ci/contracts.py
    - .cache/venv/bin/python ci/publish-contracts.py
  artifacts:
    paths: [dist/contracts/]
    expire_in: 7 days

release:
  extends: .shell
  stage: release
  needs:
    - build-image
    - build-evaluator
    - build-automation
    - job: build-controller
      optional: true
    - job: build-claude-harness
      optional: true
    - job: build-standard-harness
      optional: true
    - job: build-codex-harness
      optional: true
    - job: build-substrate-api
      optional: true
    - job: build-substrate-microvm
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH
  resource_group: agentos-release
  before_script:
    - . ci/shell-env.sh
    - . ci/python-env.sh ci/requirements.txt
    - ci/tools.sh
  script: [.cache/venv/bin/python ci/publish-chart.py]
  artifacts:
    paths: [dist/release.json]
    expire_in: 30 days
