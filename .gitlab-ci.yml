variables:
  FF_ENABLE_JOB_CLEANUP: "true"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore\(main\): release /'
      when: never
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: refs/heads/main
        paths: &build-paths
          - .gitlab-ci.yml
          - .github/**/*
          - .dockerignore
          - .env.example
          - compose.yaml
          - mise.*
          - package*.json
          - '*config*.*'
          - buf.*
          - index.html
          - LICENSE
          - charts/**/*
          - contracts/**/*
          - controller/**/*
          - ci/**/*
          - automation/**/*
          - deploy/**/*
          - environments/**/*
          - proto/**/*
          - server/**/*
          - shared/**/*
          - src/**/*
          - tests/**/*
          - third_party/**/*
          - voice/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *build-paths
    - when: never

include:
  - local: ci/toolchain.gitlab-ci.yml
  - local: ci/source-sync.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "GitHub source sync"'
  - local: ci/platform.gitlab-ci.yml
    rules:
      - if: '$CI_PIPELINE_SOURCE != "schedule" || $CI_PIPELINE_SCHEDULE_DESCRIPTION != "GitHub source sync"'
